/**
 * Döngüm - Güvenli Yerel Depolama (Storage) Katmanı
 * %100 Cihaz Hafızasında çalışır, sunucu veya bulut gerektirmez.
 * Çoklu profil & hesap yönetimi, PIN kodu koruması ve veri yedekleme özellikleri içerir.
 * WhatsApp, Safari QuickLook ve kısıtlı webview'larda çökmeyen SafeStorage koruması içerir.
 */

const STORAGE_KEYS = {
  PROFILES: 'dongum_profiles_v1',
  ACTIVE_PROFILE: 'dongum_active_profile_v1',
  DATA_PREFIX: 'dongum_data_v1_',
  GLOBAL_SETTINGS: 'dongum_global_settings_v1',
  LOCK_STATE: 'dongum_session_locked'
};

const DEFAULT_SETTINGS = {
  cycleLength: 28,
  periodLength: 5,
  lutealLength: 14,
  pin: null,
  pinEnabled: false,
  darkMode: false,
  notificationsEnabled: true,
  notificationSettings: {
    enabled: true,
    periodReminder: true,
    periodReminderDays: 2,
    latePeriodReminder: true,
    ovulationReminder: true,
    pmsReminder: true,
    dailyLogReminder: true,
    dailyLogTime: '20:30',
    moodReminder: true,
    moodReminderTime: '15:00',
    waterReminder: true,
    waterIntervalHours: 2,
    waterStartHour: 8,
    waterEndHour: 22
  },
  waterTarget: 2250,
  exerciseGoalDays: 3
};

const PROFILE_ROLES = [
  { id: 'personal', name: 'Kişisel Hesap', badge: 'Benim Döngüm' },
  { id: 'private', name: 'Gizli Kasa', badge: 'Şifreli Profil' },
  { id: 'family', name: 'Aile / Arkadaş', badge: 'Takip Hesabı' },
  { id: 'guest', name: 'Misafir / Danışan', badge: 'İkinci Hesap' }
];

const PROFILE_EMOJIS = ['🌸', '🌺', '🌙', '⭐', '🌿', '💎', '🦋', '🥑', '👑', '🦄', '🍓', '💜', '🎀', '🐱'];
const PROFILE_COLORS = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#6366f1', '#14b8a6'];

/**
 * Güvenli Depolama Adaptörü:
 * WhatsApp içi tarayıcı, iOS QuickLook veya özel gizli modlarda
 * localStorage erişimi engellenmiş olsa dahi uygulamanın çökmesini engeller.
 */
class SafeStorage {
  constructor() {
    this.memory = {};
    this.isAvailable = this.probe();
  }

  probe() {
    try {
      if (typeof window === 'undefined' || !window.localStorage) return false;
      const test = '__dongum_storage_probe__';
      window.localStorage.setItem(test, '1');
      window.localStorage.removeItem(test);
      return true;
    } catch (e) {
      console.warn('LocalStorage erişimi kısıtlı, güvenli bellek depolaması devrede:', e);
      return false;
    }
  }

  getItem(key) {
    if (this.isAvailable) {
      try {
        const val = window.localStorage.getItem(key);
        if (val !== null) return val;
      } catch (e) {
        // kısıtlı durum
      }
    }
    return this.memory[key] || null;
  }

  setItem(key, value) {
    const strVal = String(value);
    this.memory[key] = strVal;
    if (this.isAvailable) {
      try {
        window.localStorage.setItem(key, strVal);
      } catch (e) {
        // kota veya kısıtlama
      }
    }
  }

  removeItem(key) {
    delete this.memory[key];
    if (this.isAvailable) {
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        // hata yut
      }
    }
  }
}

const safeStorage = new SafeStorage();

class StorageManager {
  constructor() {
    this.init();
  }

  init() {
    // Profil listesi kontrolü
    let profiles = this.getProfiles();
    if (!profiles || profiles.length === 0) {
      const defaultProfile = {
        id: 'prof_' + Date.now(),
        name: 'Döngüm',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        createdAt: new Date().toISOString(),
        avatarColor: '#f43f5e',
        avatarEmoji: '🌸',
        pin: null,
        pinEnabled: false
      };
      profiles = [defaultProfile];
      this.saveProfiles(profiles);
      this.setActiveProfileId(defaultProfile.id);
      
      // İlk varsayılan profil verisi
      this.saveProfileData(defaultProfile.id, {
        settings: { ...DEFAULT_SETTINGS },
        days: {} // 'YYYY-MM-DD': { isPeriod, flow, symptoms, mood, notes, etc. }
      });
    } else {
      // Mevcut profillerin yeni alanlarını tamamla (Geriye dönük uyumluluk)
      let changed = false;
      profiles = profiles.map(p => {
        let pCopy = { ...p };
        if (!pCopy.avatarEmoji) {
          pCopy.avatarEmoji = '🌸';
          changed = true;
        }
        if (!pCopy.role) {
          pCopy.role = 'personal';
          pCopy.roleName = 'Kişisel Hesap';
          changed = true;
        }
        if (pCopy.pinEnabled === undefined) {
          pCopy.pinEnabled = false;
          pCopy.pin = null;
          changed = true;
        }
        return pCopy;
      });
      if (changed) {
        this.saveProfiles(profiles);
      }
    }

    // Aktif profil doğrula
    let activeId = this.getActiveProfileId();
    if (!activeId || !profiles.some(p => p.id === activeId)) {
      this.setActiveProfileId(profiles[0].id);
    }
  }

  // --- Profil & Hesap Yönetimi ---
  getProfiles() {
    try {
      const data = safeStorage.getItem(STORAGE_KEYS.PROFILES);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      console.error('Profiller okunamadı:', e);
      return [];
    }
  }

  saveProfiles(profiles) {
    safeStorage.setItem(STORAGE_KEYS.PROFILES, JSON.stringify(profiles));
  }

  getActiveProfileId() {
    return safeStorage.getItem(STORAGE_KEYS.ACTIVE_PROFILE);
  }

  setActiveProfileId(id) {
    safeStorage.setItem(STORAGE_KEYS.ACTIVE_PROFILE, id);
  }

  getActiveProfile() {
    const profiles = this.getProfiles();
    const activeId = this.getActiveProfileId();
    return profiles.find(p => p.id === activeId) || profiles[0];
  }

  getProfileById(id) {
    const profiles = this.getProfiles();
    return profiles.find(p => p.id === id) || null;
  }

  createProfile(optionsOrName, color = '#f43f5e') {
    let opts = {};
    if (typeof optionsOrName === 'string') {
      opts = {
        name: optionsOrName,
        avatarColor: color,
        avatarEmoji: '🌸',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        pin: null,
        pinEnabled: false,
        cycleLength: 28,
        periodLength: 5,
        lutealLength: 14
      };
    } else {
      opts = {
        name: 'Yeni Hesap',
        avatarColor: '#f43f5e',
        avatarEmoji: '🌸',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        pin: null,
        pinEnabled: false,
        cycleLength: 28,
        periodLength: 5,
        lutealLength: 14,
        ...optionsOrName
      };
    }

    const profiles = this.getProfiles();
    const newProfile = {
      id: 'prof_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
      name: opts.name.trim() || 'Yeni Hesap',
      role: opts.role || 'personal',
      roleName: opts.roleName || (PROFILE_ROLES.find(r => r.id === opts.role)?.name || 'Hesap'),
      avatarColor: opts.avatarColor || '#f43f5e',
      avatarEmoji: opts.avatarEmoji || '🌸',
      pin: opts.pin ? String(opts.pin) : null,
      pinEnabled: !!(opts.pin && opts.pinEnabled),
      createdAt: new Date().toISOString()
    };

    profiles.push(newProfile);
    this.saveProfiles(profiles);

    // Yeni profil boş verisi ve ayarları
    const initialSettings = {
      ...DEFAULT_SETTINGS,
      cycleLength: parseInt(opts.cycleLength, 10) || 28,
      periodLength: parseInt(opts.periodLength, 10) || 5,
      lutealLength: parseInt(opts.lutealLength, 10) || 14,
      pin: newProfile.pin,
      pinEnabled: newProfile.pinEnabled
    };

    this.saveProfileData(newProfile.id, {
      settings: initialSettings,
      days: {}
    });

    return newProfile;
  }

  switchProfile(profileId) {
    const profiles = this.getProfiles();
    const target = profiles.find(p => p.id === profileId);
    if (target) {
      this.setActiveProfileId(profileId);
      return true;
    }
    return false;
  }

  deleteProfile(profileId) {
    let profiles = this.getProfiles();
    if (profiles.length <= 1) {
      return { success: false, message: 'En az bir aktif profil/hesap bulunmalıdır!' };
    }

    profiles = profiles.filter(p => p.id !== profileId);
    this.saveProfiles(profiles);
    safeStorage.removeItem(STORAGE_KEYS.DATA_PREFIX + profileId);

    if (this.getActiveProfileId() === profileId) {
      this.setActiveProfileId(profiles[0].id);
    }

    return { success: true };
  }

  updateProfile(profileId, updates = {}) {
    const profiles = this.getProfiles();
    const target = profiles.find(p => p.id === profileId);
    if (target) {
      if (updates.name !== undefined) target.name = updates.name.trim() || target.name;
      if (updates.avatarColor !== undefined) target.avatarColor = updates.avatarColor;
      if (updates.avatarEmoji !== undefined) target.avatarEmoji = updates.avatarEmoji;
      if (updates.role !== undefined) {
        target.role = updates.role;
        target.roleName = updates.roleName || (PROFILE_ROLES.find(r => r.id === updates.role)?.name || target.roleName);
      }
      if (updates.pin !== undefined) {
        target.pin = updates.pin ? String(updates.pin) : null;
        target.pinEnabled = !!(target.pin && (updates.pinEnabled !== false));
        // Settings içine de yansıt
        const profData = this.getProfileData(profileId);
        profData.settings.pin = target.pin;
        profData.settings.pinEnabled = target.pinEnabled;
        this.saveProfileData(profileId, profData);
      } else if (updates.pinEnabled !== undefined) {
        target.pinEnabled = updates.pinEnabled;
        const profData = this.getProfileData(profileId);
        profData.settings.pinEnabled = target.pinEnabled;
        this.saveProfileData(profileId, profData);
      }

      this.saveProfiles(profiles);
      return true;
    }
    return false;
  }

  // --- Profil Bazlı PIN Güvenliği ---
  isProfilePinRequired(profileId = null) {
    const p = profileId ? this.getProfileById(profileId) : this.getActiveProfile();
    return !!(p && p.pinEnabled && p.pin);
  }

  checkProfilePin(profileId, enteredPin) {
    const p = profileId ? this.getProfileById(profileId) : this.getActiveProfile();
    if (!p || !p.pinEnabled || !p.pin) return true;
    return String(p.pin) === String(enteredPin);
  }

  setProfilePin(profileId, pin) {
    if (!pin || pin.length !== 4) return false;
    return this.updateProfile(profileId || this.getActiveProfileId(), { pin: String(pin), pinEnabled: true });
  }

  disableProfilePin(profileId) {
    return this.updateProfile(profileId || this.getActiveProfileId(), { pin: null, pinEnabled: false });
  }

  // --- Aktif Profil Verileri ---
  getProfileData(profileId = null) {
    const id = profileId || this.getActiveProfileId();
    try {
      const raw = safeStorage.getItem(STORAGE_KEYS.DATA_PREFIX + id);
      if (raw) {
        const parsed = JSON.parse(raw);
        const parsedSettings = parsed.settings || {};
        return {
          settings: {
            ...DEFAULT_SETTINGS,
            ...parsedSettings,
            notificationSettings: {
              ...DEFAULT_SETTINGS.notificationSettings,
              ...(parsedSettings.notificationSettings || {})
            }
          },
          days: parsed.days || {},
          notificationState: parsed.notificationState || {
            sentLog: {},
            inAppHistory: []
          }
        };
      }
    } catch (e) {
      console.error('Profil verisi okunamadı:', e);
    }
    return {
      settings: { ...DEFAULT_SETTINGS },
      days: {},
      notificationState: {
        sentLog: {},
        inAppHistory: []
      }
    };
  }

  saveProfileData(profileId, data) {
    const id = profileId || this.getActiveProfileId();
    try {
      safeStorage.setItem(STORAGE_KEYS.DATA_PREFIX + id, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error('Profil verisi kaydedilemedi:', e);
      return false;
    }
  }

  updateSettings(newSettings) {
    const data = this.getProfileData();
    data.settings = {
      ...data.settings,
      ...newSettings,
      notificationSettings: {
        ...(data.settings.notificationSettings || DEFAULT_SETTINGS.notificationSettings),
        ...(newSettings.notificationSettings || {})
      }
    };
    this.saveProfileData(null, data);

    // Eğer PIN ayarı buradan güncellendiyse profile da senkronize et
    if (newSettings.pin !== undefined || newSettings.pinEnabled !== undefined) {
      const activeId = this.getActiveProfileId();
      this.updateProfile(activeId, {
        pin: data.settings.pin,
        pinEnabled: data.settings.pinEnabled
      });
    }

    return data.settings;
  }

  // --- Bildirim Geçmişi & Yönetimi ---
  getNotificationState(profileId = null) {
    const data = this.getProfileData(profileId);
    return data.notificationState || { sentLog: {}, inAppHistory: [] };
  }

  saveNotificationState(profileId = null, state) {
    const data = this.getProfileData(profileId);
    data.notificationState = state;
    return this.saveProfileData(profileId, data);
  }

  addInAppNotification(profileId = null, notif) {
    const data = this.getProfileData(profileId);
    if (!data.notificationState) {
      data.notificationState = { sentLog: {}, inAppHistory: [] };
    }
    if (!data.notificationState.inAppHistory) {
      data.notificationState.inAppHistory = [];
    }

    const item = {
      id: 'notif_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
      title: notif.title,
      body: notif.body,
      type: notif.type || 'info',
      actionTab: notif.actionTab || 'home',
      date: notif.date || new Date().toISOString(),
      read: false
    };

    data.notificationState.inAppHistory.unshift(item);
    if (data.notificationState.inAppHistory.length > 30) {
      data.notificationState.inAppHistory = data.notificationState.inAppHistory.slice(0, 30);
    }
    this.saveProfileData(profileId, data);
    return item;
  }

  markNotificationRead(profileId = null, notifId = null) {
    const data = this.getProfileData(profileId);
    if (data.notificationState && data.notificationState.inAppHistory) {
      if (notifId) {
        const item = data.notificationState.inAppHistory.find(n => n.id === notifId);
        if (item) item.read = true;
      } else {
        data.notificationState.inAppHistory.forEach(n => n.read = true);
      }
      this.saveProfileData(profileId, data);
    }
  }

  clearInAppNotifications(profileId = null) {
    const data = this.getProfileData(profileId);
    if (data.notificationState) {
      data.notificationState.inAppHistory = [];
      this.saveProfileData(profileId, data);
    }
  }

  // --- Günlük Veri Kayıt & Silme ---
  getDayData(dateStr) {
    const data = this.getProfileData();
    return data.days[dateStr] || null;
  }

  saveDayData(dateStr, dayDetails) {
    const data = this.getProfileData();
    if (!data.days[dateStr]) {
      data.days[dateStr] = {};
    }
    data.days[dateStr] = {
      ...data.days[dateStr],
      ...dayDetails,
      updatedAt: new Date().toISOString()
    };
    this.saveProfileData(null, data);
    return data.days[dateStr];
  }

  deleteDayData(dateStr) {
    const data = this.getProfileData();
    if (data.days[dateStr]) {
      delete data.days[dateStr];
      this.saveProfileData(null, data);
      return true;
    }
    return false;
  }

  // Günün sadece regl kaydını sıfırlar / kaldırır
  clearPeriodForDay(dateStr) {
    const data = this.getProfileData();
    if (data.days[dateStr]) {
      data.days[dateStr].isPeriod = false;
      data.days[dateStr].flow = null;
      data.days[dateStr].isManual = true;
      this.saveProfileData(null, data);
      return true;
    }
    return false;
  }

  // --- Su İçme Takip Metotları ---
  getWaterForDay(dateStr) {
    const day = this.getDayData(dateStr);
    return (day && typeof day.waterIntake === 'number') ? day.waterIntake : 0;
  }

  logWater(dateStr, deltaMl) {
    const current = this.getWaterForDay(dateStr);
    const newAmount = Math.max(0, current + deltaMl);
    return this.setWater(dateStr, newAmount);
  }

  setWater(dateStr, amountMl) {
    const sanitized = Math.max(0, Math.round(amountMl));
    this.saveDayData(dateStr, { waterIntake: sanitized });
    return sanitized;
  }

  getTodayWater(dateStr = null) {
    const d = dateStr || (new Date().toISOString().split('T')[0]);
    return this.getWaterForDay(d);
  }

  saveWaterIntake(dateStr, amountMl) {
    return this.setWater(dateStr, amountMl);
  }

  getWeeklyWaterHistory(numDays = 7) {
    const profileData = this.getProfileData();
    const days = profileData.days || {};
    const target = profileData.settings?.waterTarget || 2250;
    const result = [];
    const now = new Date();

    const dayShortNames = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];

    for (let i = numDays - 1; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dayNum = String(d.getDate()).padStart(2, '0');
      const dateKey = `${y}-${m}-${dayNum}`;

      const amount = (days[dateKey] && typeof days[dateKey].waterIntake === 'number') ? days[dateKey].waterIntake : 0;
      const percent = Math.min(150, Math.round((amount / target) * 100));

      result.push({
        dateStr: dateKey,
        dayName: dayShortNames[d.getDay()],
        dayNumber: d.getDate(),
        isToday: (i === 0),
        amount: amount,
        target: target,
        percent: percent,
        reached: amount >= target
      });
    }

    return result;
  }

  // --- Egzersiz & Fitness Takip Metotları ---
  getExerciseForDay(dateStr) {
    const day = this.getDayData(dateStr);
    return (day && day.exercise) ? day.exercise : null;
  }

  logExercise(dateStr, exerciseData) {
    const record = {
      ...exerciseData,
      loggedAt: new Date().toISOString()
    };
    this.saveDayData(dateStr, { exercise: record });
    return record;
  }

  deleteExercise(dateStr) {
    const data = this.getProfileData();
    if (data.days[dateStr] && data.days[dateStr].exercise) {
      delete data.days[dateStr].exercise;
      this.saveProfileData(null, data);
      return true;
    }
    return false;
  }

  getRecentExercises(limit = 15) {
    const profileData = this.getProfileData();
    const days = profileData.days || {};
    const exercises = [];

    for (const [dateStr, dayData] of Object.entries(days)) {
      if (dayData && dayData.exercise) {
        exercises.push({
          dateStr: dateStr,
          ...dayData.exercise
        });
      }
    }

    // Tarihe göre yeniden eskiye sırala
    exercises.sort((a, b) => b.dateStr.localeCompare(a.dateStr));
    return exercises.slice(0, limit);
  }

  getExerciseStreak() {
    const profileData = this.getProfileData();
    const days = profileData.days || {};
    const now = new Date();

    const formatDate = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${dayNum(d)}`;
      function dayNum(str) { return str; }
    };

    let streak = 0;
    let checkDate = new Date(now);

    // Bugün egzersiz var mı?
    const todayStr = formatDate(checkDate);
    const hasToday = Boolean(days[todayStr] && days[todayStr].exercise);

    if (hasToday) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else {
      // Bugün henüz yapılmadıysa dünden itibaren streak kontrol et
      checkDate.setDate(checkDate.getDate() - 1);
    }

    // Geriye doğru ardışık günleri say
    while (true) {
      const key = formatDate(checkDate);
      if (days[key] && days[key].exercise) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      } else {
        break;
      }
    }

    return {
      currentStreak: streak,
      hasExerciseToday: hasToday
    };
  }

  getMonthlyFitnessStats() {
    const profileData = this.getProfileData();
    const days = profileData.days || {};
    const now = new Date();
    const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    let totalWorkouts = 0;
    let totalMinutes = 0;
    const typeCounts = {};

    for (const [dateStr, dayData] of Object.entries(days)) {
      if (dateStr.startsWith(currentMonthKey) && dayData && dayData.exercise) {
        totalWorkouts++;
        const dur = parseInt(dayData.exercise.duration, 10) || 0;
        totalMinutes += dur;
        const t = dayData.exercise.type || 'other';
        typeCounts[t] = (typeCounts[t] || 0) + 1;
      }
    }

    let topType = null;
    let topCount = 0;
    for (const [t, c] of Object.entries(typeCounts)) {
      if (c > topCount) {
        topCount = c;
        topType = t;
      }
    }

    return {
      monthKey: currentMonthKey,
      totalWorkouts,
      totalMinutes,
      topType,
      topCount
    };
  }

  // Genel PIN uyumluluk metotları (app.js ile uyum)
  isPinRequired() {
    return this.isProfilePinRequired(this.getActiveProfileId());
  }

  checkPin(enteredPin) {
    return this.checkProfilePin(this.getActiveProfileId(), enteredPin);
  }

  setPin(pin) {
    return this.setProfilePin(this.getActiveProfileId(), pin);
  }

  disablePin() {
    return this.disableProfilePin(this.getActiveProfileId());
  }

  // --- Tekil Profil Dışa / İçe Aktar (Hesap Paylaşımı) ---
  exportSingleProfile(profileId = null) {
    const id = profileId || this.getActiveProfileId();
    const profile = this.getProfileById(id);
    const data = this.getProfileData(id);

    const payload = {
      format: 'dongum_single_account_v1',
      exportedAt: new Date().toISOString(),
      profile: profile,
      data: data
    };

    return JSON.stringify(payload, null, 2);
  }

  importSingleProfile(jsonString) {
    try {
      const payload = JSON.parse(jsonString);
      if (!payload || !payload.profile || !payload.data) {
        throw new Error('Geçersiz hesap aktarım formatı!');
      }

      const p = payload.profile;
      const newId = 'prof_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
      const newProfile = {
        ...p,
        id: newId,
        name: (p.name || 'İçe Aktarılan Hesap') + ' (Yeni)',
        createdAt: new Date().toISOString()
      };

      const profiles = this.getProfiles();
      profiles.push(newProfile);
      this.saveProfiles(profiles);

      this.saveProfileData(newId, payload.data);
      this.setActiveProfileId(newId);

      return { success: true, profile: newProfile };
    } catch (e) {
      console.error('Hesap yükleme hatası:', e);
      return { success: false, message: e.message };
    }
  }

  // --- Tüm Profilleri Dışa / İçe Aktarma (Full Backup) ---
  exportBackup() {
    const profiles = this.getProfiles();
    const backup = {
      version: '2.0',
      exportedAt: new Date().toISOString(),
      profiles: profiles,
      profilesData: {}
    };

    for (const p of profiles) {
      backup.profilesData[p.id] = this.getProfileData(p.id);
    }

    return JSON.stringify(backup, null, 2);
  }

  importBackup(jsonString) {
    try {
      const backup = JSON.parse(jsonString);
      if (!backup || !backup.profiles || !backup.profilesData) {
        throw new Error('Geçersiz yedek dosyası formatı!');
      }

      this.saveProfiles(backup.profiles);
      for (const p of backup.profiles) {
        if (backup.profilesData[p.id]) {
          this.saveProfileData(p.id, backup.profilesData[p.id]);
        }
      }

      if (backup.profiles.length > 0) {
        this.setActiveProfileId(backup.profiles[0].id);
      }

      return { success: true, count: backup.profiles.length };
    } catch (e) {
      console.error('Yedek yükleme hatası:', e);
      return { success: false, message: e.message };
    }
  }

  // Aktif profilin tüm verilerini sıfırla
  resetActiveProfile() {
    const activeId = this.getActiveProfileId();
    this.saveProfileData(activeId, {
      settings: { ...DEFAULT_SETTINGS },
      days: {}
    });
  }
}

const storage = new StorageManager();


/**
 * Döngüm - Biyolojik Modelleme ve Döngü Tahminleme Motoru
 * Kullanıcının girdiği verilere göre ortalama süreleri, düzenlilik skorunu
 * ve fazları (Regl, Foliküler, Ovülasyon, Luteal, PMS) hesaplar.
 * Manuel giriş ve silmelere göre anında kendini optimize eder.
 */

class CycleEngine {
  constructor(storageManager) {
    this.storage = storageManager;
  }

  // Tarih yardımcıları (Saat dilimi kaymalarını önlemek için YYYY-MM-DD bazlı)
  static parseDateStr(str) {
    if (!str) return new Date();
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  static formatDateStr(d) {
    if (!(d instanceof Date) || isNaN(d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  static addDays(dateStrOrObj, days) {
    const d = typeof dateStrOrObj === 'string' 
      ? CycleEngine.parseDateStr(dateStrOrObj) 
      : new Date(dateStrOrObj);
    d.setDate(d.getDate() + days);
    return CycleEngine.formatDateStr(d);
  }

  static diffDays(dateStrA, dateStrB) {
    const da = CycleEngine.parseDateStr(dateStrA);
    const db = CycleEngine.parseDateStr(dateStrB);
    const msDiff = da.getTime() - db.getTime();
    return Math.round(msDiff / (1000 * 60 * 60 * 24));
  }

  // --- Geçmiş Dönemleri Kümeleme (Clustering) ---
  // Kullanıcının gün gün girdiği regl kayıtlarını tespit eder
  getPeriodClusters() {
    const profileData = this.storage.getProfileData();
    const days = profileData.days || {};

    // Sadece regl olarak işaretli günleri sırala
    const periodDates = Object.keys(days)
      .filter(dateStr => days[dateStr].isPeriod)
      .sort();

    if (periodDates.length === 0) return [];

    const clusters = [];
    let currentCluster = [periodDates[0]];

    for (let i = 1; i < periodDates.length; i++) {
      const prevDate = periodDates[i - 1];
      const currDate = periodDates[i];
      const gap = CycleEngine.diffDays(currDate, prevDate);

      // Eğer ardışık ise ya da arada açıkça regl olmadığı belirtilmemiş 1 günlük boşluk varsa aynı döneme dahil et
      const intermediateDate = CycleEngine.addDays(prevDate, 1);
      const isIntermediateExplicitlyNonPeriod = days[intermediateDate] && days[intermediateDate].isPeriod === false;

      if (gap === 1 || (gap === 2 && !isIntermediateExplicitlyNonPeriod)) {
        currentCluster.push(currDate);
      } else {
        clusters.push({
          startDate: currentCluster[0],
          endDate: currentCluster[currentCluster.length - 1],
          dates: [...currentCluster],
          duration: CycleEngine.diffDays(currentCluster[currentCluster.length - 1], currentCluster[0]) + 1
        });
        currentCluster = [currDate];
      }
    }

    if (currentCluster.length > 0) {
      clusters.push({
        startDate: currentCluster[0],
        endDate: currentCluster[currentCluster.length - 1],
        dates: [...currentCluster],
        duration: CycleEngine.diffDays(currentCluster[currentCluster.length - 1], currentCluster[0]) + 1
      });
    }

    return clusters;
  }

  // --- İstatistikler ve Uyarlanabilir Süreler ---
  calculateStats() {
    const profileData = this.storage.getProfileData();
    const baseSettings = profileData.settings || {};
    const clusters = this.getPeriodClusters();

    let avgPeriodLength = baseSettings.periodLength || 5;
    let avgCycleLength = baseSettings.cycleLength || 28;
    let cycleDurations = [];
    let periodDurations = clusters.map(c => c.duration).filter(d => d >= 2 && d <= 12);

    if (periodDurations.length > 0) {
      // En son döngülere daha yüksek ağırlık veren uyarlanabilir biyolojik ağırlıklı ortalama
      let weightSum = 0;
      let weightedTotal = 0;
      periodDurations.forEach((dur, idx) => {
        const w = idx + 1;
        weightedTotal += dur * w;
        weightSum += w;
      });
      avgPeriodLength = Math.round(weightedTotal / weightSum);
      // Makul fizyolojik sınırlar (2 ila 10 gün)
      avgPeriodLength = Math.max(2, Math.min(10, avgPeriodLength));
    }

    // Döngü aralıklarını hesapla (İki başlangıç tarihi arası)
    if (clusters.length >= 2) {
      for (let i = 0; i < clusters.length - 1; i++) {
        const interval = CycleEngine.diffDays(clusters[i + 1].startDate, clusters[i].startDate);
        // Makul biyolojik aralık (18 ila 60 gün)
        if (interval >= 18 && interval <= 60) {
          cycleDurations.push(interval);
        }
      }

      if (cycleDurations.length > 0) {
        // Son döngülere daha yüksek ağırlık veren ağırlıklı ortalama
        let weightSum = 0;
        let weightedTotal = 0;
        cycleDurations.forEach((dur, idx) => {
          const w = idx + 1;
          weightedTotal += dur * w;
          weightSum += w;
        });
        avgCycleLength = Math.round(weightedTotal / weightSum);
        avgCycleLength = Math.max(21, Math.min(45, avgCycleLength));
      }
    }

    // Düzenlilik Skoru ve Standart Sapma
    let stdDev = 0;
    let regularityScore = 95; // Varsayılan sağlıklı başlangıç puanı

    if (cycleDurations.length >= 2) {
      const mean = cycleDurations.reduce((a, b) => a + b, 0) / cycleDurations.length;
      const variance = cycleDurations.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / cycleDurations.length;
      stdDev = Math.sqrt(variance);

      // Sapma arttıkça skor düşer
      regularityScore = Math.max(40, Math.min(100, Math.round(100 - (stdDev * 8))));
    } else if (clusters.length === 1) {
      regularityScore = 92;
    }

    return {
      averageCycleLength: avgCycleLength,
      averagePeriodLength: avgPeriodLength,
      lutealLength: baseSettings.lutealLength || 14,
      totalLoggedCycles: clusters.length,
      cycleDurations,
      regularityScore,
      stdDev: Math.round(stdDev * 10) / 10,
      lastPeriod: clusters.length > 0 ? clusters[clusters.length - 1] : null
    };
  }

  calculateStatistics() {
    return this.calculateStats();
  }

  /**
   * Takvim üzerinde yapılan işaretlemeler sonrasında ayarlar sekmesindeki
   * döngü parametrelerini (döngü süresi, regl süresi) hesaplanan gerçek biyolojik verilere göre otomatik revize eder.
   */
  syncSettingsFromCalendarData() {
    const profileData = this.storage.getProfileData();
    const clusters = this.getPeriodClusters();
    const stats = this.calculateStats();

    let updated = false;
    const newSettings = { ...profileData.settings };

    // Eğer en az 1 regl dönemi kaydedilmişse
    if (clusters.length >= 1) {
      const lastCluster = clusters[clusters.length - 1];
      // Eğer son dönemin süresi sistemdeki varsayılan süreden farklıysa (örneğin 7 gün yerine 5 veya 6 gün sürdüyse)
      // veya hesaplanan ağırlıklı ortalama revize edildiyse yeni dönemin verilerine göre güncelle:
      let targetPeriodLength = stats.averagePeriodLength;
      if (lastCluster && lastCluster.duration) {
        // İçinde bulunulan son dönem sistemdeki süreden daha kısa sürdüyse ya da tek dönem varsa
        // yeni dönemin gerçek süresini doğrudan benimse
        if (clusters.length === 1 || lastCluster.duration < (newSettings.periodLength || 5)) {
          targetPeriodLength = Math.max(2, Math.min(10, lastCluster.duration));
        }
      }

      if (targetPeriodLength && newSettings.periodLength !== targetPeriodLength) {
        newSettings.periodLength = targetPeriodLength;
        updated = true;
      }
    }

    // Eğer en az 2 regl dönemi kaydedilmişse döngü aralığını otomatik revize et
    if (clusters.length >= 2 && stats.averageCycleLength) {
      if (newSettings.cycleLength !== stats.averageCycleLength) {
        newSettings.cycleLength = stats.averageCycleLength;
        updated = true;
      }
    }

    if (updated) {
      this.storage.updateSettings(newSettings);
      console.log('Döngü parametreleri takvim verilerine göre otomatik revize edildi:', {
        cycleLength: newSettings.cycleLength,
        periodLength: newSettings.periodLength,
        cyclesCount: clusters.length
      });
    }

    return { updated, settings: newSettings, stats };
  }

  // --- Akıllı Otomatik Doldurma ve Manuel Müdahale ---
  /**
   * Kullanıcı belirli bir tarihe regl başlangıcı girdiğinde,
   * ortalama regl süresine göre diğer günleri işaretler.
   */
  logPeriodStart(startDateStr, flow = 'medium') {
    const stats = this.calculateStats();
    const periodDays = stats.averagePeriodLength;
    const profileData = this.storage.getProfileData();

    // Başlangıç gününü manuel kayıt olarak işle
    this.storage.saveDayData(startDateStr, {
      isPeriod: true,
      flow: flow,
      isManual: true,
      isPredicted: false
    });

    // Takip eden günleri doldur (eğer kullanıcı daha önce bu günleri manuel silmediyse)
    for (let i = 1; i < periodDays; i++) {
      const nextDateStr = CycleEngine.addDays(startDateStr, i);
      const existing = profileData.days[nextDateStr];

      // Eğer kullanıcı bizzat kapatmamışsa otomatik tahmini akış doldur
      if (!existing || (!existing.isManual && !existing.isPeriod)) {
        let autoFlow = 'medium';
        if (i === 1) autoFlow = 'heavy';
        else if (i === periodDays - 1) autoFlow = 'light';
        else if (i >= periodDays - 2) autoFlow = 'medium';

        this.storage.saveDayData(nextDateStr, {
          isPeriod: true,
          flow: autoFlow,
          isManual: false,
          isPredicted: true
        });
      }
    }

    this.syncSettingsFromCalendarData();
    return this.calculateStats();
  }

  /**
   * Belirli bir günü manuel olarak regl yap, kaldır veya sil.
   * Eğer kullanıcı regl dönemini erken bitirdiyse (ör. 6. gün silindiyse),
   * sonraki tahmin edilen günleri otomatik temizler ve model hemen yeni süreye göre güncellenir.
   */
  togglePeriodDay(dateStr, isPeriod, flow = 'medium') {
    const profileData = this.storage.getProfileData();
    const days = profileData.days || {};
    const clusters = this.getPeriodClusters();

    if (isPeriod) {
      this.storage.saveDayData(dateStr, {
        isPeriod: true,
        flow: flow || 'medium',
        isManual: true,
        isPredicted: false
      });
    } else {
      // 1. Bu günün regl kaydını manuel kaldır
      this.storage.saveDayData(dateStr, {
        isPeriod: false,
        flow: null,
        isManual: true,
        isPredicted: false
      });

      // 2. Bu günün ait olduğu veya ilişkili olduğu regl kümesini tespit et
      // Örneğin regl 1. gün başladı ve 7 gün süreceği öngörüldü (1..7).
      // Kullanıcı 6. günü takvimden kaldırdığında, bu döneme ait sonraki otomatik tahmin edilen
      // günleri (7. gün vb.) otomatik temizle. Böylece dönem 5 gün olarak sonlanır ve yeni döngüye göre modellenir.
      const targetCluster = clusters.find(c => {
        return c.dates.includes(dateStr) || (dateStr >= c.startDate && dateStr <= c.endDate);
      });

      const clusterRef = targetCluster || [...clusters].reverse().find(c => c.startDate <= dateStr && CycleEngine.diffDays(dateStr, c.startDate) <= 12);

      if (clusterRef) {
        const clusterStart = clusterRef.startDate;
        for (let i = 0; i <= 14; i++) {
          const dStr = CycleEngine.addDays(clusterStart, i);
          if (dStr >= dateStr) {
            const dayEntry = days[dStr];
            if (dayEntry && dayEntry.isPeriod) {
              this.storage.saveDayData(dStr, {
                isPeriod: false,
                flow: null,
                isManual: false,
                isPredicted: false
              });
            }
          }
        }
      }
    }
 
    this.syncSettingsFromCalendarData();
    return this.calculateStats();
  }

  // --- İleriye Dönük Döngü ve Faz Projeksiyonları ---
  /**
   * Gelecek N döngüyü ve her döngünün ovülasyon, doğurganlık ve PMS günlerini hesaplar.
   */
  getProjections(monthsAhead = 6) {
    const stats = this.calculateStats();
    const lastPeriod = stats.lastPeriod;

    if (!lastPeriod) {
      return [];
    }

    const projections = [];
    let currentStart = lastPeriod.startDate;
    const today = CycleEngine.formatDateStr(new Date());

    // İleriye doğru hesapla
    for (let c = 0; c < monthsAhead; c++) {
      const nextStart = CycleEngine.addDays(currentStart, stats.averageCycleLength);
      const nextEnd = CycleEngine.addDays(nextStart, stats.averagePeriodLength - 1);
      
      // Yumurtlama: Bir sonraki regl başlangıcından luteal faz (genelde 14 gün) öncesi
      const ovulationDate = CycleEngine.addDays(nextStart, -stats.lutealLength);
      
      // Doğurganlık penceresi: Ovülasyondan 5 gün önce başlar, 1 gün sonra biter
      const fertileStart = CycleEngine.addDays(ovulationDate, -5);
      const fertileEnd = CycleEngine.addDays(ovulationDate, 1);

      // PMS Dönemi: Yeni regl başlangıcından 6 gün önce
      const pmsStart = CycleEngine.addDays(nextStart, -6);
      const pmsEnd = CycleEngine.addDays(nextStart, -1);

      projections.push({
        cycleIndex: c + 1,
        periodStart: nextStart,
        periodEnd: nextEnd,
        ovulationDate: ovulationDate,
        fertileStart: fertileStart,
        fertileEnd: fertileEnd,
        pmsStart: pmsStart,
        pmsEnd: pmsEnd,
        cycleLength: stats.averageCycleLength,
        periodLength: stats.averagePeriodLength
      });

      currentStart = nextStart;
    }

    return projections;
  }

  // --- Belirli Bir Günün Analiz ve Durumu (Day Inspector) ---
  getDayStatus(dateStr) {
    const stats = this.calculateStats();
    const profileData = this.storage.getProfileData();
    const dayData = profileData.days[dateStr] || null;
    const todayStr = CycleEngine.formatDateStr(new Date());

    // 1. Kullanıcı kaydı varsa
    if (dayData && dayData.isPeriod) {
      return {
        dateStr,
        phase: 'period',
        phaseName: 'Regl Dönemi',
        phaseBadge: 'Regl',
        color: '#f43f5e',
        flow: dayData.flow || 'medium',
        isManual: !!dayData.isManual,
        isPredicted: !!dayData.isPredicted,
        pregnancyChance: 'Çok Düşük',
        description: 'Döngünüzün başlangıç ve kanama evresi.',
        dayData
      };
    }

    // 2. Tahmin ve Projeksiyonları İncele
    const projections = this.getProjections(12);
    const lastPeriod = stats.lastPeriod;

    // Eğer geçmiş bir regl döneminin içinde veya güncel döngünün içindeyse
    if (lastPeriod) {
      const daysSinceStart = CycleEngine.diffDays(dateStr, lastPeriod.startDate);
      
      // Son dönemin ovülasyon ve doğurganlık tarihleri
      const expectedNext = CycleEngine.addDays(lastPeriod.startDate, stats.averageCycleLength);
      const currentOvulation = CycleEngine.addDays(expectedNext, -stats.lutealLength);
      const currentFertileStart = CycleEngine.addDays(currentOvulation, -5);
      const currentFertileEnd = CycleEngine.addDays(currentOvulation, 1);
      const currentPmsStart = CycleEngine.addDays(expectedNext, -6);
      const currentPmsEnd = CycleEngine.addDays(expectedNext, -1);

      // Güncel döngü ovülasyonu kontrolü
      if (dateStr === currentOvulation) {
        return {
          dateStr,
          phase: 'ovulation',
          phaseName: 'Yumurtlama Günü (Ovülasyon)',
          phaseBadge: 'Ovülasyon',
          color: '#eab308',
          pregnancyChance: 'En Yüksek (Zirve)',
          description: 'Gebe kalma ihtimalinin en yüksek olduğu gün.',
          dayData
        };
      }

      // Doğurganlık penceresi kontrolü
      if (dateStr >= currentFertileStart && dateStr <= currentFertileEnd) {
        return {
          dateStr,
          phase: 'fertile',
          phaseName: 'Doğurganlık Penceresi',
          phaseBadge: 'Doğurgan',
          color: '#a855f7',
          pregnancyChance: 'Yüksek',
          description: 'Doğurganlık şansının yüksek olduğu verimli günler.',
          dayData
        };
      }

      // PMS kontrolü
      if (dateStr >= currentPmsStart && dateStr <= currentPmsEnd) {
        return {
          dateStr,
          phase: 'pms',
          phaseName: 'PMS (Regl Öncesi)',
          phaseBadge: 'PMS',
          color: '#fb923c',
          pregnancyChance: 'Düşük',
          description: 'Duygusal ve fiziksel belirtilerin yaşanabildiği dönem.',
          dayData
        };
      }

      // Foliküler Faz kontrolü (Regl bittiği günden doğurganlık penceresine kadar)
      if (dateStr > lastPeriod.endDate && dateStr < currentFertileStart) {
        return {
          dateStr,
          phase: 'follicular',
          phaseName: 'Foliküler Faz',
          phaseBadge: 'Foliküler',
          color: '#0d9488',
          pregnancyChance: 'Düşük',
          description: 'Östrojenin yükseldiği, enerjinin ve yenilenmenin arttığı evre.',
          dayData
        };
      }

      // Luteal Faz kontrolü (Doğurgan pencere bittikten PMS başlangıcına kadar)
      if (dateStr > currentFertileEnd && dateStr < currentPmsStart) {
        return {
          dateStr,
          phase: 'luteal',
          phaseName: 'Luteal Faz',
          phaseBadge: 'Luteal',
          color: '#c084fc',
          pregnancyChance: 'Düşük',
          description: 'Progesteron hormonunun devrede olduğu iç denge ve dinlenme evresi.',
          dayData
        };
      }
    }

    // İleriye dönük projeksiyonlarda kontrol et
    for (const proj of projections) {
      if (dateStr >= proj.periodStart && dateStr <= proj.periodEnd) {
        return {
          dateStr,
          phase: 'predicted_period',
          phaseName: 'Tahmini Regl',
          phaseBadge: 'Tahmini Regl',
          color: '#fb7185',
          isPredicted: true,
          pregnancyChance: 'Düşük',
          description: 'Modelin tahmin ettiği sonraki döngü başlangıcı.',
          dayData
        };
      }

      if (dateStr === proj.ovulationDate) {
        return {
          dateStr,
          phase: 'ovulation',
          phaseName: 'Tahmini Yumurtlama',
          phaseBadge: 'Ovülasyon',
          color: '#eab308',
          pregnancyChance: 'En Yüksek (Zirve)',
          description: 'Tahmini ovülasyon günü.',
          dayData
        };
      }

      if (dateStr >= proj.fertileStart && dateStr <= proj.fertileEnd) {
        return {
          dateStr,
          phase: 'fertile',
          phaseName: 'Tahmini Doğurganlık',
          phaseBadge: 'Doğurgan',
          color: '#a855f7',
          pregnancyChance: 'Yüksek',
          description: 'Tahmini doğurganlık günleri.',
          dayData
        };
      }

      if (dateStr >= proj.pmsStart && dateStr <= proj.pmsEnd) {
        return {
          dateStr,
          phase: 'pms',
          phaseName: 'Tahmini PMS',
          phaseBadge: 'PMS',
          color: '#fb923c',
          pregnancyChance: 'Düşük',
          description: 'Tahmini regl öncesi dönem.',
          dayData
        };
      }

      if (dateStr > proj.periodEnd && dateStr < proj.fertileStart) {
        return {
          dateStr,
          phase: 'follicular',
          phaseName: 'Tahmini Foliküler Faz',
          phaseBadge: 'Foliküler',
          color: '#0d9488',
          pregnancyChance: 'Düşük',
          description: 'Tahmini östrojen yükseliş ve tazelenme evresi.',
          dayData
        };
      }

      if (dateStr > proj.fertileEnd && dateStr < proj.pmsStart) {
        return {
          dateStr,
          phase: 'luteal',
          phaseName: 'Tahmini Luteal Faz',
          phaseBadge: 'Luteal',
          color: '#c084fc',
          pregnancyChance: 'Düşük',
          description: 'Tahmini dinlenme ve progesteron evresi.',
          dayData
        };
      }
    }

    // Normal / Genel Döngü Günü
    return {
      dateStr,
      phase: 'normal',
      phaseName: 'Normal Gün',
      phaseBadge: 'Döngü',
      color: '#94a3b8',
      pregnancyChance: 'Düşük',
      description: 'Stabil hormon dengesi dönemi.',
      dayData
    };
  }

  // --- Bugünün Özet Durumu (Home Screen Widget) ---
  getTodaySummary() {
    const todayStr = CycleEngine.formatDateStr(new Date());
    const stats = this.calculateStats();
    const dayStatus = this.getDayStatus(todayStr);

    let cycleDayNumber = 1;
    let daysUntilNext = null;
    let nextPeriodDate = null;

    if (stats.lastPeriod) {
      const daysDiff = CycleEngine.diffDays(todayStr, stats.lastPeriod.startDate);
      cycleDayNumber = Math.max(1, daysDiff + 1);

      nextPeriodDate = CycleEngine.addDays(stats.lastPeriod.startDate, stats.averageCycleLength);
      daysUntilNext = CycleEngine.diffDays(nextPeriodDate, todayStr);
    }

    return {
      todayStr,
      cycleDayNumber,
      daysUntilNext,
      nextPeriodDate,
      dayStatus,
      stats
    };
  }
}


/**
 * Döngüm - Akıllı Bildirim & Hatırlatıcı Yöneticisi (NotificationManager)
 * 
 * - Web Notification API & Service Worker Entegrasyonu
 * - Çevrimdışı ve PWA Kilit Ekranı Hatırlatıcıları
 * - Akıllı Biyolojik Döngü Uyarıları (Yaklaşan Regl, Gecikme, Ovülasyon, PMS)
 * - Yaşam Tarzı Hatırlatıcıları (Günlük Semptom/Ruh Hali, Su Hidrasyonu, Uygulama Check-in)
 * - Uygulama İçi Bildirim Merkezi (In-App Notification Center & Canlı Rozet)
 * - Web Audio API ile Hafif Wellness Bildirim Sesi
 */





class NotificationManager {
  constructor(storageInstance, engineInstance) {
    this.storage = storageInstance || storage;
    this.engine = engineInstance || new CycleEngine(this.storage);
    this.heartbeatTimer = null;
    this.audioCtx = null;
    this.onNotificationChangeCallbacks = [];

    this.init();
  }

  init() {
    this.initHeartbeat();
    this.initBackgroundWorker();
    this.setupVisibilityListener();
    this.syncStateFromServiceWorker();
    this.registerBackgroundSync();
    this.syncStateToServiceWorker();
  }

  // Tarayıcı Bildirim Desteği Kontrolü
  static isSupported() {
    return typeof window !== 'undefined' && 'Notification' in window;
  }

  // Tarayıcı İzin Durumu
  static getPermissionStatus() {
    if (!NotificationManager.isSupported()) return 'unsupported';
    return Notification.permission; // 'granted' | 'denied' | 'default'
  }

  // İzin İsteme
  async requestPermission() {
    if (!NotificationManager.isSupported()) {
      return { success: false, status: 'unsupported', message: 'Tarayıcınız bildirim desteği sunmuyor.' };
    }

    try {
      const permission = await Notification.requestPermission();
      this.notifyListeners();
      if (permission === 'granted') {
        // İzin verildiğinde ayarları otomatik aktif yap
        const profileData = this.storage.getProfileData();
        const nSettings = profileData.settings?.notificationSettings || {};
        this.storage.updateSettings({
          notificationsEnabled: true,
          notificationSettings: {
            ...nSettings,
            enabled: true
          }
        });
        await this.registerBackgroundSync();
        await this.syncStateToServiceWorker();
        return { success: true, status: 'granted' };
      } else {
        return { success: false, status: permission };
      }
    } catch (err) {
      console.error('Bildirim izni istenirken hata:', err);
      return { success: false, status: 'error', error: err };
    }
  }

  // Değişiklik Dinleyicileri (Rozet ve UI güncellemeleri için)
  onNotificationChange(callback) {
    if (typeof callback === 'function') {
      this.onNotificationChangeCallbacks.push(callback);
    }
  }

  notifyListeners() {
    this.onNotificationChangeCallbacks.forEach(cb => {
      try { cb(); } catch (e) { console.error('Bildirim listener hatası:', e); }
    });
  }

  // Web Audio API ile Zarif Sağlık Bildirim Tınısı (Harici mp3 gerektirmez)
  playWellnessChime() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!this.audioCtx) {
        this.audioCtx = new AudioContext();
      }
      if (this.audioCtx.state === 'suspended') {
        this.audioCtx.resume();
      }

      const now = this.audioCtx.currentTime;
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();

      osc.type = 'sine';
      // Çift tonlu yumuşak tını (F5 -> A5)
      osc.frequency.setValueAtTime(698.46, now); // F5
      osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.12); // A5

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

      osc.connect(gain);
      gain.connect(this.audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.6);
    } catch (e) {
      // Ses çalınamazsa sessizce devam et
    }
  }

  // Gerçek Sistem Bildirimi Gönderme (Service Worker veya Notification API)
  async dispatchSystemNotification({ title, body, tag, icon, data, vibrate = [100, 50, 100], playSound = true }) {
    if (playSound) {
      this.playWellnessChime();
    }

    if (!NotificationManager.isSupported()) return false;
    if (Notification.permission !== 'granted') return false;

    const profileData = this.storage.getProfileData();
    const settings = profileData.settings?.notificationSettings || {};
    if (settings.enabled === false || profileData.settings?.notificationsEnabled === false) {
      return false;
    }

    const notifOptions = {
      body: body || '',
      icon: icon || './apple-touch-icon.png',
      badge: './assets/logo-192.png',
      tag: tag || 'dongum_notice_' + Date.now(),
      vibrate: vibrate,
      renotify: true,
      data: data || { url: './index.html' }
    };

    // 1. Service Worker aktif ise onun üzerinden göster (Mobilde arka plan ve kilit ekranı için en sağlıklısı)
    if ('serviceWorker' in navigator) {
      try {
        const registration = await navigator.serviceWorker.ready;
        if (registration && registration.showNotification) {
          await registration.showNotification(title, notifOptions);
          return true;
        }
      } catch (swErr) {
        console.warn('SW üzerinden bildirim gönderilemedi, doğrudan denenecek:', swErr);
      }
    }

    // 2. Doğrudan Notification API ile göster
    try {
      const notification = new Notification(title, notifOptions);
      notification.onclick = () => {
        window.focus();
        notification.close();
      };
      return true;
    } catch (err) {
      console.warn('Doğrudan Notification API hatası:', err);
      return false;
    }
  }

  // Test Bildirimi Gönder (Kullanıcının sistem bildirimini hemen test etmesi için)
  async sendTestNotification() {
    const perm = NotificationManager.getPermissionStatus();
    if (perm !== 'granted') {
      const req = await this.requestPermission();
      if (!req.success) {
        return {
          success: false,
          message: 'Sistem bildirimi için lütfen tarayıcınızdan bildirim iznine "İzin Ver" deyin.'
        };
      }
    }

    const title = '🌸 Döngüm - Test Hatırlatıcısı';
    const body = 'Harika! Döngüm bildirim sisteminiz başarıyla aktif edildi. Önemli döngü ve sağlık anlarında yanınızdayız.';

    // Uygulama içi bildirimlere de kaydet
    this.storage.addInAppNotification(null, {
      title,
      body,
      type: 'system',
      actionTab: 'home'
    });

    const sent = await this.dispatchSystemNotification({
      title,
      body,
      tag: 'test_notification'
    });

    this.notifyListeners();

    return {
      success: true,
      systemSent: sent,
      message: sent
        ? 'Test bildirimi telefonunuza / tarayıcınıza başarıyla gönderildi!'
        : 'Bildirim uygulama içi merkeze kaydedildi.'
    };
  }

  // Periyodik Hatırlatıcı Döngüsü (Heartbeat & Visibility Change)
  initHeartbeat() {
    if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
    // İlk açılışta kontrol et
    setTimeout(() => this.evaluateSmartReminders(), 1200);

    // Her 60 saniyede bir kontrol et (daha hassas ve gecikmesiz uyarılar için)
    this.heartbeatTimer = setInterval(() => {
      this.evaluateSmartReminders();
    }, 60 * 1000);
  }

  // Web Worker Ticker (Sekme arka plandayken veya telefon kilitliyken timer'ların donmasını önler)
  initBackgroundWorker() {
    if (typeof window === 'undefined' || typeof Worker === 'undefined') return;
    try {
      if (this.bgWorker) this.bgWorker.terminate();
      const workerBlob = new Blob([`
        let timer = null;
        self.onmessage = function(e) {
          if (e.data === 'start') {
            if (timer) clearInterval(timer);
            timer = setInterval(function() {
              self.postMessage('tick');
            }, 60000);
          } else if (e.data === 'stop') {
            if (timer) clearInterval(timer);
          }
        };
      `], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(workerBlob);
      this.bgWorker = new Worker(workerUrl);
      this.bgWorker.onmessage = (e) => {
        if (e.data === 'tick') {
          this.evaluateSmartReminders();
        }
      };
      this.bgWorker.postMessage('start');
    } catch (e) {
      console.warn('Background Web Worker başlatılamadı:', e);
    }
  }

  setupVisibilityListener() {
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          this.syncStateFromServiceWorker();
          this.evaluateSmartReminders();
        } else if (document.visibilityState === 'hidden') {
          // Uygulama arka plana geçtiğinde önümüzdeki 24 saatin bildirimlerini işletim sistemi alarmına yaz
          this.scheduleUpcomingBackgroundNotifications();
        }
      });
      window.addEventListener('focus', () => {
        this.syncStateFromServiceWorker();
        this.evaluateSmartReminders();
      });
      window.addEventListener('pagehide', () => {
        this.scheduleUpcomingBackgroundNotifications();
      });
      window.addEventListener('beforeunload', () => {
        this.scheduleUpcomingBackgroundNotifications();
      });
    }
  }

  // 5 Saniye Sonra Kilit Ekranı / Arka Plan Test Bildirimi Kur
  async scheduleDelayedBackgroundTest(delaySeconds = 5) {
    const perm = NotificationManager.getPermissionStatus();
    if (perm !== 'granted') {
      const req = await this.requestPermission();
      if (!req.success) {
        return {
          success: false,
          message: 'Bildirim izni verilmedi. Lütfen önce tarayıcı bildirim iznini açın.'
        };
      }
    }

    if (!('serviceWorker' in navigator)) {
      return {
        success: false,
        message: 'Tarayıcınız Service Worker desteği sunmuyor.'
      };
    }

    try {
      const reg = await navigator.serviceWorker.ready;
      if (reg.active) {
        reg.active.postMessage({
          type: 'SCHEDULE_TEST_NOTIFICATION',
          delaySeconds: delaySeconds
        });
        return {
          success: true,
          message: `Arka plan alarmı kuruldu! Lütfen hemen şimdi uygulamayı kapatın veya telefonunuzu kilitleyin (${delaySeconds} saniye içinde gelecek).`
        };
      }
    } catch (e) {
      console.warn('Delayed test schedule hatası:', e);
    }

    return {
      success: false,
      message: 'Service Worker aktifleşirken bir sorun oluştu.'
    };
  }

  // Önümüzdeki 24 Saat İçin Gelecek Hatırlatıcıları Planla (TimestampTrigger & SW Kuyruğu)
  async scheduleUpcomingBackgroundNotifications() {
    if (!NotificationManager.isSupported() || Notification.permission !== 'granted') return;
    if (!('serviceWorker' in navigator)) return;

    try {
      const profileData = this.storage.getProfileData();
      const settings = profileData.settings?.notificationSettings || {};
      if (settings.enabled === false || profileData.settings?.notificationsEnabled === false) return;

      const summary = this.engine.getTodaySummary();
      const now = new Date();
      const nowMs = now.getTime();
      const todayStr = CycleEngine.formatDateStr(now);
      const todayDayData = profileData.days?.[todayStr] || {};
      const scheduledList = [];

      // 1. Su Hatırlatıcıları (Bugünün kalan çalışma saatleri içinde periyodik)
      if (settings.waterReminder !== false) {
        const startHour = settings.waterStartHour || 8;
        const endHour = settings.waterEndHour || 22;
        const intervalHours = parseFloat(settings.waterIntervalHours) || 2;
        const intervalMs = Math.round(intervalHours * 3600 * 1000);

        let nextWaterTime = nowMs + intervalMs;
        const endToday = new Date(now);
        endToday.setHours(endHour, 0, 0, 0);

        let count = 0;
        while (nextWaterTime <= endToday.getTime() && count < 6) {
          scheduledList.push({
            title: '💧 Döngüm - Su Vakti',
            body: 'Vücudunu nemlendir, krampları ve ödemi hafiflet. Şimdi bir bardak su içme zamanı!',
            timestamp: nextWaterTime,
            tag: `water_sched_${nextWaterTime}`,
            data: { tab: 'fitness' }
          });
          nextWaterTime += intervalMs;
          count++;
        }
      }

      // 2. Gün Ortası Ruh Hali Hatırlatıcısı
      if (settings.moodReminder !== false && !todayDayData.mood) {
        const [mHour, mMin] = (settings.moodReminderTime || '15:00').split(':').map(Number);
        const moodTimeToday = new Date(now);
        moodTimeToday.setHours(mHour, mMin, 0, 0);

        if (moodTimeToday.getTime() > nowMs) {
          scheduledList.push({
            title: '🧘 Döngüm - Ruh Halini Kaydet',
            body: 'Bugün enerjin nasıl? Günlük ruh halini birkaç dokunuşla kaydet.',
            timestamp: moodTimeToday.getTime(),
            tag: `mood_sched_${todayStr}`,
            data: { tab: 'calendar', openDay: todayStr, focus: 'mood' }
          });
        }
      }

      // 3. Gün Sonu Sağlık & Semptom Kaydı
      if (settings.dailyLogReminder !== false) {
        const [dHour, dMin] = (settings.dailyLogTime || '20:30').split(':').map(Number);
        const dailyTimeToday = new Date(now);
        dailyTimeToday.setHours(dHour, dMin, 0, 0);

        if (dailyTimeToday.getTime() > nowMs) {
          scheduledList.push({
            title: '📝 Döngüm - Günün Sağlık Kaydı',
            body: 'Bugün bedeninde neler oldu? Günlük belirtilerini kaydetmeyi unutma.',
            timestamp: dailyTimeToday.getTime(),
            tag: `daily_sched_${todayStr}`,
            data: { tab: 'calendar', openDay: todayStr }
          });
        }
      }

      // 4. Yaklaşan Regl Bildirimi
      if (settings.periodReminder !== false && summary.daysUntilNext > 0 && summary.daysUntilNext <= (settings.periodReminderDays || 2)) {
        const nextMorning = new Date(now);
        nextMorning.setDate(nextMorning.getDate() + 1);
        nextMorning.setHours(9, 0, 0, 0);

        if (nextMorning.getTime() > nowMs) {
          scheduledList.push({
            title: '🌸 Döngüm - Regl Dönemi Yaklaşıyor',
            body: `Tahmini regl gününüze az kaldı (${summary.daysUntilNext} gün). Hazırlıklarınızı tamamlayın!`,
            timestamp: nextMorning.getTime(),
            tag: `period_approaching_${summary.nextPeriodDate}`,
            data: { tab: 'calendar' }
          });
        }
      }

      // Service Worker'a Aktar ve Kaydet
      const reg = await navigator.serviceWorker.ready;
      if (reg.active && scheduledList.length > 0) {
        reg.active.postMessage({
          type: 'SCHEDULE_NOTIFICATIONS',
          notifications: scheduledList
        });
      }

      // Eğer tarayıcıda Notification Triggers varsa doğrudan client tarafından da dene
      if (('showTrigger' in Notification.prototype) && typeof window !== 'undefined' && 'TimestampTrigger' in window) {
        for (const item of scheduledList) {
          try {
            await reg.showNotification(item.title, {
              body: item.body,
              icon: './apple-touch-icon.png',
              badge: './assets/logo-192.png',
              tag: item.tag,
              renotify: true,
              data: item.data,
              showTrigger: new window.TimestampTrigger(item.timestamp)
            });
          } catch(e) {}
        }
      }

    } catch (err) {
      console.warn('Gelecek bildirimler planlanırken hata:', err);
    }
  }

  // Sistem ve Arka Plan Tanı Kontrolü (Diagnostics)
  async getDiagnostics() {
    const isSupp = NotificationManager.isSupported();
    const perm = NotificationManager.getPermissionStatus();
    const hasSW = (typeof navigator !== 'undefined' && 'serviceWorker' in navigator);
    let swActive = false;
    let hasPeriodicSync = false;
    const hasTriggers = (typeof Notification !== 'undefined' && 'showTrigger' in Notification.prototype) || (typeof window !== 'undefined' && 'TimestampTrigger' in window);

    if (hasSW) {
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        swActive = !!(reg && reg.active);
        hasPeriodicSync = !!(reg && 'periodicSync' in reg);
      } catch (e) {}
    }

    const isStandalone = (typeof window !== 'undefined') && (
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      (window.navigator && window.navigator.standalone === true)
    );

    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? navigator.userAgent : '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !(typeof window !== 'undefined' && window.MSStream);
    const isAndroid = /Android/.test(ua);

    return {
      isSupported: isSupp,
      permission: perm,
      hasServiceWorker: hasSW,
      isServiceWorkerActive: swActive,
      hasNotificationTriggers: hasTriggers,
      hasPeriodicSync: hasPeriodicSync,
      isStandalone: isStandalone,
      isIOS: isIOS,
      isAndroid: isAndroid
    };
  }

  // Periodic Background Sync & Background Sync Kaydı (Uygulama tamamen kapalıyken Android/Chrome PWA tetikleyicisi)
  async registerBackgroundSync() {
    if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return false;
    try {
      const reg = await navigator.serviceWorker.ready;
      let registered = false;

      // 1. Periodic Background Sync
      if ('periodicSync' in reg) {
        try {
          const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
          if (status.state === 'granted') {
            await reg.periodicSync.register('dongum-reminder-sync', {
              minInterval: 15 * 60 * 1000 // 15 dakika
            });
            registered = true;
          }
        } catch (e) {
          try {
            await reg.periodicSync.register('dongum-reminder-sync', {
              minInterval: 15 * 60 * 1000
            });
            registered = true;
          } catch (err) {}
        }
      }

      // 2. Standart Background Sync
      if ('sync' in reg) {
        try {
          await reg.sync.register('dongum-reminder-sync');
        } catch (e) {}
      }

      return registered;
    } catch (err) {
      console.warn('Background sync registration hatası:', err);
      return false;
    }
  }

  // Hatırlatma Verilerini Service Worker ve CacheStorage ile Senkronize Et
  async syncStateToServiceWorker() {
    try {
      const profileData = this.storage.getProfileData();
      const settings = profileData.settings?.notificationSettings || {};
      const notifState = this.storage.getNotificationState();
      const summary = this.engine.getTodaySummary();
      const todayStr = CycleEngine.formatDateStr(new Date());
      const todayDayData = profileData.days?.[todayStr] || {};
      const todayWater = this.storage.getWaterForDay(todayStr);
      const targetWater = profileData.settings?.waterTarget || 2250;

      const hasLoggedMood = !!todayDayData.mood;
      const hasLoggedDaily = !!(
        todayDayData.isPeriod ||
        (todayDayData.symptoms && todayDayData.symptoms.length > 0) ||
        todayDayData.mood ||
        todayDayData.notes
      );

      const payload = {
        todayStr: todayStr,
        todayWater: todayWater,
        hasLoggedMood: hasLoggedMood,
        hasLoggedDaily: hasLoggedDaily,
        daysUntilNext: summary.daysUntilNext,
        nextPeriodDate: summary.nextPeriodDate,
        phase: summary.dayStatus?.phase || null,
        settings: {
          ...settings,
          waterTarget: targetWater
        },
        sentLog: notifState.sentLog || {}
      };

      // 1. PostMessage to Service Worker
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'SYNC_NOTIFICATION_PAYLOAD',
          payload: payload
        });
      }

      // 2. Doğrudan CacheStorage'a yaz (SW offline/uykudayken bile erişebilir)
      if ('caches' in window) {
        const cache = await caches.open('dongum-notification-store-v1');
        await cache.put(
          new Request('https://dongum.internal/notification-state.json'),
          new Response(JSON.stringify(payload), {
            headers: { 'Content-Type': 'application/json' }
          })
        );
      }
    } catch (e) {
      console.warn('SW bildirim senkronizasyon uyarısı:', e);
    }
  }

  // Service Worker'ın arka planda gönderdiği bildirim kayıtlarını yerel belleğe çek
  async syncStateFromServiceWorker() {
    try {
      if ('caches' in window) {
        const cache = await caches.open('dongum-notification-store-v1');
        const res = await cache.match('https://dongum.internal/notification-state.json');
        if (res) {
          const swPayload = await res.json();
          if (swPayload && swPayload.sentLog) {
            const localState = this.storage.getNotificationState();
            let changed = false;
            localState.sentLog = localState.sentLog || {};
            for (const [k, v] of Object.entries(swPayload.sentLog)) {
              if (!localState.sentLog[k] || localState.sentLog[k] < v) {
                localState.sentLog[k] = v;
                changed = true;
              }
            }
            if (changed) {
              this.storage.saveNotificationState(null, localState);
              this.notifyListeners();
            }
          }
        }
      }
    } catch (e) {}
  }

  // =========================================================================
  // AKILLI HATIRLATMA VE BİYOLOJİK DÖNGÜ DEĞERLENDİRİCİSİ
  // =========================================================================
  evaluateSmartReminders() {
    const profileData = this.storage.getProfileData();
    const settings = profileData.settings?.notificationSettings || {};
    if (settings.enabled === false) return;

    const notifState = this.storage.getNotificationState();
    const sentLog = notifState.sentLog || {};
    const todayStr = CycleEngine.formatDateStr(new Date());
    const now = new Date();
    const currentHours = now.getHours();
    const currentMinutes = now.getMinutes();

    let stateChanged = false;

    // Döngü Özeti
    const summary = this.engine.getTodaySummary();
    const daysUntilNext = summary.daysUntilNext;
    const dayStatus = summary.dayStatus;
    const stats = summary.stats;

    // 1. YAKLAŞAN REGL HATIRLATMASI
    if (settings.periodReminder !== false && daysUntilNext !== null && daysUntilNext > 0) {
      const targetThreshold = settings.periodReminderDays || 2;
      if (daysUntilNext <= targetThreshold) {
        const logKey = `period_approaching_${todayStr}_${summary.nextPeriodDate}`;
        if (!sentLog[logKey]) {
          const title = '🌸 Döngüm - Regl Dönemi Yaklaşıyor';
          const dayText = daysUntilNext === 1 ? 'yarın' : `${daysUntilNext} gün içinde`;
          const body = `Tahmini regl başlangıcınız ${dayText} bekleniyor. Hazırlıklarınızı yapmayı unutmayın!`;

          this.dispatchSystemNotification({
            title,
            body,
            tag: 'period_approaching',
            data: { tab: 'calendar' }
          });
          this.storage.addInAppNotification(null, { title, body, type: 'period', actionTab: 'calendar' });
          sentLog[logKey] = Date.now();
          stateChanged = true;
        }
      }
    }

    // 2. REGL GECİKMESİ HATIRLATMASI
    if (settings.latePeriodReminder !== false && daysUntilNext !== null && daysUntilNext < 0) {
      const lateDays = Math.abs(daysUntilNext);
      const isPeriodLoggedRecently = Object.keys(profileData.days || {}).some(d => {
        return d >= CycleEngine.addDays(todayStr, -lateDays) && profileData.days[d]?.isPeriod;
      });

      if (!isPeriodLoggedRecently && lateDays >= 1) {
        const logKey = `period_delayed_${todayStr}`;
        const lastDelayedSent = sentLog.lastDelayedSentDate;
        const diffDaysSinceDelayed = lastDelayedSent ? CycleEngine.diffDays(todayStr, lastDelayedSent) : 99;

        if (!sentLog[logKey] && diffDaysSinceDelayed >= 2) {
          const title = '🌸 Döngüm - Regl Gecikmesi';
          const body = `Tahmini regl gününüz ${lateDays} gün geçti. Yeni başlangıç gününüzü kaydetmek veya not eklemek ister misiniz?`;

          this.dispatchSystemNotification({
            title,
            body,
            tag: 'period_delayed',
            data: { tab: 'calendar' }
          });
          this.storage.addInAppNotification(null, { title, body, type: 'period', actionTab: 'calendar' });
          sentLog[logKey] = Date.now();
          sentLog.lastDelayedSentDate = todayStr;
          stateChanged = true;
        }
      }
    }

    // 3. OVÜLASYON (YUMURTLAMA) HATIRLATMASI
    if (settings.ovulationReminder !== false) {
      if (dayStatus && dayStatus.phase === 'ovulation') {
        const logKey = `ovulation_${todayStr}`;
        if (!sentLog[logKey]) {
          const title = '✨ Döngüm - Yumurtlama (Ovülasyon) Günü';
          const body = 'Bugün gebe kalma ihtimalinin en yüksek olduğu zirve ovülasyon evresindesiniz.';

          this.dispatchSystemNotification({
            title,
            body,
            tag: 'ovulation_day',
            data: { tab: 'home' }
          });
          this.storage.addInAppNotification(null, { title, body, type: 'ovulation', actionTab: 'home' });
          sentLog[logKey] = Date.now();
          stateChanged = true;
        }
      }
    }

    // 4. PMS & LUTEAL EVRE HATIRLATMASI
    if (settings.pmsReminder !== false) {
      if (dayStatus && dayStatus.phase === 'pms') {
        const logKey = `pms_phase_${summary.nextPeriodDate || todayStr}`;
        if (!sentLog[logKey]) {
          const title = '🌙 Döngüm - Rahatlama & PMS Dönemi';
          const body = 'Luteal evredesiniz. Duygusal dalgalanmalar normaldir; bol su, magnezyum ve dinlenme enerjinizi dengeler.';

          this.dispatchSystemNotification({
            title,
            body,
            tag: 'pms_phase',
            data: { tab: 'home' }
          });
          this.storage.addInAppNotification(null, { title, body, type: 'pms', actionTab: 'home' });
          sentLog[logKey] = Date.now();
          stateChanged = true;
        }
      }
    }

    // 5. GÜN ORTASI RUH HALİ & ENERJİ HATIRLATMASI (Örn: 15:00)
    if (settings.moodReminder !== false) {
      const preferredMoodTime = settings.moodReminderTime || '15:00';
      const [mHour, mMin] = preferredMoodTime.split(':').map(Number);
      const isPastMoodTime = currentHours > mHour || (currentHours === mHour && currentMinutes >= mMin);

      if (isPastMoodTime) {
        const todayDayData = profileData.days?.[todayStr];
        const hasLoggedMood = !!todayDayData?.mood;
        const logKey = `mood_${todayStr}`;

        if (!hasLoggedMood && !sentLog[logKey]) {
          const title = '🧘 Döngüm - Ruh Halini Kaydet';
          const body = 'Bugün nasıl hissediyorsun? Günlük ruh halini ve enerjini 5 saniyede kaydederek döngü dengeni takip et.';

          this.dispatchSystemNotification({
            title,
            body,
            tag: 'mood_reminder',
            data: { tab: 'calendar', openDay: todayStr, focus: 'mood' }
          });
          this.storage.addInAppNotification(null, {
            title,
            body,
            type: 'mood',
            actionTab: 'calendar',
            actionFocus: 'mood'
          });
          sentLog[logKey] = Date.now();
          stateChanged = true;
        }
      }
    }

    // 6. GÜNLÜK SAĞLIK & SEMPTOM KAYDI HATIRLATMASI (Örn: 20:30)
    if (settings.dailyLogReminder !== false) {
      const preferredTime = settings.dailyLogTime || '20:30';
      const [prefHour, prefMin] = preferredTime.split(':').map(Number);
      const isPastTime = currentHours > prefHour || (currentHours === prefHour && currentMinutes >= prefMin);

      if (isPastTime) {
        const todayDayData = profileData.days?.[todayStr];
        const hasLoggedToday = todayDayData && (
          todayDayData.isPeriod ||
          (todayDayData.symptoms && todayDayData.symptoms.length > 0) ||
          todayDayData.mood ||
          todayDayData.notes
        );

        const logKey = `daily_log_${todayStr}`;
        if (!hasLoggedToday && !sentLog[logKey]) {
          const title = '📝 Döngüm - Günün Sağlık Kaydı';
          const body = 'Bugün nasıl hissettin? Günlük semptom, duygu ve akıntı kaydını eklemeyi unutma.';

          this.dispatchSystemNotification({
            title,
            body,
            tag: 'daily_health_log',
            data: { tab: 'calendar', openDay: todayStr }
          });
          this.storage.addInAppNotification(null, { title, body, type: 'daily', actionTab: 'calendar' });
          sentLog[logKey] = Date.now();
          stateChanged = true;
        }
      }
    }

    // 7. SU TÜKETİMİ & HİDRASYON HATIRLATMASI
    if (settings.waterReminder !== false) {
      const startH = settings.waterStartHour || 8;
      const endH = settings.waterEndHour || 22;

      if (currentHours >= startH && currentHours <= endH) {
        const todayWater = this.storage.getWaterForDay(todayStr);
        const targetWater = profileData.settings?.waterTarget || 2250;

        if (todayWater < targetWater) {
          const intervalHours = parseFloat(settings.waterIntervalHours) || 2;
          const intervalMs = Math.round(intervalHours * 60 * 60 * 1000);
          const lastWaterTime = sentLog.lastWaterNoticeTime || 0;

          if (Date.now() - lastWaterTime >= intervalMs) {
            const title = '💧 Döngüm - Su İçme Vakti';
            const remaining = Math.max(0, targetWater - todayWater);
            const body = `Vücudunu nemli tut! Hedefine ${remaining} ml kaldı. Bir bardak su içerek tazelenin (${todayWater}/${targetWater} ml).`;

            this.dispatchSystemNotification({
              title,
              body,
              tag: 'water_reminder',
              data: { tab: 'fitness' }
            });
            this.storage.addInAppNotification(null, { title, body, type: 'water', actionTab: 'fitness' });
            sentLog.lastWaterNoticeTime = Date.now();
            stateChanged = true;
          }
        }
      }
    }

    // 8. UYGULAMAYA GERİ ÇAĞIRMA (3+ GÜN BOYUNCA GİRİŞ YAPILMADIYSA)
    const allDays = Object.keys(profileData.days || {}).sort();
    if (allDays.length > 0) {
      const lastRecordedDay = allDays[allDays.length - 1];
      const daysSinceLastRecord = CycleEngine.diffDays(todayStr, lastRecordedDay);

      if (daysSinceLastRecord >= 4) {
        const logKey = `reengagement_${todayStr}`;
        const lastReengage = sentLog.lastReengagementSentDate;
        const diffDaysSinceReengage = lastReengage ? CycleEngine.diffDays(todayStr, lastReengage) : 99;

        if (!sentLog[logKey] && diffDaysSinceReengage >= 4) {
          const title = '🌸 Döngüm Seni Özledi';
          const body = 'Döngü ve sağlık modelinizin en yüksek doğrulukla çalışması için son günlerinizi kaydetmeyi unutmayın.';

          this.dispatchSystemNotification({
            title,
            body,
            tag: 'app_reengagement',
            data: { tab: 'home' }
          });
          this.storage.addInAppNotification(null, { title, body, type: 'system', actionTab: 'home' });
          sentLog[logKey] = Date.now();
          sentLog.lastReengagementSentDate = todayStr;
          stateChanged = true;
        }
      }
    }

    if (stateChanged) {
      notifState.sentLog = sentLog;
      this.storage.saveNotificationState(null, notifState);
      this.notifyListeners();
    }

    // Her değerlendirmede SW ve Cache ile senkronizasyonu tazele
    this.syncStateToServiceWorker();
  }

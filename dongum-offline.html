      }
    }

    // 3. Günün Ruh Hali & Duygu Durumu Eksikse
    const todayDayData = profileData.days?.[todayStr] || {};
    if (!todayDayData.mood && settings.moodReminder !== false) {
      alerts.push({
        id: 'alert_mood_checkin',
        type: 'mood',
        badge: 'Ruh Hali Yoklaması',
        title: 'Bugün Nasıl Hissediyorsunuz?',
        description: 'Enerji ve duygu durumunuzu 5 saniyede kaydederek hormon döngünüzle ruh hali korelasyonunu takip edin.',
        icon: '🧘',
        color: '#ec4899',
        actionText: 'Ruh Halini Seç',
        actionTab: 'calendar',
        actionFocus: 'mood'
      });
    }

    // 4. Günün Sağlık Kaydı Eksikse
    const hasLog = (
      todayDayData.isPeriod ||
      (todayDayData.symptoms && todayDayData.symptoms.length > 0) ||
      todayDayData.mood ||
      todayDayData.notes
    );
    if (!hasLog) {
      alerts.push({
        id: 'alert_daily_log',
        type: 'daily',
        badge: 'Günün Kaydı',
        title: 'Bugünkü Belirtilerinizi Girin',
        description: 'Ruh halinizi, enerjinizi ve semptomlarınızı kaydederek kişiselleştirilmiş analizi güçlendirin.',
        icon: '📝',
        color: '#8b5cf6',
        actionText: 'Bugünü Kaydet',
        actionTab: 'calendar'
      });
    }

    // 5. Su Tüketimi Hedefi
    const todayWater = this.storage.getWaterForDay(todayStr);
    const targetWater = profileData.settings?.waterTarget || 2250;
    if (todayWater < targetWater) {
      const pct = Math.round((todayWater / targetWater) * 100);
      alerts.push({
        id: 'alert_water',
        type: 'water',
        badge: `%${pct} Tamamlandı`,
        title: `Su Hedefine ${targetWater - todayWater} ml Kaldı`,
        description: `Bugün ${todayWater} ml / ${targetWater} ml su tükettiniz. Vücudunuzun hidrasyonunu koruyun.`,
        icon: '💧',
        color: '#0284c7',
        actionText: '+250 ml Su İçtim',
        actionType: 'add_water_250',
        actionTab: 'fitness'
      });
    }

    return alerts;
  }

  // Okunmamış / Bekleyen Aktif Bildirim Sayısı
  getBadgeCount() {
    const alerts = this.getActiveTodayAlerts();
    return alerts.length;
  }
}

                      <span class="pfc-arrow">▼</span>

                      <div class="pfc-info-row">

                      </div>
                      <div class="pfc-info-row">
                        <strong>Önerilen Egzersizler:</strong>
                        <div class="pfc-pill-tags">

                        </div>
                      </div>
                      <div class="pfc-info-row">
                        <strong>Dikkat Edilmeli:</strong>
                        <div class="pfc-pill-tags">
                          ${p.avoid.map(a => `<span class="avoid-pill">✕ ${a}</span>`).join('')}
                        </div>
                      </div>
                      <div class="pfc-benefit-highlight">
                        <strong>🌸 Döngüye Katkısı:</strong> ${p.cycleBenefit}
                      </div>
                    </div>

              }).join('')}
            </div>
          </div>

          <!-- Son Yapılan Egzersizler Geçmişi -->
          <div class="recent-workouts-section">
            <h4 class="rws-title">📋 Egzersiz Geçmişi</h4>
            ${recentExercises.length > 0 ? `
              <div class="recent-workouts-list">
                ${recentExercises.map(ex => {
                  const typeObj = EXERCISE_TYPES.find(t => t.id === ex.type) || { icon: '🏃‍♀️', name: ex.type };
                  const intObj = INTENSITY_LEVELS.find(i => i.id === ex.intensity) || { name: 'Normal' };
                  const feelObj = FEELING_LEVELS.find(f => f.id === ex.feel) || { icon: '✨', name: '' };
                  return `
                    <div class="recent-workout-item">
                      <div class="rw-left">
                        <span class="rw-icon">${typeObj.icon}</span>
                        <div class="rw-text">
                          <strong class="rw-name">${ex.typeName || typeObj.name}</strong>
                          <span class="rw-meta">${ex.dateStr} • ${ex.duration} dk • ${intObj.name}</span>
                        </div>
                      </div>
                      <div class="rw-right">
                        <span class="rw-feel" title="${feelObj.name}">${feelObj.icon}</span>
                        <button type="button" class="btn-del-history-workout" data-date="${ex.dateStr}" title="Bu kaydı sil">
                          ${Icons.trash}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `
              <div class="empty-state-box">
                <span class="empty-icon">🧘‍♀️</span>
                <p>Henüz egzersiz kaydı bulunmuyor. Bugün bir seans kaydederek serinizi başlatın!</p>
              </div>
            `}
          </div>

        </div>

        <!-- ================= SEKME 2: GÜNLÜK SU İÇME MODÜLÜ ================= -->
        <div class="fitness-pane" id="paneWater" style="display: ${this.activeSubTab === 'water' ? 'block' : 'none'};">
          
          <!-- İnteraktif Su Göstergesi & Dalga Kartı -->
          <div class="water-hero-card">
            
            <div class="water-progress-visual">
              <div class="water-cup-container">
                <div class="water-wave-fill" style="height: ${Math.min(100, waterPercent)}%;">
                  <div class="wave wave1"></div>
                  <div class="wave wave2"></div>
                </div>
                <div class="water-cup-overlay-text">
                  <span class="wcup-percent">%${waterPercent}</span>
                  <span class="wcup-val">${todayWater} ml</span>
                  <span class="wcup-target">Hedef: ${waterTarget} ml</span>
                </div>
              </div>
            </div>

            <div class="water-hero-info">
              ${waterPercent >= 100 ? `
                <div class="water-congrats-badge">
                  🎉 Harika! Bugünkü su hedefine ulaştın!
                </div>
              ` : `
                <div class="water-status-text">
                  Hedefe <strong>${Math.max(0, waterTarget - todayWater)} ml</strong> kaldı.
                </div>
              `}
              <p class="water-subtext">Hücrelerini nemlendir, ödemi at ve krampları yatıştır.</p>
              
              <!-- Hızlı Bardak Ekleme Butonları -->
              <div class="water-quick-buttons-grid">
                <button type="button" class="btn-water-quick" data-amount="250">
                  <span class="bwq-icon">🥛</span>
                  <span class="bwq-title">+250 ml</span>
                  <span class="bwq-sub">1 Su Bardağı</span>
                </button>
                <button type="button" class="btn-water-quick" data-amount="330">
                  <span class="bwq-icon">☕</span>
                  <span class="bwq-title">+330 ml</span>
                  <span class="bwq-sub">Büyük Bardak</span>
                </button>
                <button type="button" class="btn-water-quick" data-amount="500">
                  <span class="bwq-icon">🍶</span>
                  <span class="bwq-title">+500 ml</span>
                  <span class="bwq-sub">Yarım Litre</span>
                </button>
                <button type="button" class="btn-water-undo" id="btnWaterUndo" title="Son içilen 250 ml'yi geri al">
                  <span class="bwq-icon">↩️</span>
                  <span class="bwq-title">-250 ml</span>
                  <span class="bwq-sub">Geri Al</span>
                </button>
              </div>

              <!-- Hedef Değiştirme Satırı -->
              <div class="water-target-edit-row">
                <span>Günlük Hedef:</span>
                <select id="selectWaterTarget" class="form-input water-target-select">
                  ${[1500, 1750, 2000, 2250, 2500, 3000, 3500].map(val => `
                    <option value="${val}" ${val === waterTarget ? 'selected' : ''}>${val} ml (${(val/250).toFixed(0)} Bardak)</option>
                  `).join('')}
                </select>
              </div>
            </div>

          </div>

          <!-- Son 7 Günün Su Tüketim Çubuk Grafiği -->
          <div class="weekly-water-chart-card">
            <h4 class="wwc-title">📊 Son 7 Günün Su Dengesi</h4>
            <div class="wwc-bars-container">
              ${waterHistory.map(item => `
                <div class="wwc-bar-col ${item.isToday ? 'wwc-today' : ''}">
                  <div class="wwc-bar-track">
                    <div class="wwc-bar-fill ${item.reached ? 'reached' : ''}" style="height: ${Math.min(100, item.percent)}%;"></div>
                  </div>
                  <span class="wwc-amount">${item.amount > 0 ? (item.amount >= 1000 ? (item.amount/1000).toFixed(1) + 'L' : item.amount) : '0'}</span>
                  <span class="wwc-day">${item.dayName}</span>
                </div>
              `).join('')}
            </div>
            <div class="wwc-legend">
              <span class="wwc-legend-item"><span class="legend-dot reached-dot"></span> Hedefe Ulaşıldı</span>
              <span class="wwc-legend-item"><span class="legend-dot pending-dot"></span> Devam Eden</span>
            </div>
          </div>

          <!-- Döngü Fazına Özel Su Tavsiyesi Kartı -->
          <div class="cycle-water-card" style="--phase-color: ${phaseGuide.color}; --phase-bg: ${phaseGuide.bgColor};">
            <div class="cwc-header">
              <span class="cwc-icon">${WATER_CYCLE_BENEFITS[phaseKey]?.icon || '💧'}</span>
              <h4>${WATER_CYCLE_BENEFITS[phaseKey]?.title || 'Döngüde Su Tüketimi'}</h4>
            </div>
            <p class="cwc-desc">
              ${WATER_CYCLE_BENEFITS[phaseKey]?.desc || 'Yeterli su tüketimi hormon salınımı ve pelvik dolaşım için hayati önem taşır.'}
            </p>
          </div>

        </div>

      </div>
    `;

    this.attachEvents();
    this.updateDynamicAnalysis();
  }

  attachEvents() {
    // Sekme Geçişi: Egzersiz / Su
    this.container.querySelectorAll('.fitness-tabs-nav .ftab-btn').forEach(btn => {
      btn.onclick = () => {
        this.activeSubTab = btn.dataset.subtab;
        this.render();
      };
    });

    // Egzersiz Türü Seçimi
    const typeBtns = this.container.querySelectorAll('.exercise-types-grid .ex-type-btn');
    typeBtns.forEach(btn => {
      btn.onclick = () => {
        typeBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.selectedExerciseType = btn.dataset.type;
        this.updateDynamicAnalysis();
      };
    });

    // Süre Çipleri
    const durChips = this.container.querySelectorAll('.duration-chips-row .dur-chip');
    const durSlider = this.container.querySelector('#durationSlider');
    const durDisplay = this.container.querySelector('#durationDisplay');

    durChips.forEach(chip => {
      chip.onclick = () => {
        durChips.forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        this.selectedDuration = parseInt(chip.dataset.dur, 10);
        if (durSlider) durSlider.value = this.selectedDuration;
        if (durDisplay) durDisplay.textContent = `${this.selectedDuration} Dakika`;
        this.updateDynamicAnalysis();
      };
    });

    if (durSlider) {
      durSlider.oninput = (e) => {
        this.selectedDuration = parseInt(e.target.value, 10);
        durChips.forEach(c => c.classList.toggle('selected', parseInt(c.dataset.dur, 10) === this.selectedDuration));
        if (durDisplay) durDisplay.textContent = `${this.selectedDuration} Dakika`;
        this.updateDynamicAnalysis();
      };
    }

    // Yoğunluk Seçimi
    const intensityBtns = this.container.querySelectorAll('.intensity-grid .intensity-btn');
    intensityBtns.forEach(btn => {
      btn.onclick = () => {
        intensityBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.selectedIntensity = btn.dataset.intensity;
        this.updateDynamicAnalysis();
      };
    });

    // Hissiyat Seçimi
    const feelBtns = this.container.querySelectorAll('.feelings-grid .feel-btn');
    feelBtns.forEach(btn => {
      btn.onclick = () => {
        feelBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.selectedFeel = btn.dataset.feel;
      };
    });

    // Egzersiz Kaydet Butonu
    const btnSaveWorkout = this.container.querySelector('#btnSaveWorkout');
    if (btnSaveWorkout) {
      btnSaveWorkout.onclick = () => {
        const todayStr = this.engine.getTodaySummary().todayStr;
        const noteInput = this.container.querySelector('#workoutNoteInput');
        const noteVal = noteInput ? noteInput.value.trim() : '';

        const typeObj = EXERCISE_TYPES.find(t => t.id === this.selectedExerciseType) || { name: 'Egzersiz' };
        const intObj = INTENSITY_LEVELS.find(i => i.id === this.selectedIntensity) || { name: 'Orta' };
        const feelObj = FEELING_LEVELS.find(f => f.id === this.selectedFeel) || { name: 'İyi', icon: '✨' };

        const currentPhase = this.engine.getTodaySummary().dayStatus.phase || 'follicular';
        const phaseKey = ['period', 'follicular', 'ovulation', 'luteal'].includes(currentPhase) ? currentPhase : 'follicular';
        const analysis = FitnessComponent.analyzeExerciseCompatibility(phaseKey, this.selectedExerciseType, this.selectedIntensity);

        const workoutRecord = {
          type: this.selectedExerciseType,
          typeName: typeObj.name,
          duration: this.selectedDuration,
          intensity: this.selectedIntensity,
          intensityName: intObj.name,
          feel: this.selectedFeel,
          feelName: feelObj.name,
          feelIcon: feelObj.icon,
          note: noteVal,
          phaseAtTime: phaseKey,
          cycleBenefit: analysis.benefit
        };

        this.storage.logExercise(todayStr, workoutRecord);
        alert(`🎉 Harika! ${this.selectedDuration} dakikalık "${typeObj.name}" egzersiziniz döngünüze işlendi.`);
        this.render();
        if (this.onDataChanged) this.onDataChanged();
      };
    }

    // Bugünün Egzersizini Silme Butonu
    const btnDeleteWorkout = this.container.querySelector('#btnDeleteTodayWorkout');
    if (btnDeleteWorkout) {
      btnDeleteWorkout.onclick = () => {
        if (confirm('Bugünkü egzersiz kaydını silmek istediğinize emin misiniz?')) {
          const todayStr = this.engine.getTodaySummary().todayStr;
          this.storage.deleteExercise(todayStr);
          this.render();
          if (this.onDataChanged) this.onDataChanged();
        }
      };
    }

    // Geçmişteki Egzersizi Silme
    this.container.querySelectorAll('.btn-del-history-workout').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const dateStr = btn.dataset.date;
        if (confirm(`${dateStr} tarihli egzersiz kaydı silinsin mi?`)) {
          this.storage.deleteExercise(dateStr);
          this.render();
          if (this.onDataChanged) this.onDataChanged();
        }
      };
    });

    // Formu Aç/Kapat Butonu
    const btnToggleForm = this.container.querySelector('#btnToggleWorkoutForm');
    const workoutFormCard = this.container.querySelector('#workoutFormCard');
    if (btnToggleForm && workoutFormCard) {
      btnToggleForm.onclick = () => {
        workoutFormCard.style.display = workoutFormCard.style.display === 'none' ? 'block' : 'none';
        workoutFormCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
    }

    // Rehber Akordeon Başlıkları
    this.container.querySelectorAll('.phase-fitness-card .pfc-header').forEach(hdr => {
      hdr.onclick = () => {
        const card = hdr.closest('.phase-fitness-card');
        const body = card.querySelector('.pfc-body');
        const isShown = (body.style.display === 'block');
        body.style.display = isShown ? 'none' : 'block';
        card.querySelector('.pfc-arrow').textContent = isShown ? '▼' : '▲';
      };
    });

    // Su Hızlı Ekleme Butonları
    this.container.querySelectorAll('.btn-water-quick').forEach(btn => {
      btn.onclick = () => {
        const amount = parseInt(btn.dataset.amount, 10);
        const todayStr = this.engine.getTodaySummary().todayStr;
        this.storage.logWater(todayStr, amount);
        this.render();
        if (this.onDataChanged) this.onDataChanged();
      };
    });

    // Su Geri Al Butonu
    const btnWaterUndo = this.container.querySelector('#btnWaterUndo');
    if (btnWaterUndo) {
      btnWaterUndo.onclick = () => {
        const todayStr = this.engine.getTodaySummary().todayStr;
        this.storage.logWater(todayStr, -250);
        this.render();
        if (this.onDataChanged) this.onDataChanged();
      };
    }

    // Su Hedefi Değiştirme
    const selectTarget = this.container.querySelector('#selectWaterTarget');
    if (selectTarget) {
      selectTarget.onchange = (e) => {
        const newTarget = parseInt(e.target.value, 10);
        this.storage.updateSettings({ waterTarget: newTarget });
        this.render();
        if (this.onDataChanged) this.onDataChanged();
      };
    }
  }

  // Dinamik Biyolojik Uyum Paneli Güncelleyici
  updateDynamicAnalysis() {
    const analysisBox = this.container.querySelector('#cycleDynamicAnalysisBox');
    if (!analysisBox) return;

    const currentPhase = this.engine.getTodaySummary().dayStatus.phase || 'follicular';
    const phaseKey = ['period', 'follicular', 'ovulation', 'luteal'].includes(currentPhase) ? currentPhase : 'follicular';
    const analysis = FitnessComponent.analyzeExerciseCompatibility(phaseKey, this.selectedExerciseType, this.selectedIntensity);
    const typeObj = EXERCISE_TYPES.find(t => t.id === this.selectedExerciseType) || { name: 'Egzersiz' };
    const estCalories = Math.round((typeObj.calPerHour || 300) * (this.selectedDuration / 60));

    analysisBox.innerHTML = `
      <div class="cda-header-row">
        <span class="cda-status-pill ${analysis.badgeClass}">${analysis.statusText}</span>
        <span class="cda-calories-pill">🔥 Yaklaşık ${estCalories} kcal</span>
      </div>
      <div class="cda-body">
        <p class="cda-benefit"><strong>🌸 Döngüye Katkısı:</strong> ${analysis.benefit}</p>
        <p class="cda-tip"><strong>💡 Beden İpucu:</strong> ${analysis.tip}</p>
      </div>
    `;
  }
}

  render() {
    this.container.innerHTML = `
      <div class="calendar-wrapper">

        <div class="calendar-header">
          <div class="calendar-title-group">

          </div>

            <button class="cal-nav-btn" id="calPrevMonth" aria-label="Önceki Ay">

        </div>

        <!-- Hafta Günleri -->
        <div class="calendar-weekdays">

        <div class="calendar-days-grid" id="calDaysGrid">
          ${this.buildDaysGridHtml()}
        </div>

      <div class="day-modal-overlay" id="dayModalOverlay">
        <div class="day-modal-sheet" id="dayModalSheet">
          <div class="modal-drag-handle"></div>
          <div class="day-modal-content" id="dayModalContent">
            <!-- Dinamik doldurulur -->
          </div>
          <div class="modal-actions-bar" id="dayModalActionsBar">
            <button type="button" class="btn-primary-action" id="btnSaveDayDetails">
              ${Icons.check} Kaydet & Güncelle
            </button>
          </div>
        </div>
      </div>
    `;

    this.attachEvents();
  }

  attachEvents() {
    const prevBtn = this.container.querySelector('#calPrevMonth');
    const nextBtn = this.container.querySelector('#calNextMonth');
    const todayBtn = this.container.querySelector('#calTodayBtn');
    const grid = this.container.querySelector('#calDaysGrid');
    const modalOverlay = this.container.querySelector('#dayModalOverlay');

    if (prevBtn) {
      prevBtn.onclick = () => {
        if (this.currentMonth === 0) {
          this.currentMonth = 11;
          this.currentYear--;
        } else {
          this.currentMonth--;
        }
        this.updateMonthView();
      };
    }

    if (nextBtn) {
      nextBtn.onclick = () => {
        if (this.currentMonth === 11) {
          this.currentMonth = 0;
          this.currentYear++;
        } else {
          this.currentMonth++;
        }
        this.updateMonthView();
      };
    }

    if (todayBtn) {
      todayBtn.onclick = () => {
        const today = new Date();
        this.currentYear = today.getFullYear();
        this.currentMonth = today.getMonth();
        this.selectedDateStr = CycleEngine.formatDateStr(today);
        this.updateMonthView();
        this.openDayModal(this.selectedDateStr);
      };
    }

    if (grid) {
      grid.onclick = (e) => {
        const dayCell = e.target.closest('.cal-day-cell');
        if (dayCell && dayCell.dataset.date) {
          this.selectedDateStr = dayCell.dataset.date;
          this.highlightSelectedCell();
          this.openDayModal(this.selectedDateStr);
        }
      };
    }

    if (modalOverlay) {
      modalOverlay.onclick = (e) => {
        if (e.target === modalOverlay) {
          this.closeDayModal();
        }
      };
    }
  }

  updateMonthView() {
    const title = this.container.querySelector('#calMonthTitle');
    const grid = this.container.querySelector('#calDaysGrid');
    if (title) {
      title.textContent = `${this.monthNames[this.currentMonth]} ${this.currentYear}`;
    }
    if (grid) {
      grid.innerHTML = this.buildDaysGridHtml();
    }
  }

  highlightSelectedCell() {
    this.container.querySelectorAll('.cal-day-cell').forEach(cell => {
      cell.classList.toggle('selected-cell', cell.dataset.date === this.selectedDateStr);
    });
  }

  // --- Gün Hücreleri Üretimi ---
  buildDaysGridHtml() {
    const firstDay = new Date(this.currentYear, this.currentMonth, 1);
    const lastDay = new Date(this.currentYear, this.currentMonth + 1, 0);
    const totalDays = lastDay.getDate();

    // Pazartesi ilk gün (0 = Pzt, 6 = Paz)
    let startDayOfWeek = firstDay.getDay() - 1;
    if (startDayOfWeek === -1) startDayOfWeek = 6;

    const todayStr = CycleEngine.formatDateStr(new Date());
    let html = '';

    // Önceki aydan taşan boşluklar
    for (let i = 0; i < startDayOfWeek; i++) {
      html += `<div class="cal-day-cell empty-day"></div>`;
    }

    // Ayın günleri
    for (let d = 1; d <= totalDays; d++) {
      const dateObj = new Date(this.currentYear, this.currentMonth, d);
      const dateStr = CycleEngine.formatDateStr(dateObj);
      const dayData = this.storage.getDayData(dateStr) || {};
      const status = this.engine.getDayStatus(dateStr);
      const isToday = (dateStr === todayStr);
      const isSelected = (dateStr === this.selectedDateStr);

      const symptomsList = Array.isArray(dayData.symptoms) ? dayData.symptoms : [];
      const hasSymptoms = symptomsList.length > 0;
      const moodsList = Array.isArray(dayData.moods) ? dayData.moods : (dayData.mood ? [dayData.mood] : []);
      const hasMood = moodsList.length > 0;
      const hasNotes = !!(dayData.notes && dayData.notes.trim());

      let primarySymptomIcon = '';
      if (hasSymptoms) {
        const foundSym = this.symptomList.find(s => s.id === symptomsList[0]);
        primarySymptomIcon = foundSym ? foundSym.icon : '⚡';
      }
      let moodBadgeHtml = '';
      if (hasMood) {
        const foundMood = this.moodList.find(m => m.id === moodsList[0]);
        const primaryMoodIcon = foundMood ? foundMood.icon : '✨';
        const extraMoodCount = moodsList.length - 1;
        moodBadgeHtml = `<span class="indicator-sym-badge" title="${moodsList.length} Ruh Hali">${primaryMoodIcon}${extraMoodCount > 0 ? `<sup class="sym-plus">+${extraMoodCount}</sup>` : ''}</span>`;
      }

      // CSS Sınıfları
      const classes = ['cal-day-cell'];
      if (isToday) classes.push('is-today');
      if (isSelected) classes.push('selected-cell');

      if (status.phase === 'period') classes.push('phase-period');
      else if (status.phase === 'predicted_period') classes.push('phase-predicted-period');
      else if (status.phase === 'ovulation') classes.push('phase-ovulation');
      else if (status.phase === 'fertile') classes.push('phase-fertile');
      else if (status.phase === 'pms') classes.push('phase-pms');
      else if (status.phase === 'follicular') classes.push('phase-follicular');
      else if (status.phase === 'luteal') classes.push('phase-luteal');

      html += `
        <div class="${classes.join(' ')}" data-date="${dateStr}">
          <span class="day-number">${d}</span>
          <div class="day-indicators">
            ${status.phase === 'period' ? `<span class="indicator-dot period-dot" title="Regl"></span>` : ''}
            ${status.phase === 'predicted_period' ? `<span class="indicator-dot predicted-dot" title="Tahmini Regl"></span>` : ''}
            ${status.phase === 'ovulation' ? `<span class="indicator-dot ovulation-dot" title="Yumurtlama"></span>` : ''}
            ${status.phase === 'fertile' ? `<span class="indicator-dot fertile-dot" title="Doğurgan Gün"></span>` : ''}
            ${status.phase === 'pms' ? `<span class="indicator-dot pms-dot" title="PMS Dönemi"></span>` : ''}
            ${status.phase === 'follicular' ? `<span class="indicator-dot follicular-dot" title="Foliküler Faz"></span>` : ''}
            ${hasSymptoms ? `<span class="indicator-sym-badge" title="${symptomsList.length} belirti: ${symptomsList.join(', ')}">${primarySymptomIcon}${symptomsList.length > 1 ? `<sup class="sym-plus">+</sup>` : ''}</span>` : ''}
            ${moodBadgeHtml}
            ${hasNotes ? `<span class="indicator-note-badge" title="Kişisel Not">📝</span>` : ''}
            ${dayData && dayData.exercise ? `<span class="indicator-sym-badge" title="Egzersiz: ${dayData.exercise.typeName || 'Antrenman'} (${dayData.exercise.duration} dk)">${dayData.exercise.feelIcon || '🏃'}</span>` : ''}
            ${dayData && typeof dayData.waterIntake === 'number' && dayData.waterIntake > 0 ? `<span class="indicator-sym-badge" title="Su: ${dayData.waterIntake} ml">💧</span>` : ''}
          </div>
        </div>
      `;
    }

    return html;
  }

  // --- Gün Detayı & Düzenleme Modalı ---

    const modalOverlay = this.container.querySelector('#dayModalOverlay');

      : (dayData.mood ? [dayData.mood] : []);
    
    const currentDischarge = dayData.discharge || '';
    const currentNotes = dayData.notes || '';
    let currentWater = (typeof dayData.waterIntake === 'number') ? dayData.waterIntake : 0;
    let currentExercise = dayData.exercise ? { ...dayData.exercise } : null;

    // Egzersiz Formu Yerel Durumları
    let isEditingExercise = false;
    let formExType = currentExercise?.type || 'yoga';

      { id: 'dance', name: 'Dans / Zumba', icon: '💃', calPerHour: 380, badge: 'Eğlenceli' },
      { id: 'hiit', name: 'HIIT & Fonksiyonel', icon: '⚡', calPerHour: 620, badge: 'Yüksek Efor' },
      { id: 'cycling', name: 'Bisiklet / Spin', icon: '🚴‍♀️', calPerHour: 450, badge: 'Dayanıklılık' },
      { id: 'breath', name: 'Nefes & Mobilite', icon: '🫁', calPerHour: 120, badge: 'Zihinsel Sakinlik' }

    const intensityLevelsList = INTENSITY_LEVELS || [

    const getCalendarPhaseGuidance = (phase) => {
      switch (phase) {
        case 'period':
          return '🩸 Menstrüasyon: Bol ılık su, magnezyum ağırlıklı beslenme ve dinlenmeye öncelik verin.';
        case 'predicted_period':

              </div>

              <div class="clw-badges-row">
                <span class="clw-badge badge-feel">${currentExercise.feelIcon || '🌟'} ${currentExercise.feelName || 'İyi'}</span>
                <span class="clw-badge badge-intensity">${currentExercise.intensityName || 'Normal'}</span>
                <span class="clw-badge badge-calories">🔥 ~${calcCalories(currentExercise.type, currentExercise.duration)} kcal</span>
              </div>

              ${currentExercise.note ? `
                <p class="clw-note">📝 "${currentExercise.note}"</p>
              ` : ''}

              <!-- Faz Uyum Analizi -->
              <div class="clw-benefit-box">
                <span class="clw-benefit-title">🌸 ${formattedDateTitle} Döngü Katkısı:</span>
                <p class="clw-benefit-text">${currentExercise.cycleBenefit || 'Biyolojik fazınıza uygun hareket hormonları dengeleyip stresi azaltır.'}</p>
              </div>
            </div>
          ` : (isEditingExercise || !currentExercise ? `
            <!-- İnteraktif Egzersiz Formu -->
            <div class="cal-exercise-form-card" id="calExerciseFormCard">
              <div class="cefc-header">
                <h5>${isEditingExercise ? '✏️ Egzersiz Kaydını Güncelle' : '+ Detaylı Egzersiz Kaydı Ekle'}</h5>
                ${isEditingExercise ? `
                  <button type="button" class="btn-cefc-cancel" id="btnCancelEditExercise">Vazgeç</button>
                ` : ''}
              </div>

              <!-- 1. Egzersiz Türü -->
              <div class="cefc-field">
                <label class="cefc-label">1. Egzersiz Türü:</label>
                <div class="cefc-types-grid" id="cefcTypesGrid">
                  ${exerciseTypesList.map(t => `
                    <button type="button" class="cefc-type-btn ${t.id === formExType ? 'selected' : ''}" data-type="${t.id}">
                      <span class="cet-icon">${t.icon}</span>
                      <span class="cet-name">${t.name}</span>
                      <span class="cet-badge">${t.badge}</span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- 2. Süre -->
              <div class="cefc-field">
                <div class="cefc-label-row">
                  <label class="cefc-label">2. Süre (Dakika):</label>
                  <strong class="cefc-dur-val" id="cefcDurationDisplay">${formExDuration} Dakika</strong>
                </div>
                <div class="cefc-duration-chips" id="cefcDurationChips">
                  ${[15, 20, 30, 45, 60, 90].map(dur => `
                    <button type="button" class="cefc-dur-chip ${dur === formExDuration ? 'selected' : ''}" data-dur="${dur}">${dur} dk</button>
                  `).join('')}
                </div>
                <input type="range" min="5" max="120" step="5" value="${formExDuration}" class="cefc-slider" id="cefcDurationSlider">
              </div>

              <!-- 3. Yoğunluk -->
              <div class="cefc-field">
                <label class="cefc-label">3. Yoğunluk Seviyesi:</label>
                <div class="cefc-intensity-grid" id="cefcIntensityGrid">
                  ${intensityLevelsList.map(lvl => `
                    <button type="button" class="cefc-intensity-btn ${lvl.id === formExIntensity ? 'selected' : ''}" data-intensity="${lvl.id}">
                      <span class="cil-icon">${lvl.icon}</span>
                      <div class="cil-info">
                        <strong class="cil-name">${lvl.name}</strong>
                        <span class="cil-desc">${lvl.desc}</span>
                      </div>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Biyolojik Uyum & Kalori Bilgisi -->
              <div class="cefc-feedback-box" id="cefcFeedbackBox">
                <div class="cfb-calorie-row">
                  <span>🔥 Tahmini Yakılan Kalori:</span>
                  <strong id="cefcCaloriesVal">~${calcCalories(formExType, formExDuration)} kcal</strong>
                </div>
                <div id="cefcCompatibilityWrap">
                  ${getExerciseCompatibilityHtml(status.phase, formExType, formExIntensity)}
                </div>
              </div>

              <!-- 4. Egzersiz Sonrası Hissiyat -->
              <div class="cefc-field">
                <label class="cefc-label">4. Egzersiz Sonrası Hissiyat:</label>
                <div class="cefc-feelings-grid" id="cefcFeelingsGrid">
                  ${feelingLevelsList.map(f => `
                    <button type="button" class="cefc-feel-btn ${f.id === formExFeel ? 'selected' : ''}" data-feel="${f.id}">
                      <span class="cfl-icon">${f.icon}</span>
                      <span class="cfl-name">${f.name}</span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- 5. Not -->
              <div class="cefc-field">
                <label class="cefc-label">5. Antrenman Notu (İsteğe Bağlı):</label>
                <input type="text" id="cefcWorkoutNote" class="form-input" placeholder="Örn: Açık havada iyi geldi, nabız dengeliydi..." value="${formExNote}">
              </div>

              <div class="cefc-actions">
                <button type="button" class="btn-primary-action btn-save-cefc-workout" id="btnSaveCefcWorkout">
                  ${Icons.check} Egzersizi Bu Güne Kaydet
                </button>
              </div>
            </div>
          ` : '')}
        </div>

        <!-- SEMPTOMLAR -->
        <div class="modal-section">
          <label class="section-label">⚡ Günlük Semptomlar & Belirtiler</label>
          <div class="chips-grid" id="symptomsChips">
            ${this.symptomList.map(s => {
              const active = currentSymptoms.includes(s.id);
              return `
                <button type="button" class="chip-item ${active ? 'chip-active' : ''}" data-id="${s.id}">
                  <span class="chip-icon">${s.icon}</span>
                  <span class="chip-text">${s.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- ÇOKLU RUH HALİ SEÇİMİ (MULTI-SELECT MOOD) -->
        <div class="modal-section">
          <div class="section-label-row">
            <label class="section-label">✨ Ruh Hali & Duygu Durumu</label>
            <span class="mood-selection-counter" id="moodCounterBadge">
              ${selectedMoods.length > 0 ? `${selectedMoods.length} duygu seçildi` : 'Birden fazla seçilebilir'}
            </span>
          </div>
          <div class="chips-grid" id="moodChips">
            ${this.moodList.map(m => {
              const active = selectedMoods.includes(m.id);
              return `
                <button type="button" class="chip-item ${active ? 'chip-active' : ''}" data-id="${m.id}">
                  <span class="chip-icon">${m.icon}</span>
                  <span class="chip-text">${m.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- AKINTI TİPİ -->
        <div class="modal-section">
          <label class="section-label">💧 Akıntı Durumu</label>
          <div class="chips-row" id="dischargeChips">
            ${this.dischargeList.map(d => {
              const active = currentDischarge === d.id;
              return `
                <button type="button" class="chip-pill ${active ? 'chip-active' : ''}" data-id="${d.id}">
                  ${d.label}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- NOTLAR -->
        <div class="modal-section">
          <label class="section-label">📝 Kişisel Not</label>
          <textarea class="notes-textarea" id="dayNotesInput" placeholder="Bugün nasıl hissediyorsunuz? İlaç, uyku veya özel durumlar..." rows="3">${currentNotes}</textarea>
        </div>
      `;

      attachModalEvents();
    };

    // Tüm Gün Verisini Kalıcı Olarak Saklayan Fonksiyon
    const persistDayState = (notifyUI = true) => {
      const notesInput = modalContent.querySelector('#dayNotesInput');
      const notes = notesInput ? notesInput.value.trim() : currentNotes;
      
      this.storage.saveDayData(dateStr, {
        isPeriod: activePeriodState,
        flow: activePeriodState ? selectedFlow : null,
        symptoms: [...selectedSymptoms],
        moods: [...selectedMoods],
        mood: selectedMoods[0] || null, // Geriye dönük uyumluluk
        discharge: selectedDischarge || null,
        notes: notes,
        waterIntake: currentWater,
        exercise: currentExercise
      });

      this.engine.syncSettingsFromCalendarData();
      if (notifyUI) {
        this.notifyUpdate();
      }
    };

    let activePeriodState = isPeriod;
    let selectedFlow = currentFlow;
    let selectedSymptoms = [...currentSymptoms];
    let selectedDischarge = currentDischarge;

    // Modal İçi Etkinlik Dinleyicileri
    const attachModalEvents = () => {
      const closeBtn = modalContent.querySelector('#modalCloseBtn');
      const togglePeriodBtn = modalContent.querySelector('#btnTogglePeriod');
      const deletePeriodBtn = modalContent.querySelector('#btnDeletePeriod');
      const flowSelector = modalContent.querySelector('#flowSelector');
      const saveBtn = this.container.querySelector('#btnSaveDayDetails');
      const notesInput = modalContent.querySelector('#dayNotesInput');

      if (closeBtn) {
        closeBtn.onclick = () => {
          persistDayState(true);
          this.closeDayModal();
        };
      }

      // Regl Aç / Kapat
      if (togglePeriodBtn) {
        togglePeriodBtn.onclick = () => {
          activePeriodState = !activePeriodState;
          togglePeriodBtn.classList.toggle('active-period', activePeriodState);
          togglePeriodBtn.innerHTML = activePeriodState ? '✓ Bugün Regl Olundu' : '+ Regl Olarak İşaretle';
          if (flowSelector) flowSelector.classList.toggle('disabled-flow', !activePeriodState);

          if (activePeriodState) {
            const clusters = this.engine.getPeriodClusters();
            const isNearCluster = clusters.some(c => {
              const diffStart = CycleEngine.diffDays(dateStr, c.startDate);
              const diffEnd = CycleEngine.diffDays(dateStr, c.endDate);
              return (diffStart >= -1 && diffEnd <= 2);
            });

            if (isNearCluster) {
              this.engine.togglePeriodDay(dateStr, true, selectedFlow);
            } else {
              this.engine.logPeriodStart(dateStr, selectedFlow);
            }
          } else {
            this.engine.togglePeriodDay(dateStr, false);
          }
          persistDayState(true);
          renderModalBody();
        };
      }

      // Regl Kaydını Kaldır
      if (deletePeriodBtn) {
        deletePeriodBtn.onclick = () => {
          this.engine.togglePeriodDay(dateStr, false);
          activePeriodState = false;
          persistDayState(true);
          renderModalBody();
        };
      }

      // Akış Yoğunluğu
      if (flowSelector) {
        flowSelector.querySelectorAll('.flow-btn').forEach(btn => {
          btn.onclick = () => {
            flowSelector.querySelectorAll('.flow-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedFlow = btn.dataset.flow;
            if (activePeriodState) {
              this.engine.togglePeriodDay(dateStr, true, selectedFlow);
              persistDayState(true);
            }
          };
        });
      }

      // --- SU KAYDI BUTONLARI & MANUEL GİRİŞ ---
      const waterDisplay = modalContent.querySelector('#dmWaterDisplay');
      const waterFill = modalContent.querySelector('#dmWaterFill');
      const waterCustomInput = modalContent.querySelector('#calWaterCustomInput');
      const btnWaterApply = modalContent.querySelector('#btnCalWaterApply');
      const btnWaterReset = modalContent.querySelector('#btnCalWaterReset');

      const updateWaterUi = () => {
        if (waterDisplay) waterDisplay.textContent = `${currentWater} ml`;
        const pct = Math.min(100, Math.round((currentWater / waterTarget) * 100));
        if (waterFill) waterFill.style.width = `${pct}%`;
        if (waterCustomInput) waterCustomInput.value = currentWater;
        
        const badge = modalContent.querySelector('.cal-water-percent-badge');
        if (badge) {
          badge.textContent = `%${pct} Hedef`;
          badge.classList.toggle('goal-reached', pct >= 100);
        }
      };

      modalContent.querySelectorAll('.btn-cal-water[data-delta]').forEach(btn => {
        btn.onclick = () => {
          const delta = parseInt(btn.dataset.delta, 10) || 0;
          currentWater = Math.max(0, currentWater + delta);
          updateWaterUi();
          persistDayState(true);
        };
      });

      if (btnWaterReset) {
        btnWaterReset.onclick = () => {
          currentWater = 0;
          updateWaterUi();
          persistDayState(true);
        };
      }

      if (btnWaterApply && waterCustomInput) {
        btnWaterApply.onclick = () => {
          const val = parseInt(waterCustomInput.value, 10);
          if (!isNaN(val) && val >= 0) {
            currentWater = val;
            updateWaterUi();
            persistDayState(true);
            btnWaterApply.textContent = '✓';
            setTimeout(() => { if (btnWaterApply) btnWaterApply.textContent = 'Kaydet'; }, 1000);
          }
        };
      }

      // --- EGZERSİZ ETKİNLİKLERİ & FORM ---
      const btnEditEx = modalContent.querySelector('#btnEditCalExercise');
      const btnDeleteEx = modalContent.querySelector('#btnDeleteCalExercise');
      const btnCancelEdit = modalContent.querySelector('#btnCancelEditExercise');
      const btnSaveWorkout = modalContent.querySelector('#btnSaveCefcWorkout');

      if (btnEditEx) {
        btnEditEx.onclick = () => {
          isEditingExercise = true;
          renderModalBody();
        };
      }

      if (btnDeleteEx) {
        btnDeleteEx.onclick = () => {
          if (confirm('Bu günün egzersiz kaydı silinsin mi?')) {
            currentExercise = null;
            isEditingExercise = false;
            persistDayState(true);
            renderModalBody();
          }
        };
      }

      if (btnCancelEdit) {
        btnCancelEdit.onclick = () => {
          isEditingExercise = false;
          renderModalBody();
        };
      }

      // Egzersiz Formu Seçicileri
      const updateExerciseFormLiveState = () => {
        const calVal = modalContent.querySelector('#cefcCaloriesVal');
        if (calVal) calVal.textContent = `~${calcCalories(formExType, formExDuration)} kcal`;

        const compWrap = modalContent.querySelector('#cefcCompatibilityWrap');
        if (compWrap) compWrap.innerHTML = getExerciseCompatibilityHtml(status.phase, formExType, formExIntensity);
      };

      modalContent.querySelectorAll('#cefcTypesGrid .cefc-type-btn').forEach(btn => {
        btn.onclick = () => {
          modalContent.querySelectorAll('#cefcTypesGrid .cefc-type-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          formExType = btn.dataset.type;
          updateExerciseFormLiveState();
        };
      });

      const durDisplay = modalContent.querySelector('#cefcDurationDisplay');
      const durSlider = modalContent.querySelector('#cefcDurationSlider');

      modalContent.querySelectorAll('#cefcDurationChips .cefc-dur-chip').forEach(btn => {
        btn.onclick = () => {
          modalContent.querySelectorAll('#cefcDurationChips .cefc-dur-chip').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          formExDuration = parseInt(btn.dataset.dur, 10);
          if (durDisplay) durDisplay.textContent = `${formExDuration} Dakika`;
          if (durSlider) durSlider.value = formExDuration;
          updateExerciseFormLiveState();
        };
      });

      if (durSlider) {
        durSlider.oninput = () => {
          formExDuration = parseInt(durSlider.value, 10);
          if (durDisplay) durDisplay.textContent = `${formExDuration} Dakika`;
          modalContent.querySelectorAll('#cefcDurationChips .cefc-dur-chip').forEach(b => {
            b.classList.toggle('selected', parseInt(b.dataset.dur, 10) === formExDuration);
          });
          updateExerciseFormLiveState();
        };
      }

      modalContent.querySelectorAll('#cefcIntensityGrid .cefc-intensity-btn').forEach(btn => {
        btn.onclick = () => {
          modalContent.querySelectorAll('#cefcIntensityGrid .cefc-intensity-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          formExIntensity = btn.dataset.intensity;
          updateExerciseFormLiveState();
        };
      });

      modalContent.querySelectorAll('#cefcFeelingsGrid .cefc-feel-btn').forEach(btn => {
        btn.onclick = () => {
          modalContent.querySelectorAll('#cefcFeelingsGrid .cefc-feel-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          formExFeel = btn.dataset.feel;
        };
      });

      if (btnSaveWorkout) {
        btnSaveWorkout.onclick = () => {
          const typeObj = exerciseTypesList.find(t => t.id === formExType) || { name: 'Egzersiz', icon: '🏃‍♀️' };
          const intObj = intensityLevelsList.find(i => i.id === formExIntensity) || { name: 'Normal' };
          const feelObj = feelingLevelsList.find(f => f.id === formExFeel) || { name: 'Enerjik', icon: '🌟' };
          const noteInput = modalContent.querySelector('#cefcWorkoutNote');
          const noteVal = noteInput ? noteInput.value.trim() : '';

          let cycleBenefitText = 'Biyolojik fazınıza uygun hareket hormonlarınızı dengeler.';
          if (typeof CYCLE_FITNESS_GUIDANCE !== 'undefined' && CYCLE_FITNESS_GUIDANCE[status.phase]) {
            cycleBenefitText = CYCLE_FITNESS_GUIDANCE[status.phase].cycleBenefit;
          }

          currentExercise = {
            type: formExType,
            typeName: typeObj.name,
            duration: formExDuration,
            intensity: formExIntensity,
            intensityName: intObj.name,
            feel: formExFeel,
            feelName: feelObj.name,
            feelIcon: feelObj.icon,
            caloriesBurned: calcCalories(formExType, formExDuration),
            cycleBenefit: cycleBenefitText,
            note: noteVal,
            dateStr: dateStr
          };

          isEditingExercise = false;
          persistDayState(true);
          renderModalBody();
        };
      }

      // --- SEMPTOMLAR ÇOKLU SEÇİMİ ---
      modalContent.querySelectorAll('#symptomsChips .chip-item').forEach(chip => {
        chip.onclick = () => {
          const id = chip.dataset.id;
          if (selectedSymptoms.includes(id)) {
            selectedSymptoms = selectedSymptoms.filter(item => item !== id);
            chip.classList.remove('chip-active');
          } else {
            selectedSymptoms.push(id);
            chip.classList.add('chip-active');
          }
          persistDayState(true);
        };
      });

      // --- ÇOKLU RUH HALİ (MULTI-SELECT MOOD) SEÇİMİ ---
      const moodCounterBadge = modalContent.querySelector('#moodCounterBadge');
      modalContent.querySelectorAll('#moodChips .chip-item').forEach(chip => {
        chip.onclick = () => {
          const id = chip.dataset.id;
          if (selectedMoods.includes(id)) {
            selectedMoods = selectedMoods.filter(m => m !== id);
            chip.classList.remove('chip-active');
          } else {
            selectedMoods.push(id);
            chip.classList.add('chip-active');
          }
          if (moodCounterBadge) {
            moodCounterBadge.textContent = selectedMoods.length > 0 
              ? `${selectedMoods.length} duygu seçildi` 
              : 'Birden fazla seçilebilir';
          }
          persistDayState(true);
        };
      });

      // --- AKINTI TİPİ SEÇİMİ ---
      modalContent.querySelectorAll('#dischargeChips .chip-pill').forEach(pill => {
        pill.onclick = () => {
          const id = pill.dataset.id;
          if (selectedDischarge === id) {
            selectedDischarge = '';
            pill.classList.remove('chip-active');
          } else {
            selectedDischarge = id;
            modalContent.querySelectorAll('#dischargeChips .chip-pill').forEach(p => p.classList.remove('chip-active'));
            pill.classList.add('chip-active');
          }
          persistDayState(true);
        };
      });

      // --- NOTLAR ---
      if (notesInput) {
        notesInput.oninput = () => {
          persistDayState(false);
        };
        notesInput.onblur = () => {
          persistDayState(true);
        };
      }

      // --- TÜMÜNÜ KAYDET & GÜNCELLE ---
      if (saveBtn) {
        saveBtn.onclick = () => {
          persistDayState(true);

          const originalHtml = saveBtn.innerHTML;
          saveBtn.innerHTML = `✓ Kaydedildi!`;
          saveBtn.style.background = '#10b981';
          saveBtn.style.color = '#ffffff';

          setTimeout(() => {
            saveBtn.innerHTML = originalHtml;
            saveBtn.style.background = '';
            saveBtn.style.color = '';
            this.closeDayModal();
          }, 450);
        };
      }
    };

    renderModalBody();
    modalOverlay.classList.add('active');

    if (focusSection === 'mood') {
      setTimeout(() => {
        const moodSection = modalContent.querySelector('#moodChips');
        if (moodSection) {
          moodSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
          moodSection.style.transition = 'all 0.3s ease';
          moodSection.style.boxShadow = '0 0 0 2px #ec4899';
          moodSection.style.borderRadius = '12px';
          setTimeout(() => { moodSection.style.boxShadow = 'none'; }, 2200);
        }
      }, 120);
    }
  }

  closeDayModal() {
    const modalOverlay = this.container.querySelector('#dayModalOverlay');
    if (modalOverlay) {
      modalOverlay.classList.remove('active');
    }
  }

  notifyUpdate() {
    this.updateMonthView();
    if (typeof this.onDataChanged === 'function') {
      this.onDataChanged();
    }
  }

  // Dışarıdan belirli bir güne atlama (Örn: Bugün veya 31 Ağustos)
  goToDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    this.currentYear = y;
    this.currentMonth = m - 1;
    this.selectedDateStr = dateStr;
    this.updateMonthView();
    this.highlightSelectedCell();
    this.openDayModal(dateStr);
  }
}


/**
 * Döngüm - Sağlık Analitiği ve Döngü İstatistikleri
 * Düzenlilik skoru, geçmiş dönemler grafiği, semptom frekansı ve gelecek tahmin çizelgesi
 */





class AnalyticsComponent {
  constructor(containerEl, engine, storage, onGoToDate) {
    this.container = containerEl;
    this.engine = engine;
    this.storage = storage;
    this.onGoToDate = onGoToDate;
    this.reportGen = new DoctorReportGenerator(this.engine, this.storage);
  }

  render() {
    const stats = this.engine.calculateStats();
    const clusters = this.engine.getPeriodClusters().reverse(); // En yeniden en eskiye
    const projections = this.engine.getProjections(6);
    const profileData = this.storage.getProfileData();
    const symptomStats = this.calculateSymptomFrequencies(profileData.days);
    const fitStats = this.storage.getMonthlyFitnessStats();
    const streakInfo = this.storage.getExerciseStreak();
    const waterHistory = this.storage.getWeeklyWaterHistory(7);
    const avgWater = Math.round(waterHistory.reduce((acc, curr) => acc + curr.amount, 0) / Math.max(1, waterHistory.length));

    this.container.innerHTML = `
      <div class="analytics-wrapper">
        <!-- Başlık -->
        <div class="analytics-header">
          <h2 class="section-heading">Döngü & Sağlık Analizi</h2>
          <p class="section-subheading">Kişisel verilerinizle modellenmiş gerçekçi sağlık ve döngü raporu</p>
        </div>

        <!-- Jinekolog PDF Sağlık Raporu Kartı -->
        <div class="doctor-report-banner">
          <div class="dr-banner-icon-col">
            <span class="dr-banner-icon">🩺</span>
          </div>
          <div class="dr-banner-content">
            <h4 class="dr-banner-title">Jinekolog Klinik Sağlık Raporu</h4>
            <p class="dr-banner-desc">
              Tüm döngülerinizi, kanama ritminizi ve semptomlarınızı doktorunuza sunabileceğiniz resmi klinik PDF belgesine dönüştürün.
            </p>
            <button type="button" class="btn-generate-pdf" id="btnOpenDoctorReport">
              ${Icons.fileText} Jinekolog Raporunu Aç & PDF İndir
            </button>
          </div>
        </div>

        <!-- Özet İstatistik Kartları -->
        <div class="stats-overview-grid">
          <!-- Düzenlilik Skoru -->
          <div class="stat-card card-regularity">
            <div class="stat-icon-wrap" style="color: #10b981;">
              ${Icons.shield}
            </div>
            <div class="stat-info">
              <span class="stat-label">Düzenlilik Skoru</span>
              <div class="stat-value-group">
                <span class="stat-number">%${stats.regularityScore}</span>

    this.attachEvents();
  }

  attachEvents() {
    const reportBtn = this.container.querySelector('#btnOpenDoctorReport');
    if (reportBtn) {
      reportBtn.onclick = () => {
        this.reportGen.openReportModal();
      };
    }

    this.container.querySelectorAll('.btn-goto-date, .btn-history-view').forEach(btn => {
      btn.onclick = () => {
        const dateStr = btn.dataset.date;
        if (dateStr && typeof this.onGoToDate === 'function') {
          this.onGoToDate(dateStr);
        }
      };
    });
  }

  formatDateReadable(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    const months = [
      'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
      'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'
    ];
    return `${d} ${months[m - 1]} ${y}`;
  }

  calculateSymptomFrequencies(days = {}) {
    const symptomLabels = {
      cramps: { label: 'Kramplar', icon: '⚡' },
      headache: { label: 'Baş Ağrısı', icon: '🤕' },
      bloating: { label: 'Şişkinlik', icon: '🎈' },
      breast: { label: 'Göğüs Hassasiyeti', icon: '🌸' },
      backache: { label: 'Bel Ağrısı', icon: '🦴' },
      acne: { label: 'Sivilce/Cilt', icon: '✨' },
      fatigue: { label: 'Yorgunluk', icon: '😴' },
      nausea: { label: 'Mide Bulantısı', icon: '🤢' },
      insomnia: { label: 'Uykusuzluk', icon: '🌙' },
      craving: { label: 'Tatlı/Aşerme', icon: '🍫' }
    };

    const counts = {};
    let totalDaysWithSymptoms = 0;

    Object.values(days).forEach(day => {
      if (day.symptoms && day.symptoms.length > 0) {
        totalDaysWithSymptoms++;
        day.symptoms.forEach(sym => {
          counts[sym] = (counts[sym] || 0) + 1;
        });
      }
    });

    if (totalDaysWithSymptoms === 0) return [];

    return Object.keys(counts)
      .map(k => ({
        id: k,
        label: (symptomLabels[k] && symptomLabels[k].label) || k,
        icon: (symptomLabels[k] && symptomLabels[k].icon) || '•',
        count: counts[k],
        percentage: Math.round((counts[k] / totalDaysWithSymptoms) * 100)
      }))
      .sort((a, b) => b.count - a.count);
  }
}


/**
 * Döngüm - Jinekolog Sağlık & Döngü Raporu Üretici (PDF / Yazdırma)
 * Hekim muayenesine yönelik resmi klinik menstrüel döngü raporu oluşturur.
 */




class DoctorReportGenerator {
  constructor(engine, storage) {
    this.engine = engine;
    this.storage = storage;
  }

  // Tarih biçimlendirme
  formatDateTR(dateStr) {
    if (!dateStr) return '-';
    const [y, m, d] = dateStr.split('-').map(Number);
    const months = [
      'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
      'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'
    ];
    return `${d} ${months[m - 1]} ${y}`;
  }

  generateReportHtml() {
    const profile = this.storage.getActiveProfile();
    const profileData = this.storage.getProfileData();
    const stats = this.engine.calculateStats();
    const clusters = this.engine.getPeriodClusters().reverse();
    const days = profileData.days || {};

    const todayStr = CycleEngine.formatDateStr(new Date());
    const reportRefNo = 'RAP-' + todayStr.replace(/-/g, '') + '-' + Math.floor(1000 + Math.random() * 9000);

      cramps: 'Dismenore (Kramplar / Kasık Ağrısı)',
      headache: 'Sefalji / Baş Ağrısı',
      bloating: 'Karında Distansiyon / Şişkinlik',
      breast: 'Mastodini (Meme Hassasiyeti)',
      backache: 'Lomber / Bel Ağrısı',
      acne: 'Akneiform Lezyonlar / Cilt',
      fatigue: 'Kronik Yorgunluk / Letarji',
      nausea: 'Gastrointestinal Hassasiyet / Bulantı',
      insomnia: 'Uykusuzluk / İnsomni',
      craving: 'İştah Değişikliği / Aşerme'
    };

    const symptomCounts = {};
    const flowCounts = { spotting: 0, light: 0, medium: 0, heavy: 0 };
    let totalLoggedDays = 0;

    Object.values(days).forEach(d => {
      totalLoggedDays++;
      if (d.flow && flowCounts[d.flow] !== undefined) {
        flowCounts[d.flow]++;
      }
      if (d.symptoms && Array.isArray(d.symptoms)) {
        d.symptoms.forEach(s => {
          symptomCounts[s] = (symptomCounts[s] || 0) + 1;
        });
      }
    });

    const totalFlowEntries = Object.values(flowCounts).reduce((a, b) => a + b, 0);

    return `
      <div class="doctor-report-document" id="printableDoctorReport">
        <!-- Rapor Başlığı & Klinik Antet -->

          <div class="dr-header-emblem">
            <span class="dr-caduceus">⚕</span>
            <div>

              <p class="dr-clinic-subtitle">Jinekolojik Değerlendirme ve Biyolojik Döngü Takip Belgesi</p>
            </div>
          </div>
          <div class="dr-header-meta">
            <div><strong>Rapor No:</strong> ${reportRefNo}</div>
            <div><strong>Düzenleme Tarihi:</strong> ${this.formatDateTR(todayStr)}</div>
            <div><strong>Sistem:</strong> Döngüm Sağlık Takip Modeli</div>
          </div>
        </div>

        <!-- Hasta / Profil Bilgileri -->
        <div class="dr-patient-box">
          <div class="dr-patient-col">
            <span class="dr-label">Hasta / Danışan Adı:</span>
            <strong class="dr-val">${profile.name}</strong>
          </div>
          <div class="dr-patient-col">
            <span class="dr-label">Kayıtlı Döngü Sayısı:</span>
            <strong class="dr-val">${clusters.length} Döngü</strong>
          </div>
          <div class="dr-patient-col">
            <span class="dr-label">Döngü Düzenlilik İndeksi:</span>
            <strong class="dr-val" style="color: ${stats.regularityScore >= 85 ? '#059669' : '#d97706'};">
              %${stats.regularityScore} (${stats.regularityScore >= 85 ? 'Ritmik / Düzenli' : 'Hafif Düzensiz'})
            </strong>
          </div>
        </div>

        <!-- Temel Biyometrik Siklus Parametreleri -->
        <div class="dr-section-title">1. KLİNİK SİKLUS METRİKLERİ VE İSTATİSTİKLER</div>
        <table class="dr-metrics-table">
          <thead>
            <tr>
              <th>Parametre</th>
              <th>Hesaplanan Değer</th>
              <th>Klinik Referans Aralığı</th>
              <th>Değerlendirme</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Ortalama Siklus Uzunluğu</strong></td>
              <td><strong>${stats.averageCycleLength} gün</strong></td>
              <td>21 - 35 gün</td>
              <td><span class="dr-badge-ok">${stats.averageCycleLength >= 21 && stats.averageCycleLength <= 35 ? 'Normal Fizyolojik Aralık' : 'Referans Dışı'}</span></td>
            </tr>
            <tr>
              <td><strong>Ortalama Menstrüasyon (Kanama) Süresi</strong></td>
              <td><strong>${stats.averagePeriodLength} gün</strong></td>
              <td>3 - 7 gün</td>
              <td><span class="dr-badge-ok">${stats.averagePeriodLength >= 3 && stats.averagePeriodLength <= 7 ? 'Normal' : 'İnceleme Önerilir'}</span></td>
            </tr>

              <td>12 - 16 gün</td>
              <td><span class="dr-badge-ok">Stabil</span></td>
            </tr>
            <tr>
              <td><strong>Siklus Değişkenliği (Standart Sapma)</strong></td>
              <td><strong>±${stats.stdDev} gün</strong></td>
              <td>&lt; 3.0 gün</td>
              <td><span class="dr-badge-ok">${stats.stdDev <= 3 ? 'Yüksek Düzen' : 'Takip Edilmeli'}</span></td>
            </tr>
          </tbody>
        </table>

        <!-- Geçmiş Menstrüel Sikluslar Tablosu -->
        <div class="dr-section-title" style="margin-top: 20px;">2. AYRINTILI SİKLUS GEÇMİŞİ (SON DÖNEMLER)</div>
        <table class="dr-cycles-table">
          <thead>
            <tr>
              <th>Döngü No</th>
              <th>Başlangıç Tarihi</th>
              <th>Bitiş Tarihi</th>
              <th>Kanama Süresi</th>
              <th>Siklus Aralığı</th>
              <th>Klinik Durum</th>
            </tr>
          </thead>
          <tbody>
            ${clusters.length > 0 ? clusters.map((c, i) => {
              const prevCluster = clusters[i + 1];
              const intervalDays = prevCluster 
                ? CycleEngine.diffDays(c.startDate, prevCluster.startDate) 
                : stats.averageCycleLength;

              let statusText = 'Normal';
              if (intervalDays > 35) statusText = 'Oligomenore (Uzun)';
              else if (intervalDays < 21) statusText = 'Polimenore (Kısa)';

              return `
                <tr>
                  <td><strong>${clusters.length - i}. Siklus</strong></td>
                  <td>${this.formatDateTR(c.startDate)}</td>
                  <td>${this.formatDateTR(c.endDate)}</td>
                  <td>${c.duration} Gün</td>
                  <td>${intervalDays} Gün</td>
                  <td>${statusText}</td>
                </tr>
              `;
            }).join('') : `
              <tr>
                <td colspan="6" style="text-align: center; color: #64748b; padding: 14px;">Henüz geçmiş döngü kaydı bulunmamaktadır.</td>
              </tr>
            `}
          </tbody>
        </table>

        <!-- Semptom ve Akış Analizi -->
        <div class="dr-section-title" style="margin-top: 20px;">3. BELİRTİ, SEMPTOM VE KANAMA YOĞUNLUĞU DAĞILIMI</div>
        <div class="dr-symptoms-layout">
          <!-- Semptom Sıklıkları -->
          <div class="dr-subtable-box">
            <h4 class="dr-subtable-title">Bildirilen Semptomlar & Görülme Sıklığı</h4>
            <table class="dr-subtable">
              <thead>
                <tr>
                  <th>Semptom / Şikayet</th>

                  <th>Oran</th>
                </tr>
              </thead>
              <tbody>
                ${Object.keys(symptomCounts).length > 0 ? Object.keys(symptomCounts).map(k => {
                  const label = symptomLabels[k] || k;
                  const cnt = symptomCounts[k];
                  const pct = Math.round((cnt / (clusters.length || 1)) * 100);
                  return `
                    <tr>
                      <td>${label}</td>
                      <td>${cnt} gün</td>
                      <td>%${pct}</td>
                    </tr>
                  `;
                }).join('') : `
                  <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Spesifik semptom kaydedilmedi.</td></tr>
                `}
              </tbody>
            </table>
          </div>

          <!-- Kanama Yoğunluğu -->
          <div class="dr-subtable-box">

              </div>

  // Modalı ekrana yerleştirir ve yazdırma/PDF akışını başlatır
  openReportModal() {
    let overlay = document.getElementById('doctorReportModalOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'doctorReportModalOverlay';
      overlay.className = 'doctor-report-overlay';
      document.body.appendChild(overlay);
    }

    const reportContent = this.generateReportHtml();

    overlay.innerHTML = `
      <div class="doctor-modal-window">
        <!-- Modal Üst Aksiyon Barı (Yazdırırken gizlenir) -->
        <div class="dr-modal-actions-bar no-print">
          <div class="dr-actions-left">
            <span class="dr-badge-icon">🩺</span>
            <h3>Jinekolog Klinik Sağlık Raporu</h3>
          </div>
          <div class="dr-actions-right">
            <button type="button" class="btn-print-report" id="btnPrintReportPdf">
              ${Icons.printer} PDF Olarak Kaydet / Yazdır
            </button>
            <button type="button" class="btn-close-report" id="btnCloseReportModal">
              ${Icons.close}
            </button>
          </div>
        </div>

        <!-- Yazdırılabilir A4 Rapor Kağıdı -->
        <div class="dr-paper-container">
          ${reportContent}
        </div>
      </div>
    `;

    overlay.classList.add('active');

    // Kapatma butonu
    const closeBtn = overlay.querySelector('#btnCloseReportModal');
    if (closeBtn) {
      closeBtn.onclick = () => overlay.classList.remove('active');
    }

    overlay.onclick = (e) => {
      if (e.target === overlay) overlay.classList.remove('active');
    };

    // PDF / Yazdır butonu
    const printBtn = overlay.querySelector('#btnPrintReportPdf');
    if (printBtn) {
      printBtn.onclick = () => {
        window.print();
      };
    }
  }
}

  // --- PIN Kilit Kontrolü ---
  checkPinLock() {
    if (!this.storage.isPinRequired()) {
      const overlay = document.getElementById('pinLockOverlay');
      if (overlay) overlay.classList.remove('active');
      return;
    }

    let enteredPin = '';
    const pinDots = document.querySelectorAll('#pinDots .pin-dot');
    const errorMsg = document.getElementById('pinErrorMsg');
    const keypad = document.getElementById('pinKeypad');

    const updateDots = () => {
      pinDots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < enteredPin.length);
      });
    };

    if (keypad) {
      keypad.onclick = (e) => {
        const btn = e.target.closest('.pin-key-btn');
        if (!btn) return;
        const key = btn.dataset.key;

        if (key === 'C') {
          enteredPin = '';
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (key === '←') {
          enteredPin = enteredPin.slice(0, -1);
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (enteredPin.length < 4) {
          enteredPin += key;
          updateDots();

          if (enteredPin.length === 4) {
            setTimeout(() => {
              if (this.storage.checkPin(enteredPin)) {
                const overlay = document.getElementById('pinLockOverlay');
                if (overlay) overlay.classList.remove('active');
                this.isLocked = false;
                enteredPin = '';
                updateDots();
              } else {
                if (errorMsg) errorMsg.textContent = 'Hatalı PIN kodu! Lütfen tekrar deneyin.';
                enteredPin = '';
                updateDots();
              }
            }, 100);
          }
        }
      };
    }

    const btnSwitch = document.getElementById('btnPinSwitchProfile');
    if (btnSwitch) {
      btnSwitch.onclick = () => {
        const overlay = document.getElementById('pinLockOverlay');
        if (overlay) overlay.classList.remove('active');
        this.showLoginScreen();
      };
    }
  }

  // --- Uygulama Açılış Login & Profil Seçim Ekranı ---
  showLoginScreen() {
    const overlay = document.getElementById('appLoginOverlay');
    if (!overlay) return;

    this.isLoggedIn = false;
    overlay.classList.add('active');

    // Profil seçim adımını göster, PIN adımını gizle
    const stepProfiles = document.getElementById('loginStepProfiles');
    const stepPin = document.getElementById('loginStepPin');
    if (stepProfiles) stepProfiles.style.display = 'block';
    if (stepPin) stepPin.style.display = 'none';

    this.renderLoginProfiles();
  }

  renderLoginProfiles() {
    const container = document.getElementById('loginProfilesContainer');
    if (!container) return;

    const profiles = this.storage.getProfiles();
    container.innerHTML = profiles.map(p => {
      const roleObj = PROFILE_ROLES.find(r => r.id === p.role) || { name: 'Kişisel' };
      const hasPin = Boolean(p.pinEnabled && p.pin);
      return `
        <div class="login-profile-card" data-id="${p.id}">
          <div class="login-profile-info">
            <div class="login-profile-avatar" style="border-color: ${p.avatarColor || '#f43f5e'};">
              ${p.avatarEmoji || '🌸'}
            </div>
            <div class="login-profile-names">
              <span class="login-profile-name">${p.name}</span>
              <span class="login-profile-role">${roleObj.name}</span>
            </div>
          </div>
          <div class="login-profile-meta">
            ${hasPin ? `<span class="login-lock-badge">🔒 PIN</span>` : `<span style="font-size: 0.75rem; color: #10b981; font-weight: 600;">Giriş →</span>`}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.login-profile-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        const targetP = this.storage.getProfileById(id);
        if (!targetP) return;

        if (targetP.pinEnabled && targetP.pin) {
          this.showLoginPinPrompt(targetP);
        } else {
          this.completeLogin(targetP);
        }
      };
    });

    const btnNew = document.getElementById('btnLoginCreateProfile');
    if (btnNew) {
      btnNew.onclick = () => {
        this.openProfileModal('create');
      };
    }
  }

  showLoginPinPrompt(targetProfile) {
    const stepProfiles = document.getElementById('loginStepProfiles');
    const stepPin = document.getElementById('loginStepPin');
    const targetBox = document.getElementById('loginTargetProfileBox');
    const dots = document.querySelectorAll('#loginPinDots .pin-dot');
    const keypad = document.getElementById('loginPinKeypad');
    const errorMsg = document.getElementById('loginPinErrorMsg');
    const btnBack = document.getElementById('btnLoginBackToProfiles');

    if (!stepPin || !targetBox) return;

    stepProfiles.style.display = 'none';
    stepPin.style.display = 'block';

    targetBox.innerHTML = `
      <div class="login-target-avatar" style="border-color: ${targetProfile.avatarColor || '#f43f5e'};">
        ${targetProfile.avatarEmoji || '🌸'}
      </div>
      <div class="login-target-name">${targetProfile.name}</div>
      <div class="login-target-hint">Giriş yapmak için 4 haneli PIN kodunuzu tuşlayın</div>
    `;

    if (errorMsg) errorMsg.textContent = '';
    let entered = '';

    const updateDots = () => {
      dots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < entered.length);
      });
    };
    updateDots();

    if (btnBack) {
      btnBack.onclick = () => {
        stepPin.style.display = 'none';
        stepProfiles.style.display = 'block';
        entered = '';
        updateDots();
      };
    }

    if (keypad) {
      keypad.onclick = (e) => {
        const btn = e.target.closest('.pin-key-btn');
        if (!btn) return;
        const key = btn.dataset.key;

        if (key === 'C') {
          entered = '';
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (key === '←') {
          entered = entered.slice(0, -1);
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (entered.length < 4) {
          entered += key;
          updateDots();

          if (entered.length === 4) {
            setTimeout(() => {
              if (this.storage.checkProfilePin(targetProfile.id, entered)) {
                this.completeLogin(targetProfile);
              } else {
                if (errorMsg) errorMsg.textContent = 'Hatalı PIN kodu! Lütfen tekrar deneyin.';
                entered = '';
                updateDots();
              }
            }, 100);
          }
        }
      };
    }
  }

  completeLogin(targetProfile) {
    this.storage.setActiveProfileId(targetProfile.id);
    this.isLoggedIn = true;
    this.isLocked = false;
    const overlay = document.getElementById('appLoginOverlay');
    if (overlay) overlay.classList.remove('active');
    const oldPin = document.getElementById('pinLockOverlay');
    if (oldPin) oldPin.classList.remove('active');
    this.refreshAll();
    this.checkNotificationUrlLaunch();
  }

  // --- Korumalı Hesap PIN Doğrulama ---
  openAccountPinPrompt(targetProfile, onSuccess) {
    const overlay = document.getElementById('accountPinOverlay');
    const title = document.getElementById('accPinPromptTitle');
    const desc = document.getElementById('accPinPromptDesc');
    const dots = document.querySelectorAll('#accPinDots .pin-dot');
    const keypad = document.getElementById('accPinKeypad');
    const errorMsg = document.getElementById('accPinErrorMsg');
    const btnCancel = document.getElementById('btnCancelAccPin');

    if (!overlay) return;

    title.textContent = `🔒 ${targetProfile.avatarEmoji || '🌸'} ${targetProfile.name}`;
    desc.textContent = `Bu hesaba giriş yapmak için 4 haneli PIN kodunuzu girin.`;
    errorMsg.textContent = '';
    let entered = '';

    const updateDots = () => {
      dots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < entered.length);
      });
    };
    updateDots();

    keypad.onclick = (e) => {
      const btn = e.target.closest('.pin-key-btn');
      if (!btn) return;
      const key = btn.dataset.key;

      if (key === 'C') {
        entered = '';
        updateDots();
        errorMsg.textContent = '';
      } else if (key === '←') {
        entered = entered.slice(0, -1);
        updateDots();
        errorMsg.textContent = '';
      } else if (entered.length < 4) {
        entered += key;
        updateDots();

        if (entered.length === 4) {
          setTimeout(() => {
            if (this.storage.checkProfilePin(targetProfile.id, entered)) {
              overlay.classList.remove('active');
              if (onSuccess) onSuccess();
            } else {
              errorMsg.textContent = 'Hatalı PIN kodu!';
              entered = '';
              updateDots();
            }
          }, 100);
        }
      }
    };

    btnCancel.onclick = () => {
      overlay.classList.remove('active');
    };

    overlay.classList.add('active');
  }

  // --- Navigasyon ve Olay Dinleyicileri ---
  initNavigation() {
    const navBtns = document.querySelectorAll('.bottom-nav-bar .nav-tab-btn');
    navBtns.forEach(btn => {
      btn.onclick = () => {
        const tab = btn.dataset.tab;
        this.switchTab(tab);

  switchTab(tab) {
    this.currentTab = tab;
    document.querySelectorAll('.bottom-nav-bar .nav-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    this.renderCurrentTab();

  // --- BİLDİRİM VE HATIRLATICI MERKEZİ İŞLEMLERİ ---
  updateHeaderNotificationBadge() {
    const badge = document.getElementById('headerNotificationBadge');
    if (!badge || !this.notifManager) return;
    const count = this.notifManager.getBadgeCount();
    if (count > 0) {
      badge.textContent = count > 9 ? '9+' : count;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }

  setupServiceWorkerMessages() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'NAVIGATE_TAB') {
          const tab = event.data.tab || 'home';
          this.switchTab(tab);
          if (event.data.openDay && tab === 'calendar') {
            setTimeout(() => {
              if (this.calendarComp) {
                this.calendarComp.goToDate(event.data.openDay);
                if (event.data.focus === 'mood') {
                  this.calendarComp.openDayModal(event.data.openDay, 'mood');
                }
              }
            }, 300);
          }
        }
      });
    }
  }

  checkNotificationUrlLaunch() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const tab = urlParams.get('tab');
      const openDay = urlParams.get('openDay');
      const focus = urlParams.get('focus');
      if (tab) {
        this.switchTab(tab);
        if (openDay && tab === 'calendar') {
          setTimeout(() => {
            if (this.calendarComp) {
              this.calendarComp.goToDate(openDay);
              if (focus === 'mood') {
                this.calendarComp.openDayModal(openDay, 'mood');
              }
            }
          }, 350);
        }
      }
    } catch (e) {}
  }

    const overlay = document.getElementById('notificationModalOverlay');
    if (!overlay) return;
    this.renderNotificationCenterContent();
    overlay.classList.add('active');
  }

          alert('Tarayıcı ayarlarından bildirimlere izin vermeniz gerekiyor.');
        }
        this.openNotificationDiagnosticsModal();
        this.updateHeaderNotificationBadge();
      };
    }

    const btnInstant = body.querySelector('#btnDiagInstantTest');
    if (btnInstant) {
      btnInstant.onclick = async () => {
        const res = await this.notifManager.sendTestNotification();
        alert(res.message);
        this.updateHeaderNotificationBadge();
      };
    }

    const btnDelayed = body.querySelector('#btnDiagDelayedTest');
    if (btnDelayed) {
      btnDelayed.onclick = async () => {
        const res = await this.notifManager.scheduleDelayedBackgroundTest(5);
        alert(res.message);
      };
    }

    const alerts = this.notifManager.getActiveTodayAlerts();

                <div class="notif-alert-icon" style="background: ${a.color ? a.color + '18' : 'rgba(244, 63, 94, 0.1)'}; color: ${a.color || 'var(--primary)'};">

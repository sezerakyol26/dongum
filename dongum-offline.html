                </div>
                <div class="notif-alert-content">
                  <div class="notif-alert-header">
                    <span class="notif-alert-badge" style="background: ${a.color ? a.color + '20' : 'rgba(244, 63, 94, 0.12)'}; color: ${a.color || 'var(--primary)'};">
                      ${a.badge}
                    </span>
                  </div>
                  <h4 class="notif-alert-title">${a.title}</h4>
                  <p class="notif-alert-desc">${a.description}</p>
                  <button type="button" class="notif-alert-action-btn" data-action="${a.actionType || 'navigate'}" data-tab="${a.actionTab || 'home'}">

              Temizle
            </button>
          ` : ''}

        ${history.length === 0 ? `

        ` : `
          <div class="notif-history-list">
            ${history.slice(0, 10).map(h => {
              const d = new Date(h.date);
              const timeStr = isNaN(d) ? '' : `${d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' })} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
              return `

        if (res.success) {
          alert('Bildirim izni başarıyla etkinleştirildi!');
        } else if (res.status === 'denied') {
          alert('Tarayıcınızda bildirim izni engellenmiş. Tarayıcı adres çubuğundaki kilit / ayar simgesinden bildirimlere izin verebilirsiniz.');
        }
        this.renderNotificationCenterContent();
        this.updateHeaderNotificationBadge();
      };
    }

    const btnTest = container.querySelector('#btnNotifCenterTest');
    if (btnTest) {
      btnTest.onclick = async () => {
        const res = await this.notifManager.sendTestNotification();
        alert(res.message);
        this.renderNotificationCenterContent();
      };
    }

    const btnDiag = container.querySelector('#btnNotifCenterDiagnostics');
    if (btnDiag) {
      btnDiag.onclick = () => {
        this.openNotificationDiagnosticsModal();
      };
    }

    const btnClear = container.querySelector('#btnClearNotifHistory');
    if (btnClear) {
      btnClear.onclick = () => {
        this.storage.clearInAppNotifications();
        this.renderNotificationCenterContent();
        this.updateHeaderNotificationBadge();
      };
    }

    // Eylem Butonları (Kartların içindeki butonlar)
    container.querySelectorAll('.notif-alert-action-btn').forEach(btn => {
      btn.onclick = () => {
        const action = btn.dataset.action;
        const targetTab = btn.dataset.tab;
        const overlay = document.getElementById('notificationModalOverlay');

        if (action === 'add_water_250') {
          const todayStr = CycleEngine.formatDateStr(new Date());
          const curWater = this.storage.getTodayWater(todayStr);
          this.storage.saveWaterIntake(todayStr, curWater + 250);
          this.notifManager.playWellnessChime();
          this.renderNotificationCenterContent();
          this.updateHeaderNotificationBadge();
          if (this.currentTab === 'fitness' || this.currentTab === 'home') {
            this.renderCurrentTab();
          }
        } else {
          if (overlay) overlay.classList.remove('active');
          if (targetTab) {
            this.switchTab(targetTab);
          }
        }
      };
    });

    const btnSettings = container.querySelector('#btnGoNotifSettings');
    if (btnSettings) {
      btnSettings.onclick = () => {
        const overlay = document.getElementById('notificationModalOverlay');
        if (overlay) overlay.classList.remove('active');
        this.switchTab('settings');
        setTimeout(() => {
          const box = document.getElementById('settingsNotificationBox');
          if (box) box.scrollIntoView({ behavior: 'smooth' });
        }, 150);
      };
    }
  }

  // --- Yeni Hesap Oluşturma Formu Bağlamaları ---
  bindCreateAccountFormEvents() {
    const emojiPicker = document.getElementById('newAccEmojiPicker');
    if (emojiPicker) {
      emojiPicker.onclick = (e) => {
        const btn = e.target.closest('.emoji-pick-btn');
        if (!btn) return;
        emojiPicker.querySelectorAll('.emoji-pick-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.newProfileDraft.avatarEmoji = btn.dataset.emoji;
      };
    }

    const colorPicker = document.getElementById('newAccColorPicker');
    if (colorPicker) {
      colorPicker.onclick = (e) => {
        const btn = e.target.closest('.color-pick-circle');
        if (!btn) return;
        colorPicker.querySelectorAll('.color-pick-circle').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.newProfileDraft.avatarColor = btn.dataset.color;
      };
    }

    const pinToggle = document.getElementById('newAccPinToggle');
    const pinWrap = document.getElementById('newAccPinInputWrap');
    if (pinToggle && pinWrap) {
      pinToggle.onchange = () => {
        pinWrap.style.display = pinToggle.checked ? 'block' : 'none';
      };
    }

    const btnSubmitCreate = document.getElementById('btnSubmitCreateAccount');
    if (btnSubmitCreate) {
      btnSubmitCreate.onclick = () => {
        const nameInput = document.getElementById('newAccNameInput');
        const roleSelect = document.getElementById('newAccRoleSelect');
        const pinInput = document.getElementById('newAccPinInput');
        const cycleInput = document.getElementById('newAccCycleLen');
        const periodInput = document.getElementById('newAccPeriodLen');

        const name = nameInput.value.trim();
        if (!name) {
          alert('Lütfen bir hesap adı girin!');
          return;
        }

        const isPin = pinToggle.checked;
        const pinVal = pinInput.value.trim();
        if (isPin && (pinVal.length !== 4 || !/^\d+$/.test(pinVal))) {
          alert('Lütfen geçerli 4 haneli sayısal bir PIN kodu girin!');
          return;
        }

        const newProfile = this.storage.createProfile({
          name: name,
          role: roleSelect.value,
          avatarEmoji: this.newProfileDraft.avatarEmoji,
          avatarColor: this.newProfileDraft.avatarColor,
          pin: isPin ? pinVal : null,
          pinEnabled: isPin,
          cycleLength: parseInt(cycleInput.value, 10) || 28,
          periodLength: parseInt(periodInput.value, 10) || 5
        });

        // Formu temizle
        nameInput.value = '';
        if (pinInput) pinInput.value = '';
        pinToggle.checked = false;
        pinWrap.style.display = 'none';

        const pOverlay = document.getElementById('profileModalOverlay');
        if (pOverlay) pOverlay.classList.remove('active');
        this.completeLogin(newProfile);
        alert(`🌸 "${newProfile.name}" hesabı oluşturuldu ve giriş yapıldı!`);
      };
    }

    // Tekil Hesap İçe Aktar
    const btnSubmitImport = document.getElementById('btnSubmitImportAccount');
    const importTextarea = document.getElementById('importSingleAccountTextarea');
    if (btnSubmitImport && importTextarea) {
      btnSubmitImport.onclick = () => {
        const raw = importTextarea.value.trim();
        if (!raw) {
          alert('Lütfen hesap kodunu yapıştırın!');
          return;
        }

        let jsonStr = raw;
        if (!raw.startsWith('{')) {
          try {
            jsonStr = decodeURIComponent(escape(atob(raw)));
          } catch (e) {
            // normal devam et
          }
        }

        const res = this.storage.importSingleProfile(jsonStr);
        if (res.success) {
          alert(`✅ "${res.profile.name}" hesabı başarıyla bu cihaza eklendi!`);
          importTextarea.value = '';
          document.getElementById('profileModalOverlay').classList.remove('active');
          this.refreshAll();
        } else {
          alert('Hesap içe aktarılamadı: ' + res.message);
        }
      };
    }
  }

  // --- Profil Sekmesi Değiştirici ---
  switchProfileTab(tabName) {
    document.querySelectorAll('.account-modal-tabs .account-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });

    document.getElementById('accountTabPaneList').style.display = tabName === 'list' ? 'block' : 'none';
    document.getElementById('accountTabPaneCreate').style.display = tabName === 'create' ? 'block' : 'none';
    document.getElementById('accountTabPaneImport').style.display = tabName === 'import' ? 'block' : 'none';

    if (tabName === 'list') {
      this.renderProfilesList();
    }
  }

  // --- Profil Listesini Render Et ---
  openProfileModal(tab = 'list') {
    const overlay = document.getElementById('profileModalOverlay');
    if (!overlay) return;
    this.switchProfileTab(tab);
    overlay.classList.add('active');
  }

  renderProfilesList() {
    const listWrap = document.getElementById('profilesListWrap');
    if (!listWrap) return;

    const profiles = this.storage.getProfiles();
    const activeId = this.storage.getActiveProfileId();

    listWrap.innerHTML = profiles.map(p => {
      const isActive = p.id === activeId;
      const hasPin = p.pinEnabled && p.pin;
      const roleObj = PROFILE_ROLES.find(r => r.id === p.role) || { name: 'Kişisel' };

      return `
        <div class="profile-card-item ${isActive ? 'active-profile' : ''}" data-id="${p.id}">
          <div class="profile-card-left" data-id="${p.id}">
            <div class="profile-card-avatar" style="background-color: ${p.avatarColor || '#f43f5e'};">
              ${p.avatarEmoji || '🌸'}
            </div>
            <div class="profile-card-details">
              <div class="profile-card-name-row">
                <strong>${p.name}</strong>
                ${hasPin ? `<span class="profile-lock-tag" title="PIN Korumalı">${Icons.lock}</span>` : ''}
              </div>
              <div class="profile-card-meta">
                <span class="profile-badge-role">${roleObj.name}</span>
                ${isActive ? `<span class="profile-badge-active">● Aktif Hesap</span>` : `<span>Dokun ve Geç</span>`}
              </div>
            </div>
          </div>
          <div class="profile-card-actions">
            <button type="button" class="btn-card-action btn-edit-account" data-id="${p.id}" title="Düzenle">
              ${Icons.edit}
            </button>
            <button type="button" class="btn-card-action btn-export-account" data-id="${p.id}" title="Bu Hesabı Aktar">
              ${Icons.share}
            </button>
            ${profiles.length > 1 ? `
              <button type="button" class="btn-card-action btn-del btn-del-account" data-id="${p.id}" title="Hesabı Sil">
                ${Icons.trash}
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');

    // Geçiş Yap Olayı
    listWrap.querySelectorAll('.profile-card-left').forEach(leftEl => {
      leftEl.onclick = () => {
        const id = leftEl.dataset.id;
        if (id === activeId) return;

        const targetP = profiles.find(p => p.id === id);
        if (targetP && targetP.pinEnabled && targetP.pin) {
          // PIN sor
          this.openAccountPinPrompt(targetP, () => {
            this.storage.switchProfile(id);
            document.getElementById('profileModalOverlay').classList.remove('active');
            this.refreshAll();
          });
        } else {
          this.storage.switchProfile(id);
          document.getElementById('profileModalOverlay').classList.remove('active');
          this.refreshAll();
        }
      };
    });

    // Düzenle Olayı
    listWrap.querySelectorAll('.btn-edit-account').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        this.openEditProfileModal(btn.dataset.id);
      };
    });

    // Tekil Hesap Aktar
    listWrap.querySelectorAll('.btn-export-account').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        this.exportSingleAccount(btn.dataset.id);
      };
    });

    // Silme Olayı
    listWrap.querySelectorAll('.btn-del-account').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const targetP = profiles.find(p => p.id === id);
        if (confirm(`"${targetP?.name}" hesabını ve bu hesaba ait tüm geçmiş kayıtları silmek istediğinize emin misiniz?`)) {
          this.storage.deleteProfile(id);
          this.renderProfilesList();
          this.refreshAll();
        }
      };
    });
  }

  // --- Tekil Hesap Düzenleme Modalı ---
  openEditProfileModal(profileId) {
    const profile = this.storage.getProfileById(profileId);
    if (!profile) return;

    const overlay = document.getElementById('editProfileModalOverlay');
    const container = document.getElementById('editProfileFormContainer');
    if (!overlay || !container) return;

    let selectedEmoji = profile.avatarEmoji || '🌸';
    let selectedColor = profile.avatarColor || '#f43f5e';

    container.innerHTML = `
      <div class="form-group-block">
        <label class="picker-label">Hesap Adı:</label>
        <input type="text" id="editAccNameInput" value="${profile.name}" class="form-input">
      </div>

      <div class="form-group-block">
        <label class="picker-label">Hesap Rolü:</label>
        <select id="editAccRoleSelect" class="form-input">
          ${PROFILE_ROLES.map(r => `
            <option value="${r.id}" ${r.id === profile.role ? 'selected' : ''}>${r.name}</option>
          `).join('')}
        </select>
      </div>

      <div class="form-group-block">
        <label class="picker-label">Profil Simgesi (Emoji):</label>
        <div class="emoji-picker-grid" id="editAccEmojiPicker">
          ${PROFILE_EMOJIS.map(em => `
            <button type="button" class="emoji-pick-btn ${em === selectedEmoji ? 'selected' : ''}" data-emoji="${em}">${em}</button>
          `).join('')}
        </div>
      </div>

      <div class="form-group-block">
        <label class="picker-label">Renk:</label>
        <div class="color-picker-grid" id="editAccColorPicker">
          ${PROFILE_COLORS.map(col => `
            <button type="button" class="color-pick-circle ${col === selectedColor ? 'selected' : ''}" data-color="${col}" style="background-color: ${col};"></button>
          `).join('')}
        </div>
      </div>

      <div class="form-group-block" style="border: 1px dashed var(--border-subtle); padding: 12px; border-radius: var(--radius-sm);">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer;">
          <input type="checkbox" id="editAccPinToggle" ${profile.pinEnabled ? 'checked' : ''}>
          <span>🔒 PIN Şifre Koruması</span>
        </label>
        <div id="editAccPinWrap" style="display: ${profile.pinEnabled ? 'block' : 'none'}; margin-top: 8px;">
          <input type="password" id="editAccPinInput" value="${profile.pin || ''}" maxlength="4" placeholder="4 Haneli Sayısal PIN" class="form-input pin-input-field">
        </div>
      </div>

      <button type="button" class="btn-primary-action" id="btnSaveEditAccount" style="margin-top: 10px;">
        ${Icons.check} Değişiklikleri Kaydet
      </button>
    `;

    // Emoji ve Renk seçici
    const emPicker = container.querySelector('#editAccEmojiPicker');
    emPicker.onclick = (e) => {
      const btn = e.target.closest('.emoji-pick-btn');
      if (!btn) return;
      emPicker.querySelectorAll('.emoji-pick-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = btn.dataset.emoji;
    };

    const colPicker = container.querySelector('#editAccColorPicker');
    colPicker.onclick = (e) => {
      const btn = e.target.closest('.color-pick-circle');
      if (!btn) return;
      colPicker.querySelectorAll('.color-pick-circle').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = btn.dataset.color;
    };

    const pinTog = container.querySelector('#editAccPinToggle');
    const pinW = container.querySelector('#editAccPinWrap');
    pinTog.onchange = () => {
      pinW.style.display = pinTog.checked ? 'block' : 'none';
    };

    // Kaydet
    container.querySelector('#btnSaveEditAccount').onclick = () => {
      const newName = container.querySelector('#editAccNameInput').value.trim();
      const newRole = container.querySelector('#editAccRoleSelect').value;
      const isPin = pinTog.checked;
      const pinVal = container.querySelector('#editAccPinInput').value.trim();

      if (!newName) {
        alert('Lütfen bir ad girin!');
        return;
      }
      if (isPin && (pinVal.length !== 4 || !/^\d+$/.test(pinVal))) {
        alert('Lütfen geçerli 4 haneli bir PIN kodu girin!');
        return;
      }

      this.storage.updateProfile(profileId, {
        name: newName,
        role: newRole,
        avatarEmoji: selectedEmoji,
        avatarColor: selectedColor,
        pin: isPin ? pinVal : null,
        pinEnabled: isPin
      });

      overlay.classList.remove('active');
      this.renderProfilesList();
      this.refreshAll();
      alert('Hesap bilgileri başarıyla güncellendi!');
    };

    overlay.classList.add('active');
  }

  // --- Tekil Hesap Dışa Aktar ---
  exportSingleAccount(profileId) {
    const profile = this.storage.getProfileById(profileId);
    if (!profile) return;

    const payload = this.storage.exportSingleProfile(profileId);
    let token = payload;
    try {
      token = btoa(unescape(encodeURIComponent(payload)));
    } catch (e) {
      // fallback
    }

    if (navigator.clipboard) {
      navigator.clipboard.writeText(token).then(() => {
        alert(`📋 "${profile.name}" hesabının aktarım kodu panoya kopyalandı!\n\nDiğer telefonda "Hesabı İçe Aktar" sekmesine yapıştırabilirsiniz.`);
      }).catch(() => {
        prompt('Aşağıdaki kodu kopyalayıp diğer telefona yapıştırın:', token);
      });
    } else {
      prompt('Aşağıdaki kodu kopyalayıp diğer telefona yapıştırın:', token);
    }
  }

  // --- Çevrimdışı & Kurulum Rehberi ---
  openOfflineGuideModal() {
    const overlay = document.getElementById('offlineGuideModalOverlay');
    if (overlay) overlay.classList.add('active');
  }

  triggerPwaInstall() {
    if (window.deferredInstallPrompt) {
      window.deferredInstallPrompt.prompt();
      window.deferredInstallPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Kullanıcı PWA kurulumunu onayladı.');
        }
        window.deferredInstallPrompt = null;
      });
    } else {
      alert('Tarayıcınızın menüsünden (iOS Safari: Paylaş > Ana Ekrana Ekle, Android: Üç Nokta > Uygulamayı Yükle) uygulayabilirsiniz.');
    }
  }

  // --- Sunucusuz Tek Dosya HTML İndirme ---
  downloadStandaloneHtml() {
    fetch('./dongum-offline.html')
      .then(res => {
        if (!res.ok) throw new Error('Dosya okunamadı');
        return res.blob();
      })
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dongum-offline.html';
        a.click();
        URL.revokeObjectURL(url);
        alert('📦 Sunucusuz tek dosya (dongum-offline.html) başarıyla indirildi!\n\nBu dosyayı WhatsApp, AirDrop, Bluetooth veya e-posta ile dilediğiniz telefona gönderebilir ve hiçbir sunucuya ihtiyaç duymadan doğrudan açabilirsiniz.');
      })
      .catch(() => {
        const a = document.createElement('a');
        a.href = './dongum-offline.html';
        a.download = 'dongum-offline.html';
        a.target = '_blank';
        a.click();
      });
  }

  // --- Sekme Render Yöneticisi ---
  renderCurrentTab() {
    const main = document.getElementById('mainContent');
    if (!main) return;

    // Başlıktaki aktif profil bilgilerini güncelle
    const activeProfile = this.storage.getActiveProfile();
    const tagEmoji = document.getElementById('headerChipEmoji');
    const tagName = document.getElementById('headerChipName');
    if (tagEmoji) tagEmoji.textContent = activeProfile.avatarEmoji || '🌸';
    if (tagName) tagName.textContent = activeProfile.name;

    if (this.currentTab === 'home') {
      this.renderHomeTab(main);
    } else if (this.currentTab === 'calendar') {
      this.renderCalendarTab(main);
    } else if (this.currentTab === 'fitness') {
      this.renderFitnessTab(main);
    } else if (this.currentTab === 'analytics') {
      this.renderAnalyticsTab(main);
    } else if (this.currentTab === 'settings') {
      this.renderSettingsTab(main);
    }
  }

  // ================= 1. GÜNÜM (ÇOK RENKLİ DÖNGÜ ÇARKI VE GÜNLÜK DURUM) =================
  renderHomeTab(container) {
    const summary = this.engine.getTodaySummary();
    const todayStatus = summary.dayStatus;
    const stats = summary.stats;
    const isPeriodToday = todayStatus.phase === 'period';

    // Döngü parametreleri ve gün aralıkları
    const cycleTotal = Math.max(21, stats.averageCycleLength || 28);
    // İçinde bulunulan dönemde regl süresi (Erken bittiyse son dönemin gerçek süresi, yoksa ortalama)
    const activePeriodLength = (stats.lastPeriod && stats.lastPeriod.duration)
      ? Math.max(2, stats.lastPeriod.duration)
      : Math.max(2, stats.averagePeriodLength || 5);
    const lutealDays = stats.lutealLength || 14;
    const currentDay = Math.min(cycleTotal, Math.max(1, summary.cycleDayNumber));

    // Biyolojik faz gün aralıkları (Yeni döngü döneminin gerçek regl süresine göre modellenir)
    const ovulationDay = Math.max(activePeriodLength + 3, cycleTotal - lutealDays + 1);
    const fertileStart = Math.max(activePeriodLength + 1, ovulationDay - 4);
    const fertileEnd = Math.min(cycleTotal - 1, ovulationDay + 1);
    const follicularStart = activePeriodLength + 1;
    const follicularEnd = Math.max(follicularStart, fertileStart - 1);
    const lutealStart = fertileEnd + 1;
    const lutealEnd = cycleTotal;

    // SVG Çok Renkli Halka Yayları Hesabı (Center: 140, 140, R: 105, Stroke: 16)
    const CX = 140;
    const CY = 140;
    const R = 105;

    const makeArcPath = (startDay, endDay) => {
      if (startDay > endDay) return '';
      const startAngle = ((startDay - 1) / cycleTotal) * 360 - 90;
      const endAngle = (endDay / cycleTotal) * 360 - 90;
      const gap = 1.0;
      const r1 = (startAngle + gap) * (Math.PI / 180);
      const r2 = (endAngle - gap) * (Math.PI / 180);
      const x1 = CX + R * Math.cos(r1);
      const y1 = CY + R * Math.sin(r1);
      const x2 = CX + R * Math.cos(r2);
      const y2 = CY + R * Math.sin(r2);
      const sweepAngle = (endAngle - gap) - (startAngle + gap);
      const largeArc = sweepAngle > 180 ? 1 : 0;
      return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
    };

    // 4 Belirgin Renk
    const colorRegl = '#e11d48';
    const colorFolikuler = '#0d9488';
    const colorOvulasyon = '#f59e0b';
    const colorLuteal = '#c084fc';

    const pathRegl = makeArcPath(1, activePeriodLength);
    const pathFolikuler = makeArcPath(follicularStart, follicularEnd);
    const pathOvulasyon = makeArcPath(fertileStart, fertileEnd);
    const pathLuteal = makeArcPath(lutealStart, lutealEnd);

    // Güncel gün işaretçi boncuğu
    const dayAngle = ((currentDay - 0.5) / cycleTotal) * 360 - 90;
    const dayRad = dayAngle * (Math.PI / 180);
    const bx = (CX + R * Math.cos(dayRad)).toFixed(2);
    const by = (CY + R * Math.sin(dayRad)).toFixed(2);

    // Güncel faz başlığı, rengi ve hap etiketi
    let phaseTitle = 'Normal Evre';
    let fertilityPillText = 'Düşük Doğurganlık';
    let pillClass = 'pill-luteal';
    let beadColor = colorLuteal;

    if (isPeriodToday) {
      phaseTitle = 'Regl Dönemi';
      fertilityPillText = 'Çok Düşük İhtimal';
      pillClass = 'pill-regl';
      beadColor = colorRegl;
    } else if (currentDay >= follicularStart && currentDay <= follicularEnd) {
      phaseTitle = 'Foliküler Faz';
      fertilityPillText = 'Düşük Hamilelik Şansı';
      pillClass = 'pill-folikuler';
      beadColor = colorFolikuler;
    } else if (currentDay >= fertileStart && currentDay <= fertileEnd) {
      if (currentDay === ovulationDay) {
        phaseTitle = 'Yumurtlama Günü';
        fertilityPillText = 'Zirve Doğurganlık';
      } else {
        phaseTitle = 'Doğurgan Pencere';
        fertilityPillText = 'Yüksek Doğurganlık';
      }
      pillClass = 'pill-ovulasyon';
      beadColor = colorRegl;
    } else {
      phaseTitle = (summary.daysUntilNext !== null && summary.daysUntilNext <= 6) ? 'PMS / Luteal Evre' : 'Luteal Evre';
      fertilityPillText = 'Düşük Doğurganlık';
      pillClass = 'pill-luteal';
      beadColor = colorLuteal;
    }

    // Kalan gün metni
    let countdownText = '14 gün';
    if (summary.daysUntilNext !== null) {
      if (summary.daysUntilNext > 0) countdownText = `${summary.daysUntilNext} gün`;
      else if (summary.daysUntilNext === 0) countdownText = 'bugün';
      else countdownText = `${Math.abs(summary.daysUntilNext)} gün gecikme`;
    }

    // Güncel aktif faz anahtarı (Faz rehberinde varsayılan açılacak evre)
    let activePhaseKey = 'follicular';
    if (isPeriodToday) {
      activePhaseKey = 'period';
    } else if (currentDay >= follicularStart && currentDay <= follicularEnd) {
      activePhaseKey = 'follicular';
    } else if (currentDay >= fertileStart && currentDay <= fertileEnd) {
      activePhaseKey = 'ovulation';
    } else {
      activePhaseKey = 'luteal';
    }

    // Kişisel gün aralıkları haritası
    const dynamicRanges = {
      period: `1 - ${activePeriodLength}. Gün`,
      follicular: `${follicularStart} - ${follicularEnd}. Gün`,
      ovulation: `${fertileStart} - ${fertileEnd}. Gün (${ovulationDay}. Gün Zirve)`,
      luteal: `${lutealStart} - ${cycleTotal}. Gün`
    };

    // Günlük su ve egzersiz durumu
    const todayWater = this.storage.getWaterForDay(summary.todayStr);
    const userSettings = this.storage.getProfileData().settings || {};
    const waterTarget = userSettings.waterTarget || 2250;
    const waterPercent = Math.min(150, Math.round((todayWater / waterTarget) * 100));
    const todayExercise = this.storage.getExerciseForDay(summary.todayStr);
    const streakInfo = this.storage.getExerciseStreak();
    const phaseFitness = (typeof CYCLE_FITNESS_GUIDANCE !== 'undefined' && CYCLE_FITNESS_GUIDANCE[activePhaseKey]) ? CYCLE_FITNESS_GUIDANCE[activePhaseKey] : null;
    const phaseWater = (typeof WATER_CYCLE_BENEFITS !== 'undefined' && WATER_CYCLE_BENEFITS[activePhaseKey]) ? WATER_CYCLE_BENEFITS[activePhaseKey] : null;

    container.innerHTML = `
      <div class="home-view-wrapper">
        
        <!-- Çevrimdışı Durum ve Mobil Eşleme Kapsülü -->
        <div class="home-status-capsule-row">
          <div class="offline-status-capsule" id="btnHomeOfflineBar" role="button" tabindex="0" title="Tüm verileriniz yalnızca telefonunuzda saklanır ve %100 internetsiz çalışır. Rehber ve kurulum için dokunun.">
            <span class="capsule-pulse-indicator">
              <span class="capsule-pulse-core"></span>
              <span class="capsule-pulse-wave"></span>
            </span>
            <span class="capsule-label">Çevrimdışı Hazır</span>
            <span class="capsule-badge">Cihazda Güvende</span>
            <span class="capsule-info-icon" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            </span>
          </div>

          <button type="button" class="btn-capsule-sync" id="btnOpenSyncModal" title="Farklı telefona aktar veya veri eşle">
            ${Icons.refresh}
            <span>Eşleme</span>
          </button>
        </div>

        <!-- Çok Renkli Segmentli Döngü Çarkı (Cycle Dial) -->
        <div class="cycle-dial-container-segmented">
          <svg class="cycle-svg-segmented" viewBox="0 0 280 280">
            <defs>
              <filter id="beadShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.22)" />
              </filter>
            </defs>

            <!-- Arka plan ince kılavuz halkası -->
            <circle cx="140" cy="140" r="105" fill="none" stroke="rgba(226, 232, 240, 0.6)" stroke-width="15" />

            <!-- 1. Regl Yayı -->
            ${pathRegl ? `<path d="${pathRegl}" fill="none" stroke="${colorRegl}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- 2. Foliküler Yayı -->
            ${pathFolikuler ? `<path d="${pathFolikuler}" fill="none" stroke="${colorFolikuler}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- 3. Ovulasyon / Doğurgan Pencere Yayı -->
            ${pathOvulasyon ? `<path d="${pathOvulasyon}" fill="none" stroke="${colorOvulasyon}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- 4. Luteal Yayı -->
            ${pathLuteal ? `<path d="${pathLuteal}" fill="none" stroke="${colorLuteal}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- Güncel Gün İşaretçi Boncuğu (Bead Pointer) -->
            <circle cx="${bx}" cy="${by}" r="14" fill="#ffffff" stroke="${beadColor}" stroke-width="3.5" filter="url(#beadShadow)" />
            <circle cx="${bx}" cy="${by}" r="6.5" fill="${beadColor}" />
          </svg>

          <!-- Çark İçi Metinler -->
          <div class="dial-center-box">
            <span class="dial-sub-title">DÖNGÜ GÜNÜ</span>
            <div class="dial-big-day">
              <span class="day-val">${currentDay}</span><span class="day-total">/${cycleTotal}</span>
            </div>
            <div class="dial-phase-text">${phaseTitle}</div>
            <div class="dial-fertility-pill ${pillClass}">
              ${fertilityPillText}
            </div>
            <div class="dial-countdown-text">
              Sonraki regle <strong>${countdownText}</strong>
            </div>
          </div>
        </div>

        <!-- Çark Altı Evre Açıklamaları (Legend) -->
        <div class="dial-legend-row">
          <div class="legend-pill-item" data-phase="period" title="Regl fazı rehberini göster">
            <span class="legend-circle" style="background-color: ${colorRegl};"></span>
            <span>Regl (1-${activePeriodLength})</span>
          </div>
          <div class="legend-pill-item" data-phase="follicular" title="Foliküler faz rehberini göster">
            <span class="legend-circle" style="background-color: ${colorFolikuler};"></span>
            <span>Foliküler (${follicularStart}-${follicularEnd})</span>
          </div>
          <div class="legend-pill-item" data-phase="ovulation" title="Ovülasyon faz rehberini göster">
            <span class="legend-circle" style="background-color: ${colorOvulasyon};"></span>
            <span>Ovulasyon (${ovulationDay})</span>
          </div>
          <div class="legend-pill-item" data-phase="luteal" title="Luteal faz rehberini göster">
            <span class="legend-circle" style="background-color: ${colorLuteal};"></span>
            <span>Luteal (${lutealStart}-${lutealEnd})</span>
          </div>
        </div>

        <!-- Hızlı Aksiyon Kartı (Bugün Regl Başlat / Bitir) -->
        <div class="quick-action-card">
          <div class="qa-text">
            <h4>${isPeriodToday ? 'Bugün Regl Kaydedildi' : 'Bugün Regl Oldun mu?'}</h4>
            <p>${isPeriodToday ? 'Kanama kaydını kapatabilir veya akışı düzenleyebilirsiniz.' : 'Tek dokunuşla kaydet ve tahminleri yenile.'}</p>
          </div>
          <button type="button" class="btn-quick-period ${isPeriodToday ? 'btn-active-period' : ''}" id="btnHomeQuickPeriod">
            ${isPeriodToday ? 'Regl Bitti' : '🩸 Regl Başladı'}
          </button>
        </div>

        <!-- Günlük Sağlık ve Hamilelik Olasılığı Kartı -->
        <div class="daily-insight-card">
          <div class="insight-row">
            <div class="insight-item">
              <span class="ins-title">Hamilelik Şansı</span>
              <strong class="ins-val" style="color: ${beadColor};">${todayStatus.pregnancyChance}</strong>
            </div>
            <div class="insight-divider"></div>
            <div class="insight-item">
              <span class="ins-title">Döngü Ritim Skoru</span>
              <strong class="ins-val" style="color: #10b981;">%${stats.regularityScore} Düzenli</strong>
            </div>
          </div>
          <p class="insight-advice">
            ${this.getPhaseAdvice(todayStatus.phase)}
          </p>
        </div>

        <!-- Döngü Fazları & Beden Rehberi Kartı (Bilgilendirici ve Yönlendirici) -->
        <div class="phases-guide-card" id="homePhasesGuideCard">
          <div class="pgh-header">
            <div class="pgh-title-group">
              <span class="pgh-main-icon">🌸</span>
              <div>
                <h4 class="pgh-title">Döngü Fazları & Beden Rehberi</h4>
                <p class="pgh-desc">Her evrede hormonlar, enerji ve yönlendirici tavsiyeler</p>
              </div>
            </div>
          </div>

          <!-- 4 Faz Seçim Sekmeleri -->
          <div class="phases-tab-nav" id="phasesTabNav">
            ${Object.values(CYCLE_PHASES_DATA).map(p => {
              const isCurrent = (p.id === activePhaseKey);
              return `
                <button type="button" class="phase-nav-pill ${isCurrent ? 'active-pill' : ''}" data-phase="${p.id}" style="--p-col: ${p.color};">
                  <span class="p-icon">${p.icon}</span>
                  <span class="p-title">${p.name.split(' ')[0]}</span>
                  ${isCurrent ? `<span class="p-current-tag">Bugün</span>` : ''}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Seçili Faz İçerik Kartı -->
          <div class="phase-info-display" id="phaseInfoDisplay">
            ${this.renderPhaseDetailHtml(activePhaseKey, dynamicRanges[activePhaseKey], true)}
          </div>
        </div>

        <!-- 1. GÜNLÜK SU İÇME TAKİP KARTI (Home Hydration Widget) -->
        <div class="home-widget-card home-water-card">
          <div class="hwc-header">
            <div class="hwc-title-group">
              <span class="hwc-icon" style="color: #0284c7;">💧</span>
              <div>
                <h4 class="hwc-title">Günlük Su Takibi</h4>
                <p class="hwc-sub">${todayWater} / ${waterTarget} ml (%${waterPercent} tamamlandı)</p>
              </div>
            </div>
            <button type="button" class="hwc-more-btn" id="btnHomeGoWaterCenter" title="Tüm Su Takip Merkezini Aç">
              Detay →
            </button>
          </div>

          <div class="home-water-bar-wrap">
            <div class="home-water-bar-fill" style="width: ${Math.min(100, waterPercent)}%;"></div>
          </div>

          ${phaseWater ? `
            <p class="hwc-tip-text">
              <strong>${phaseWater.icon} ${phaseWater.title}:</strong> ${phaseWater.desc}
            </p>
          ` : ''}

          <div class="home-water-actions">
            <button type="button" class="btn-home-water-add" data-delta="250" id="btnHomeWaterAdd250">
              +250 ml (Bardak)
            </button>
            <button type="button" class="btn-home-water-add" data-delta="500" id="btnHomeWaterAdd500">
              +500 ml (Şişe)
            </button>
            <button type="button" class="btn-home-water-undo" id="btnHomeWaterUndo" title="Son 250 ml'yi geri al">
              -250 ml
            </button>
          </div>
        </div>

        <!-- 2. DÖNGÜ & EGZERSİZ TAKİP KARTI (Home Fitness Widget) -->
        <div class="home-widget-card home-fitness-card">
          <div class="hwc-header">
            <div class="hwc-title-group">
              <span class="hwc-icon" style="color: #10b981;">🏃‍♀️</span>
              <div>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <h4 class="hwc-title">Döngü & Egzersiz</h4>
                  <span class="hwc-streak-badge">${Icons.flame} ${streakInfo.currentStreak} Gün Seri</span>
                </div>
                <p class="hwc-sub">
                  ${todayExercise 
                    ? `Bugün: ${todayExercise.typeName} • ${todayExercise.duration} dk (${todayExercise.feelName || 'İyi'})` 
                    : (phaseFitness ? `Öneri: ${phaseFitness.recommended.slice(0, 2).join(', ')}` : 'Günün hareketini kaydet')}
                </p>
              </div>
            </div>
            <button type="button" class="hwc-more-btn" id="btnHomeGoFitness" title="Egzersiz & Su Merkezine Git">
              ${todayExercise ? 'İncele →' : '+ Ekle'}

          ${todayExercise ? `
            <div class="hwc-logged-badge">
              <span>🌸 <strong>Döngüye Katkısı:</strong> ${todayExercise.cycleBenefit || 'Kasları rahatlatır ve hormonları dengeler.'}</span>
            </div>
          ` : (phaseFitness ? `
            <div class="hwc-quote-box">
              <p>"${phaseFitness.motivationQuote}"</p>
            </div>
          ` : '')}
        </div>

        <!-- Hızlı Gün İnceleme & Semptom Ekleme Butonu -->
        <div class="home-bottom-actions">
          <button type="button" class="btn-log-symptoms" id="btnHomeLogToday">
            ${Icons.sparkles} Bugünün Semptom & Ruh Halini Ekle
          </button>
        </div>

        <!-- Cihazlar Arası Eşleme Modalı -->
        <div class="modal-overlay" id="syncModalOverlay">
          <div class="modal-sheet sync-modal-sheet">
            <div class="modal-header-row">
              <h3>📱 Cihazlar Arası Eşleme & Senkronizasyon</h3>
              <button type="button" class="modal-close-btn" id="btnCloseSyncModal">${Icons.close}</button>
            </div>
            <p class="sheet-desc">
              Uygulamanız %100 çevrimdışı çalışır. Tüm profillerinizi ve verilerinizi başka bir telefona aktarmak veya aynı anda birden fazla telefonda kullanmak için aşağıdaki eşleme kodunu kullanabilirsiniz.
            </p>

            <div class="sync-code-box">
              <label class="section-label">📋 Bu Cihazın Eşleme Kodu</label>
              <textarea readonly class="form-input sync-textarea" id="syncCodeOutput"></textarea>
              <button type="button" class="btn-primary-action" id="btnCopySyncCode">
                ${Icons.check} Kodu Kopyala
              </button>

            <div class="sync-import-box" style="margin-top: 18px;">

      </div>
    `;

    // Buton Olayları
    const quickPeriodBtn = container.querySelector('#btnHomeQuickPeriod');

    const btnHomeInstall = container.querySelector('#btnHomeInstallModal');
    const btnOpenSync = container.querySelector('#btnOpenSyncModal');
    const btnCloseSync = container.querySelector('#btnCloseSyncModal');
    const syncOverlay = container.querySelector('#syncModalOverlay');
    const syncOutput = container.querySelector('#syncCodeOutput');
    const btnCopySync = container.querySelector('#btnCopySyncCode');
    const syncInput = container.querySelector('#syncCodeInput');
    const btnApplySync = container.querySelector('#btnApplySyncCode');

    // Faz Rehberi Butonları Dinleyicisi
    const phaseNav = container.querySelector('#phasesTabNav');
    const phaseDisplay = container.querySelector('#phaseInfoDisplay');
    if (phaseNav && phaseDisplay) {
      phaseNav.querySelectorAll('.phase-nav-pill').forEach(pill => {
        pill.onclick = () => {
          phaseNav.querySelectorAll('.phase-nav-pill').forEach(p => p.classList.remove('active-pill'));
          pill.classList.add('active-pill');
          const targetKey = pill.dataset.phase;
          const isTodayPhase = (targetKey === activePhaseKey);
          phaseDisplay.innerHTML = this.renderPhaseDetailHtml(targetKey, dynamicRanges[targetKey], isTodayPhase);
        };
      });
    }

    // Çark altındaki legend etiketlerine tıklandığında da ilgili faza atla
    const legendRow = container.querySelector('.dial-legend-row');
    const guideCard = container.querySelector('#homePhasesGuideCard');
    if (legendRow && phaseNav) {
      legendRow.querySelectorAll('.legend-pill-item').forEach(lp => {
        lp.style.cursor = 'pointer';
        lp.onclick = () => {
          const targetKey = lp.dataset.phase;
          const pillBtn = phaseNav.querySelector(`[data-phase="${targetKey}"]`);
          if (pillBtn) {
            pillBtn.click();
            if (guideCard) {
              guideCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
          }
        };
      });
    }

    if (btnOfflineBar) btnOfflineBar.onclick = () => this.openOfflineGuideModal();
    if (btnHomeInstall) btnHomeInstall.onclick = () => this.openOfflineGuideModal();

    if (quickPeriodBtn) {
      quickPeriodBtn.onclick = () => {
        if (isPeriodToday) {
          this.engine.togglePeriodDay(summary.todayStr, false);
        } else {
          this.engine.logPeriodStart(summary.todayStr, 'medium');
        }
        this.refreshAll();
      };
    }

    if (logTodayBtn) {
      logTodayBtn.onclick = () => {
        this.switchTab('calendar');
        setTimeout(() => {
          if (this.calendarComp) {
            this.calendarComp.goToDate(summary.todayStr);
          }
        }, 100);
      };
    }

    // Ana Ekran Su Ekleme Butonları
    const btnWaterAdd250 = container.querySelector('#btnHomeWaterAdd250');
    const btnWaterAdd500 = container.querySelector('#btnHomeWaterAdd500');
    const btnWaterUndo = container.querySelector('#btnHomeWaterUndo');
    const btnGoWaterCenter = container.querySelector('#btnHomeGoWaterCenter');
    const btnGoFitness = container.querySelector('#btnHomeGoFitness');

    if (btnWaterAdd250) {
      btnWaterAdd250.onclick = () => {
        this.storage.logWater(summary.todayStr, 250);
        this.renderHomeTab(container);
      };
    }
    if (btnWaterAdd500) {
      btnWaterAdd500.onclick = () => {
        this.storage.logWater(summary.todayStr, 500);
        this.renderHomeTab(container);
      };
    }
    if (btnWaterUndo) {
      btnWaterUndo.onclick = () => {
        this.storage.logWater(summary.todayStr, -250);
        this.renderHomeTab(container);
      };
    }
    if (btnGoWaterCenter) {
      btnGoWaterCenter.onclick = () => {
        this.switchTab('fitness');
        setTimeout(() => {
          if (this.fitnessComp) {
            this.fitnessComp.activeSubTab = 'water';
            this.fitnessComp.render();
          }
        }, 50);
      };
    }
    if (btnGoFitness) {
      btnGoFitness.onclick = () => {
        this.switchTab('fitness');
        setTimeout(() => {
          if (this.fitnessComp) {
            this.fitnessComp.activeSubTab = 'exercise';
            this.fitnessComp.render();
          }
        }, 50);
      };
    }

    // Eşleme Modalı Aç/Kapat
    if (btnOpenSync && syncOverlay) {
      btnOpenSync.onclick = () => {
        const fullBackup = this.storage.exportBackup();
        try {
          const encoded = btoa(unescape(encodeURIComponent(fullBackup)));
          syncOutput.value = encoded;
        } catch (e) {
          syncOutput.value = fullBackup;
        }
        syncOverlay.classList.add('active');
      };
    }

    if (btnCloseSync && syncOverlay) {
      btnCloseSync.onclick = () => syncOverlay.classList.remove('active');
      syncOverlay.onclick = (e) => {
        if (e.target === syncOverlay) syncOverlay.classList.remove('active');
      };
    }

    if (btnCopySync && syncOutput) {
      btnCopySync.onclick = () => {
        syncOutput.select();
        navigator.clipboard.writeText(syncOutput.value).then(() => {
          alert('Eşleme kodu panoya kopyalandı! Diğer telefonunuza mesaj veya WhatsApp ile gönderebilirsiniz.');
        }).catch(() => {
          alert('Lütfen kutudaki metni seçip kopyalayın.');
        });
      };
    }

    if (btnApplySync && syncInput) {
      btnApplySync.onclick = () => {
        const raw = syncInput.value.trim();
        if (!raw) {
          alert('Lütfen geçerli bir eşleme kodu yapıştırın!');
          return;
        }
        try {
          let jsonStr = raw;
          if (!raw.startsWith('{')) {
            jsonStr = decodeURIComponent(escape(atob(raw)));
          }
          const res = this.storage.importBackup(jsonStr);
          if (res.success) {
            alert('Tüm verileriniz ve döngü geçmişiniz bu telefona başarıyla aktarıldı!');
            syncOverlay.classList.remove('active');
            this.refreshAll();
          } else {
            alert('Eşleme kodu çözülemedi: ' + res.message);
          }
        } catch (err) {
          alert('Geçersiz eşleme kodu formatı!');
        }
      };
    }
  }

  getPhaseAdvice(phase) {
    switch (phase) {
      case 'period':
        return '🩸 Menstrüasyon evresindesiniz. Sıcak su torbası, magnezyum ağırlıklı beslenme ve hafif yürüyüşler krampları hafifletir.';
      case 'follicular':
        return '🌱 Foliküler fazdasınız. Östrojen yükselirken enerjiniz ve odaklanma gücünüz zirveye tırmanıyor.';
      case 'fertile':
      case 'ovulation':
        return '🌸 Doğurganlık penceresindesiniz. Enerjiniz ve sosyalleşme isteğiniz yüksek, vücut sıcaklığınız hafif yükselebilir.';
      case 'pms':
        return '🌙 Luteal / PMS dönemi. Progesteron etkisiyle dinlenmeye, bol su tüketmeye ve sakin aktivitelere öncelik verin.';
      default:
        return '✨ Hormonal dengeniz sağlıklı seyrinde. Düzenli uyku ve dengeli su tüketimi döngünüzü destekler.';
    }
  }

  getMappedPhaseKey(phase) {
    if (phase === 'period' || phase === 'predicted_period') return 'period';
    if (phase === 'ovulation' || phase === 'fertile') return 'ovulation';
    if (phase === 'pms' || phase === 'luteal') return 'luteal';
    return 'follicular';

              <strong style="font-size: 0.82rem; color: var(--text-main);">Uygulamaya Girmeden Bildirim Alma Rehberi</strong>
            </div>
            <p style="font-size: 0.73rem; color: var(--text-secondary); line-height: 1.45; margin: 0 0 8px 0;">
              Döngüm %100 gizlilik odaklı olup verilerinizi hiçbir bulut sunucuya aktarmaz; tüm hatırlatıcılar telefonunuzun kendi <strong>Service Worker</strong> ve <strong>Arka Plan Senkronizasyonu</strong> ile üretilir.
            </p>
            <ul style="font-size: 0.72rem; color: var(--text-secondary); margin: 0; padding-left: 18px; line-height: 1.45;">
              <li><strong>Android (Chrome):</strong> Uygulamayı <em>"Ana Ekrana Ekle"</em> yapın. Telefonunuzun <em>Ayarlar ➔ Uygulamalar ➔ Chrome/Döngüm ➔ Pil</em> ayarından <strong>"Kısıtlanmamış"</strong> seçin; böylece Android pil tasarrufu için su ve ruh hali bildirimlerinizi uyutmaz.</li>
              <li><strong>iPhone (iOS Safari):</strong> Safari menüsünden <em>Paylaş ➔ "Ana Ekrana Ekle"</em> yaparak tam ekran PWA olarak kullanın.</li>
              <li>Uygulama arka planda açık kaldığında hatırlatıcılar 60 saniyelik Web Worker döngüsüyle tam vaktinde çalar.</li>
            </ul>
          </div>
        </div>

        <!-- Güvenlik & 4 Haneli PIN Kodu -->
        <div class="settings-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #10b981;">${Icons.lock}</span>
            <div class="box-text">
              <h3>Bu Hesabın PIN Kilit Koruması</h3>
              <p>Bu hesaba başkalarının erişimini 4 haneli PIN ile kısıtlayın</p>
            </div>
          </div>

          <div class="pin-status-row">
            <span>PIN Durumu: <strong>${settings.pinEnabled ? '✅ Aktif' : '❌ Kapalı'}</strong></span>
            ${settings.pinEnabled ? `
              <button type="button" class="btn-danger-outline" id="btnDisablePin">PIN'i Kapat</button>
            ` : `
              <div class="set-pin-group">
                <input type="password" id="inputNewPin" maxlength="4" placeholder="4 Haneli PIN" class="form-input pin-input-field">
                <button type="button" class="btn-primary-action" id="btnEnablePin">PIN Belirle</button>
              </div>
            `}
          </div>
        </div>

        <!-- Egzersiz & Günlük Su Hedefleri -->
        <div class="settings-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #0284c7;">${Icons.activity}</span>
            <div class="box-text">
              <h3>Egzersiz & Su Takip Tercihleri</h3>
              <p>Günlük hidrasyon ve haftalık hareket hedeflerinizi belirleyin</p>
            </div>
          </div>

          <div class="setting-input-row">
            <label>Günlük Su Tüketim Hedefi (ml):</label>
            <input type="number" id="settingWaterTarget" value="${settings.waterTarget || 2250}" step="250" min="1000" max="5000" class="form-input">
          </div>

          <div class="setting-input-row">
            <label>Haftalık Egzersiz Hedefi (Gün):</label>
            <input type="number" id="settingExerciseGoal" value="${settings.exerciseGoalDays || 3}" min="1" max="7" class="form-input">
          </div>

          <button type="button" class="btn-save-settings" id="btnSaveFitnessSettings" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);">
            ${Icons.check} Egzersiz & Su Tercihlerini Kaydet
          </button>
        </div>

        <!-- Veri Yedekleme ve Gizlilik (Export / Import) -->
        <div class="settings-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #0284c7;">${Icons.shield}</span>
            <div class="box-text">
              <h3>Tüm Verileri Yedekle & Rapor</h3>
              <p>%100 Cihazınızda saklanan tüm hesaplarınızı yedekleyin</p>
            </div>
          </div>

          <div class="backup-buttons-row">
            <button type="button" class="btn-backup btn-doctor-pdf-backup" id="btnSettingsDoctorReport">
              🩺 Jinekolog Sağlık Raporu (PDF İndir)
            </button>
            <button type="button" class="btn-backup" id="btnExportBackup">
              ${Icons.download} Tüm Profilleri Yedekle (JSON İndir)
            </button>
            <label class="btn-backup btn-upload-label">
              ${Icons.upload} Yedekten Geri Yükle
              <input type="file" id="fileImportBackup" accept=".json" style="display: none;">
            </label>
          </div>
        </div>

        <!-- Profil Verilerini Sıfırlama -->
        <div class="settings-box danger-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #ef4444;">${Icons.trash}</span>
            <div class="box-text">
              <h3 style="color: #ef4444;">"${activeProfile.name}" Hesabının Verilerini Sıfırla</h3>
              <p>Mevcut hesabın tüm regl ve semptom geçmişini siler.</p>
            </div>
          </div>
          <button type="button" class="btn-danger-full" id="btnResetData">
            Bu Hesabın Verilerini Sıfırla
          </button>
        </div>
      </div>
    `;

    this.bindSettingsEvents(container);
  }

  bindSettingsEvents(container) {
    // Profil yönetimi butonları
    const btnManage = container.querySelector('#btnSettingsManageProfiles');
    if (btnManage) btnManage.onclick = () => this.openProfileModal('list');

    const btnAdd = container.querySelector('#btnSettingsAddProfile');
    if (btnAdd) btnAdd.onclick = () => this.openProfileModal('create');

    // Çevrimdışı rehber & tek dosya
    const btnOffline = container.querySelector('#btnSettingsOfflineGuide');
    if (btnOffline) btnOffline.onclick = () => this.openOfflineGuideModal();

    const btnDownloadHtml = container.querySelector('#btnSettingsDownloadHtml');
    if (btnDownloadHtml) btnDownloadHtml.onclick = () => this.downloadStandaloneHtml();

    // Jinekolog Raporu Butonu
    const btnDrReport = container.querySelector('#btnSettingsDoctorReport');
    if (btnDrReport) {
      btnDrReport.onclick = () => {
        this.reportGen.openReportModal();
      };
    }

    // Döngü Parametrelerini Kaydet
    const btnSaveCycle = container.querySelector('#btnSaveCycleSettings');
    if (btnSaveCycle) {
      btnSaveCycle.onclick = () => {
        const cLen = parseInt(container.querySelector('#settingCycleLen').value, 10) || 28;
        const pLen = parseInt(container.querySelector('#settingPeriodLen').value, 10) || 5;
        const lLen = parseInt(container.querySelector('#settingLutealLen').value, 10) || 14;

        this.storage.updateSettings({
          cycleLength: cLen,
          periodLength: pLen,
          lutealLength: lLen
        });

        alert('Döngü parametreleriniz başarıyla kaydedildi!');
        this.refreshAll();
      };
    }

    // Bildirim Ayarları Olayları
    const notifMaster = container.querySelector('#settingNotifMaster');
    const subWrap = container.querySelector('#notifSubSettingsWrap');
    if (notifMaster && subWrap) {
      notifMaster.onchange = () => {
        subWrap.style.opacity = notifMaster.checked ? '1' : '0.5';
        subWrap.style.pointerEvents = notifMaster.checked ? 'auto' : 'none';
      };
    }

    const btnReqPerm = container.querySelector('#btnSettingsRequestNotifPerm');
    if (btnReqPerm) {
      btnReqPerm.onclick = async () => {
        const res = await this.notifManager.requestPermission();
        if (res.success) {
          alert('Bildirim izni başarıyla verildi!');
        } else if (res.status === 'denied') {
          alert('Tarayıcınızda bildirimler engellenmiş. Adres çubuğundaki kilit / ayar simgesinden izin verebilirsiniz.');
        }
        this.renderSettingsTab(container);
        this.updateHeaderNotificationBadge();
      };
    }

    const btnTestNotif = container.querySelector('#btnSettingsTestNotif');
    if (btnTestNotif) {
      btnTestNotif.onclick = async () => {
        const res = await this.notifManager.sendTestNotification();
        alert(res.message);
        this.updateHeaderNotificationBadge();
      };
    }

    const btnTestDelayed = container.querySelector('#btnSettingsTestDelayedNotif');
    if (btnTestDelayed) {
      btnTestDelayed.onclick = async () => {
        const res = await this.notifManager.scheduleDelayedBackgroundTest(5);
        alert(res.message);
      };
    }

    const btnDiagNotif = container.querySelector('#btnSettingsDiagnosticsNotif');
    if (btnDiagNotif) {
      btnDiagNotif.onclick = () => {
        this.openNotificationDiagnosticsModal();
      };
    }

    const btnSaveNotif = container.querySelector('#btnSaveNotificationSettings');
    if (btnSaveNotif) {
      btnSaveNotif.onclick = async () => {
        const isMaster = container.querySelector('#settingNotifMaster').checked;
        const pDays = parseInt(container.querySelector('#settingNotifPeriodDays').value, 10) || 2;
        const isPeriod = container.querySelector('#settingNotifPeriod').checked;
        const isLate = container.querySelector('#settingNotifLate').checked;
        const isOvu = container.querySelector('#settingNotifOvulation').checked;
        const isPms = container.querySelector('#settingNotifPms').checked;
        const isMood = container.querySelector('#settingNotifMood').checked;
        const moodTime = container.querySelector('#settingNotifMoodTime').value || '15:00';
        const isDaily = container.querySelector('#settingNotifDaily').checked;
        const dailyTime = container.querySelector('#settingNotifDailyTime').value || '20:30';
        const isWater = container.querySelector('#settingNotifWater').checked;
        const waterHours = parseFloat(container.querySelector('#settingNotifWaterHours').value) || 2;

        this.storage.updateSettings({
          notificationsEnabled: isMaster,
          notificationSettings: {
            enabled: isMaster,
            periodReminder: isPeriod,
            periodReminderDays: pDays,
            latePeriodReminder: isLate,
            ovulationReminder: isOvu,
            pmsReminder: isPms,
            moodReminder: isMood,
            moodReminderTime: moodTime,
            dailyLogReminder: isDaily,
            dailyLogTime: dailyTime,
            waterReminder: isWater,
            waterIntervalHours: waterHours
          }
        });

        this.notifManager.notifyListeners();
        await this.notifManager.registerBackgroundSync();
        await this.notifManager.syncStateToServiceWorker();
        this.notifManager.evaluateSmartReminders();
        alert('Bildirim ve hatırlatıcı ayarlarınız kaydedildi, arka plan senkronizasyonu güncellendi!');
        this.renderSettingsTab(container);
        this.updateHeaderNotificationBadge();
      };
    }

    // Egzersiz ve Su Ayarlarını Kaydet
    const btnSaveFit = container.querySelector('#btnSaveFitnessSettings');
    if (btnSaveFit) {
      btnSaveFit.onclick = () => {
        const wTarget = parseInt(container.querySelector('#settingWaterTarget').value, 10) || 2250;
        const eGoal = parseInt(container.querySelector('#settingExerciseGoal').value, 10) || 3;
        this.storage.updateSettings({
          waterTarget: wTarget,
          exerciseGoalDays: eGoal
        });
        alert('Egzersiz ve su hedefleriniz başarıyla kaydedildi!');
        this.refreshAll();
      };
    }

    // PIN Aktif Et
    const btnEnablePin = container.querySelector('#btnEnablePin');
    if (btnEnablePin) {
      btnEnablePin.onclick = () => {
        const pinVal = container.querySelector('#inputNewPin').value.trim();
        if (pinVal.length === 4 && /^\d+$/.test(pinVal)) {
          this.storage.setPin(pinVal);
          alert('4 Haneli PIN kilidi başarıyla etkinleştirildi!');
          this.renderSettingsTab(container);
        } else {
          alert('Lütfen geçerli 4 haneli sayısal bir PIN kodu girin!');
        }
      };
    }

    // PIN Devre Dışı Bırak
    const btnDisablePin = container.querySelector('#btnDisablePin');
    if (btnDisablePin) {
      btnDisablePin.onclick = () => {
        if (confirm('PIN kilidini kapatmak istediğinize emin misiniz?')) {
          this.storage.disablePin();
          this.renderSettingsTab(container);
        }
      };
    }

    // Dışa Aktar (JSON Export)
    const btnExport = container.querySelector('#btnExportBackup');
    if (btnExport) {
      btnExport.onclick = () => {
        const jsonStr = this.storage.exportBackup();
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Dongum_Tum_Profiller_${CycleEngine.formatDateStr(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };
    }

    // İçe Aktar (JSON Import)
    const fileImport = container.querySelector('#fileImportBackup');
    if (fileImport) {
      fileImport.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const res = this.storage.importBackup(event.target.result);
          if (res.success) {
            alert('Yedek başarıyla yüklendi! Profiller ve veriler güncellendi.');
            this.refreshAll();
          } else {
            alert('Yedek yükleme başarısız oldu: ' + res.message);
          }
        };
        reader.readAsText(file);
      };
    }

    // Sıfırla
    const btnReset = container.querySelector('#btnResetData');
    if (btnReset) {
      btnReset.onclick = () => {
        const p = this.storage.getActiveProfile();
        if (confirm(`DİKKAT: "${p.name}" hesabının tüm geçmiş döngü ve semptom kayıtları silinecek! Devam etmek istiyor musunuz?`)) {
          this.storage.resetActiveProfile();
          alert('Hesap verileri başarıyla sıfırlandı.');
          this.refreshAll();
        }
      };
    }
  }

  // Tüm ekranları ve modelleri tazele
  refreshAll(rerenderCurrentTab = true) {
    if (rerenderCurrentTab) {
      this.renderCurrentTab();
    }
    const activeProfile = this.storage.getActiveProfile();
    const tagEmoji = document.getElementById('headerChipEmoji');
    const tagName = document.getElementById('headerChipName');
    if (tagEmoji) tagEmoji.textContent = activeProfile.avatarEmoji || '🌸';
    if (tagName) tagName.textContent = activeProfile.name;
    this.updateHeaderNotificationBadge();
    if (this.notifManager) {
      this.notifManager.syncStateToServiceWorker();
    }
  }
}

// Uygulamayı başlat
document.addEventListener('DOMContentLoaded', () => {
  window.app = new DongumApp();
});

  </script>

  <!-- PWA Service Worker & Kurulum Olayı -->
  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('Döngüm Çevrimdışı Hizmeti (PWA) Aktif:', reg.scope);
        }).catch(function(err) {
          console.warn('SW kayıt notu:', err);
        });
      });
    }
  </script>

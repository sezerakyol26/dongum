  <style>
/* ==========================================================================
   DÖNGÜM - TASARIM SİSTEMİ VE STİLLER (MODERN WELLNESS & HEALTH AESTHETIC)
   ========================================================================== */

:root {
  /* Renk Paleti - Aydınlık Mod */
  --primary: #f43f5e;
  --primary-hover: #e11d48;
  --primary-light: #fff1f2;
  --primary-border: #fecdd3;
  --primary-gradient: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
  
  --secondary: #8b5cf6;
  --secondary-light: #f5f3ff;
  --secondary-gradient: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);

  --ovulation: #f59e0b;
  --ovulation-light: #fef3c7;
  --fertile: #a855f7;
  --fertile-light: #faf5ff;
  --pms: #f97316;
  --pms-light: #fff7ed;

  --success: #10b981;
  --success-light: #ecfdf5;
  --danger: #ef4444;

  --bg-page: #faf7f8;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #ffffff;
  --bg-input: #f8fafc;

  --text-main: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;

  --border-subtle: rgba(226, 232, 240, 0.8);
  --border-card: rgba(244, 63, 94, 0.12);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 8px 24px rgba(244, 63, 94, 0.08);
  --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.08);

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Karanlık Mod Değişkenleri */
body.dark-theme {
  --bg-page: #0f172a;
  --bg-surface: #1e293b;
  --bg-surface-elevated: #334155;
  --bg-input: #1e293b;

  --text-main: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #64748b;

  --border-subtle: #334155;
  --border-card: rgba(244, 63, 94, 0.25);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.6);
}

/* Genel Sıfırlamalar */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-family);
  background-color: var(--bg-page);
  color: var(--text-main);
  overflow-x: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 480px; /* Telefon görünümü için optimize sınır */
  margin: 0 auto;
  position: relative;
  background-color: var(--bg-surface);
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
}

/* Üst Başlık (Header) */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background-color: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
}

body.dark-theme .app-header {
  background-color: rgba(30, 41, 59, 0.85);
}

.app-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-logo-badge {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  background: var(--primary-gradient);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
}

.app-titles {
  display: flex;
  flex-direction: column;
}

.app-title {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-main);
}

.app-profile-tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--primary);
  background-color: var(--primary-light);
  padding: 2px 8px;
  border-radius: var(--radius-full);
  display: inline-block;
  width: fit-content;
  margin-top: 2px;
}

body.dark-theme .app-profile-tag {
  background-color: rgba(244, 63, 94, 0.2);
}

.app-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-action-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}

.header-action-btn:hover {
  background-color: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary-border);
}

/* Ana İçerik Taşıyıcısı */
.app-content-container {
  flex: 1;
  padding: 16px 18px 90px 18px; /* Alt navigasyon payı */
  overflow-y: auto;
}

/* Alt Navigasyon Barı */
.bottom-nav-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 64px;
  background-color: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 50;
  padding: 0 6px;
}

body.dark-theme .bottom-nav-bar {
  background-color: rgba(30, 41, 59, 0.92);
}

.nav-tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px 0;
  transition: var(--transition);
}

.nav-tab-btn .nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 3px;
  transition: var(--transition);
}

.nav-tab-btn .nav-label {
  font-size: 0.72rem;
  font-weight: 500;
}

.nav-tab-btn.active {
  color: var(--primary);
}

.nav-tab-btn.active .nav-icon {
  transform: scale(1.12);
}

/* ==========================================================================
   1. GÜNÜM TAB (ÇOK RENKLİ DÖNGÜ ÇARKI VE DETAYLAR)
   ========================================================================== */
.home-view-wrapper {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Çevrimdışı / Çevrimiçi Durum & Hızlı Eşleme Çubuğu */
.sync-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
}

.status-online-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  font-weight: 600;
  color: #10b981;
}

.online-pulse-dot {
  width: 7px;
  height: 7px;
  background-color: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
  animation: pulseGreen 2s infinite ease-in-out;
}

@keyframes pulseGreen {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
}

.btn-quick-sync {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}

.btn-quick-sync:hover {
  color: var(--primary);
}

/* Çok Renkli Segmentli Döngü Çarkı */
.cycle-dial-container-segmented {
  position: relative;
  width: 270px;
  height: 270px;
  margin: 6px auto 2px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cycle-svg-segmented {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.dial-center-box {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 2;
  padding: 8px;
}

.dial-sub-title {
  font-size: 0.74rem;
  font-weight: 700;
  color: #f43f5e;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.dial-big-day {
  display: flex;
  align-items: baseline;
  justify-content: center;
  margin: 2px 0 0 0;
}

.dial-big-day .day-val {
  font-size: 2.85rem;
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1;
  color: var(--text-main);
}

.dial-big-day .day-total {
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-left: 1px;
}

.dial-phase-text {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-main);
  margin-top: 3px;
}

.dial-fertility-pill {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: var(--radius-full);
  margin-top: 5px;
}

.pill-ovulasyon {
  background-color: #fffbeb;
  color: #d97706;
  border: 1px solid #fde68a;
}

.pill-regl {
  background-color: #fff1f2;
  color: #e11d48;
  border: 1px solid #fecdd3;
}

.pill-folikuler {
  background-color: #f0fdfa;
  color: #0d9488;
  border: 1px solid #99f6e4;
}

.pill-luteal {
  background-color: #faf5ff;
  color: #9333ea;
  border: 1px solid #e9d5ff;
}

.dial-countdown-text {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 5px;
}

.dial-countdown-text strong {
  color: var(--text-main);
  font-weight: 700;
}

/* Çark Altı Evre Açıklamaları (Legend) */
.dial-legend-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  padding: 0 4px;
}

.legend-pill-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.73rem;
  font-weight: 600;
  color: var(--text-secondary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 4px 9px;
  border-radius: var(--radius-full);
  white-space: nowrap;
}

.legend-circle {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

/* Eşleme Modalı */
.sync-textarea {
  font-family: monospace;
  font-size: 0.75rem;
  resize: vertical;
  min-height: 80px;
  background-color: var(--bg-page);
  word-break: break-all;
}

/* Hızlı Aksiyon Kartı */
.quick-action-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  padding: 16px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  gap: 12px;
}

.qa-text h4 {
  font-size: 0.98rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.qa-text p {
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.3;
}

.btn-quick-period {
  background: var(--primary-gradient);
  color: white;
  border: none;
  font-size: 0.88rem;
  font-weight: 600;
  padding: 12px 18px;
  border-radius: var(--radius-full);
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
  transition: var(--transition);
}

.btn-quick-period:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(244, 63, 94, 0.4);
}

.btn-quick-period.btn-active-period {
  background: var(--bg-surface-elevated);
  color: var(--primary);
  border: 2px solid var(--primary);
  box-shadow: none;
}

/* Günlük Öngörü Kartı */
.daily-insight-card {
  background: linear-gradient(145deg, var(--bg-surface), var(--primary-light));
  border: 1px solid var(--primary-border);
  padding: 18px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

body.dark-theme .daily-insight-card {
  background: linear-gradient(145deg, var(--bg-surface), rgba(244, 63, 94, 0.1));
}

.insight-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.insight-item {
  display: flex;
  flex-direction: column;
}

.ins-title {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
}

.ins-val {
  font-size: 1.05rem;
  font-weight: 700;
  margin-top: 2px;
}

.insight-divider {
  width: 1px;
  height: 36px;
  background-color: var(--border-subtle);
}

.insight-advice {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.45;
  border-top: 1px solid var(--border-subtle);
  padding-top: 10px;
}

/* Semptom Ekle Butonu */
.btn-log-symptoms {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  border-radius: var(--radius-md);
  border: 1px dashed var(--primary);
  background-color: var(--primary-light);
  color: var(--primary);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

body.dark-theme .btn-log-symptoms {
  background-color: rgba(244, 63, 94, 0.15);
}

.btn-log-symptoms:hover {
  background-color: var(--primary);
  color: white;
  border-style: solid;
}

/* ==========================================================================
   2. TAKVİM (CALENDAR COMPONENT)
   ========================================================================== */
.calendar-wrapper {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
}

.calendar-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.calendar-title {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.cal-today-btn {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  background-color: var(--primary-light);
  color: var(--primary);
  border: 1px solid var(--primary-border);
  cursor: pointer;
}

.calendar-nav-buttons {
  display: flex;
  gap: 6px;
}

.cal-nav-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}

.cal-nav-btn:hover {
  color: var(--primary);
  border-color: var(--primary);
}

/* Legend */
.calendar-legend {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background-color: var(--bg-page);
  border-radius: var(--radius-sm);
  font-size: 0.72rem;
  color: var(--text-secondary);
  overflow-x: auto;
  gap: 10px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.dot-period { background-color: var(--primary); }
.dot-predicted { background-color: #fb7185; border: 1px dashed var(--primary); }
.dot-ovulation { background-color: var(--ovulation); }
.dot-fertile { background-color: var(--fertile); }
.dot-pms { background-color: var(--pms); }

/* Hafta Günleri */
.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  padding-bottom: 4px;
}

/* Gün Izgarası */
.calendar-days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.cal-day-cell {
  position: relative;
  min-height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  background-color: var(--bg-surface);
  border: 1px solid transparent;
  cursor: pointer;
  transition: var(--transition);
}

.cal-day-cell:hover {
  border-color: var(--primary-border);
}

.cal-day-cell.empty-day {
  background: transparent;
  cursor: default;
}

.cal-day-cell .day-number {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-main);
  z-index: 2;
}

.cal-day-cell.is-today {
  border-color: var(--primary);
  font-weight: 800;
}

.cal-day-cell.selected-cell {
  box-shadow: 0 0 0 2px var(--primary);
}

/* Faz Arka Planları */
.cal-day-cell.phase-period {
  background-color: rgba(244, 63, 94, 0.15);
  color: var(--primary);
}

.cal-day-cell.phase-predicted-period {
  background-color: rgba(251, 113, 133, 0.1);
  border: 1px dashed rgba(244, 63, 94, 0.4);
}

.cal-day-cell.phase-ovulation {
  background-color: rgba(245, 158, 11, 0.18);
  font-weight: 700;
}

.cal-day-cell.phase-fertile {
  background-color: rgba(168, 85, 247, 0.12);
}

.cal-day-cell.phase-pms {
  background-color: rgba(249, 115, 22, 0.12);
}

.day-indicators {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 2px;
  margin-top: 2px;
  min-height: 12px;
}

.indicator-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

.period-dot { background-color: var(--primary); }
.predicted-dot { background-color: #fb7185; }
.ovulation-dot { background-color: var(--ovulation); }
.fertile-dot { background-color: var(--fertile); }
.pms-dot { background-color: var(--pms); }
.indicator-badge { font-size: 7px; color: var(--secondary); margin-left: 1px; }

.indicator-sym-badge {
  font-size: 9px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  gap: 1px;
  background: rgba(244, 63, 94, 0.12);
  border-radius: 4px;
  padding: 0 1px;
}

body.dark-theme .indicator-sym-badge {
  background: rgba(244, 63, 94, 0.25);
}

.indicator-sym-badge .sym-plus {
  font-size: 7px;
  font-weight: 800;
  color: var(--primary);
}

.indicator-note-badge {
  font-size: 8px;
  line-height: 1;
  opacity: 0.85;
}

/* ==========================================================================
   GÜN DETAYI & DÜZENLEME MODALI (BOTTOM SHEET)
   ========================================================================== */
.day-modal-overlay,
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.day-modal-overlay.active,
.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.day-modal-sheet {
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  background-color: var(--bg-surface);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  padding: 14px 0 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1001;
}

.day-modal-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px 16px 20px;
}

.modal-sheet {
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  background-color: var(--bg-surface);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  padding: 16px 20px 30px 20px;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.day-modal-overlay.active .day-modal-sheet,
.modal-overlay.active .modal-sheet {
  transform: translateY(0);
}

.modal-drag-handle {
  width: 40px;
  height: 4px;
  background-color: var(--border-subtle);
  border-radius: var(--radius-full);
  margin: 0 auto 12px auto;
}

.modal-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.modal-date-subtitle {
  font-size: 0.78rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.modal-date-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-main);
}

.modal-close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  border-radius: 50%;
}

.modal-close-btn:hover {
  color: var(--text-main);
  background-color: var(--bg-input);
}

/* Faz Banner */
.modal-phase-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px;
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-page);
}

.phase-bg-period { background-color: var(--primary-light); border-color: var(--primary-border); }
.phase-bg-predicted_period { background-color: #fff1f2; border-color: #fecdd3; }
.phase-bg-ovulation { background-color: var(--ovulation-light); border-color: #fde68a; }
.phase-bg-fertile { background-color: var(--fertile-light); border-color: #e9d5ff; }
.phase-bg-pms { background-color: var(--pms-light); border-color: #fed7aa; }

.phase-banner-info h4 {
  font-size: 0.95rem;
  font-weight: 700;
  margin: 2px 0;
}

.phase-banner-info p {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.phase-tag {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--primary);
}

.pregnancy-badge {
  text-align: right;
  display: flex;
  flex-direction: column;
}

.preg-label {
  font-size: 0.68rem;
  color: var(--text-muted);
}

.pregnancy-badge strong {
  font-size: 0.88rem;
  color: var(--text-main);
}

/* Modal Bölümleri */
.modal-section {
  margin-bottom: 18px;
}

.section-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 8px;
}

/* Regl Kontrolü */
.period-control-section {
  background-color: var(--bg-input);
  padding: 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.period-toggle-row {
  display: flex;
  gap: 10px;
}

.btn-period-toggle {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.btn-period-toggle.active-period {
  background: var(--primary-gradient);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
}

.btn-period-delete {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid #fecaca;
  background-color: #fff1f2;
  color: #ef4444;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.btn-period-delete:hover {
  background-color: #ef4444;
  color: white;
}

.period-calc-hint {
  font-size: 0.74rem;
  color: var(--text-muted);
  margin-top: 8px;
  line-height: 1.35;
}

/* Akış Yoğunluğu Seçici */
.flow-selector {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
}

.flow-selector.disabled-flow {
  opacity: 0.4;
  pointer-events: none;
}

.flow-label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.flow-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.flow-btn {
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: var(--transition);
}

.flow-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.f-spotting { background-color: #fda4af; }
.f-light { background-color: #fb7185; }
.f-medium { background-color: #f43f5e; }
.f-heavy { background-color: #be123c; }

.flow-btn.selected {
  border-color: var(--primary);
  background-color: var(--primary-light);
  color: var(--primary);
  font-weight: 700;
}

/* Chips Izgarası (Semptom & Ruh Hali) */
.chips-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.chip-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
}

.chip-item:hover {
  border-color: var(--primary-border);
}

.chip-item.chip-active {
  background-color: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}

body.dark-theme .chip-item.chip-active {
  background-color: rgba(244, 63, 94, 0.2);
}

.chips-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip-pill {
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  font-size: 0.78rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.chip-pill.chip-active {
  background-color: var(--secondary-light);
  border-color: var(--secondary);
  color: var(--secondary);
  font-weight: 600;
}

.notes-textarea {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-input);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.85rem;
  resize: vertical;
}

.modal-actions-bar {
  flex-shrink: 0;
  width: 100%;
  padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)) 20px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  z-index: 50;
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.08);
}

.btn-primary-action {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px;
  border-radius: var(--radius-md);
  background: var(--primary-gradient);
  color: white;
  border: none;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
  transition: var(--transition);
}

.btn-primary-action:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

/* ==========================================================================
   3. ANALİZ SEKMESİ (ANALYTICS)
   ========================================================================== */
.analytics-wrapper {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-heading {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.section-subheading {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.stats-overview-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-sm);
}

.stat-card.card-regularity {
  grid-column: span 2;
  flex-direction: row;
  align-items: center;
  gap: 14px;
}

.stat-icon-wrap {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-md);
  background-color: var(--bg-page);
  display: flex;
  align-items: center;
  justify-content: center;
}

.stat-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
}

.stat-value-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.stat-number {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.5px;

.stat-number small {

.box-title {

.box-subtitle {

.proj-badge {

.p-label {

.btn-goto-date {

/* Semptom Barları */
.symptom-bars-list {

}

.symptom-bar-info {

}

}

.symptom-progress-fill {

}

/* Döngü Geçmişi Listesi */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.history-card {

  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.history-card-header {

  justify-content: space-between;
  margin-bottom: 6px;
}

.history-index {

}

.history-duration {

  font-weight: 600;
  color: var(--text-secondary);
}

.history-card-body {

  justify-content: space-between;
}

.history-dates {

}

.btn-history-view {

  border: 1px solid var(--border-subtle);
  padding: 6px 10px;
  border-radius: var(--radius-sm);

  align-items: center;

}

.btn-history-view:hover {

}

.empty-state-notice {

  padding: 20px 10px;
  color: var(--text-muted);
  font-size: 0.82rem;

}

/* ==========================================================================
   4. AYARLAR & GİZLİLİK (SETTINGS)
   ========================================================================== */
.settings-view-wrapper {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.settings-box {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}

.settings-box-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.box-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  background-color: var(--bg-page);
  display: flex;
  align-items: center;
  justify-content: center;
}

.box-text h3 {
  font-size: 0.98rem;
  font-weight: 700;
}

.box-text p {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.setting-input-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.setting-input-row label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.form-input {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-input);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.9rem;
}

.btn-save-settings {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-md);
  background-color: var(--primary-light);
  color: var(--primary);
  border: 1px solid var(--primary-border);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.pin-status-row {
  display: flex;
  flex-direction: column;
  gap: 12px;

}

.set-pin-group {

}

.pin-input-field {

}

.btn-danger-outline {
  padding: 8px 14px;

  border: 1px solid var(--danger);

  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  width: fit-content;
}

.backup-buttons-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn-backup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-page);
  color: var(--text-main);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: var(--transition);
}

.btn-backup:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.btn-upload-label {
  cursor: pointer;
}

.danger-box {
  border-color: rgba(239, 68, 68, 0.3);
}

.btn-danger-full {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-md);
  background-color: #fee2e2;
  color: #ef4444;
  border: 1px solid #fca5a5;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}

/* ==========================================================================
   HESAP VE PROFİL YÖNETİMİ & ÇEVRİMDİŞİ MODAL STİLLERİ
   ========================================================================== */

/* Başlık Profil Seçici Butonu */
.app-profile-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background-color: var(--primary-light);
  border: 1px solid var(--primary-border);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: var(--transition);
}

body.dark-theme .app-profile-chip {
  background-color: rgba(244, 63, 94, 0.15);
  border-color: rgba(244, 63, 94, 0.35);
}

.app-profile-chip:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(244, 63, 94, 0.15);
}

.chip-emoji {
  font-size: 0.95rem;
}

.chip-name {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--primary);
  max-width: 100px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chip-arrow {
  font-size: 0.65rem;
  color: var(--primary);

}

/* Profil & Hesap Modalı */
.profile-modal-sheet {
  max-height: 85vh;
  display: flex;
  flex-direction: column;
}

.account-modal-tabs {

  border-bottom: 1px solid var(--border-subtle);

}

.account-tab-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  background: none;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
}

.account-tab-btn.active {
  background-color: var(--primary-light);
  color: var(--primary);
}

body.dark-theme .account-tab-btn.active {
  background-color: rgba(244, 63, 94, 0.2);
}

.profiles-list-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  max-height: 52vh;
  padding-right: 4px;
  margin-bottom: 14px;
}

.profile-card-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-subtle);
  background-color: var(--bg-surface);
  transition: var(--transition);
  position: relative;
}

.profile-card-item:hover {
  border-color: rgba(244, 63, 94, 0.35);
  box-shadow: var(--shadow-sm);
}

.profile-card-item.active-profile {
  border-color: var(--primary);
  background-color: var(--primary-light);
}

body.dark-theme .profile-card-item.active-profile {
  background-color: rgba(244, 63, 94, 0.15);
}

.profile-card-left {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  flex: 1;
}

.profile-card-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  flex-shrink: 0;
}

.profile-card-details {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.profile-card-name-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.profile-card-name-row strong {
  font-size: 0.95rem;
  color: var(--text-main);
}

.profile-lock-tag {
  font-size: 0.72rem;
  color: #f59e0b;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-weight: 600;
}

.profile-card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: var(--text-muted);
}

.profile-badge-role {
  background-color: rgba(0, 0, 0, 0.05);
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
}

body.dark-theme .profile-badge-role {
  background-color: rgba(255, 255, 255, 0.1);
}

.profile-badge-active {
  color: var(--primary);
  font-weight: 700;
}

.profile-card-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.btn-card-action {
  background: none;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.btn-card-action:hover {
  color: var(--text-main);
  border-color: var(--primary);
}

.btn-card-action.btn-del:hover {
  color: var(--danger);
  border-color: var(--danger);
}

/* Profil Oluşturma / Düzenleme Formu */
.account-form-wrap {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form-group-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.picker-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  display: block;
}

.emoji-picker-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.emoji-pick-btn {
  width: 38px;
  height: 38px;
  font-size: 1.25rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-page);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.emoji-pick-btn.selected {
  border-color: var(--primary);
  background-color: var(--primary-light);
  transform: scale(1.12);
}

body.dark-theme .emoji-pick-btn.selected {
  background-color: rgba(244, 63, 94, 0.2);
}

.color-picker-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.color-pick-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: var(--transition);
}

.color-pick-circle.selected {
  border-color: #0f172a;
  transform: scale(1.15);
  box-shadow: 0 0 0 2px white;
}

body.dark-theme .color-pick-circle.selected {
  border-color: #ffffff;
  box-shadow: 0 0 0 2px #1e293b;
}

/* Çevrimdışı & Kurulum Rehberi Modalı */
.offline-guide-sheet {
  max-height: 85vh;
}

.guide-cards-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 12px;
}

.guide-step-card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px;

}

.guide-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.guide-card-icon {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
}

body.dark-theme .guide-card-icon {
  background: rgba(244, 63, 94, 0.2);
}

.guide-card-header h4 {
  font-size: 0.95rem;
  color: var(--text-main);
}

.guide-step-card p, .guide-step-card ol {

}

.guide-step-card ol {

}

.guide-step-card ol li {

}

.guide-highlight-badge {

  color: #065f46;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  font-weight: 600;
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

body.dark-theme .guide-highlight-badge {
  background: rgba(16, 185, 129, 0.15);
  border-color: rgba(16, 185, 129, 0.3);
  color: #34d399;
}

/* ==========================================================================
   5. PIN KİLİT EKRANI (PIN OVERLAY)
   ========================================================================== */
.pin-lock-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-surface);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.pin-lock-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

  pointer-events: none;

.app-login-overlay.active {

  flex-direction: column;

  justify-content: center;

  height: 100%;

}

.login-brand-header h2 {
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text-main);
}

.login-brand-header p {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 4px;
}

.login-profiles-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}

.login-profile-card {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 14px 16px;

.login-profile-card:hover, .login-profile-card:active {

body.dark-theme .login-profile-card:hover {
  background-color: rgba(244, 63, 94, 0.15);
}

.login-p-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.login-p-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;

.login-p-info {

.login-p-name {

.login-p-right {

.login-p-lock-badge {

    height: auto !important;

    margin: 0 !important;
    backdrop-filter: none !important;
    display: block !important;
    opacity: 1 !important;
  }

  .doctor-modal-window {
    box-shadow: none !important;
    border-radius: 0 !important;
    max-width: 100% !important;
    max-height: none !important;

    display: block !important;
    overflow: visible !important;
  }

    padding: 0 !important;

    display: block !important;
  }

  .doctor-report-document {
    box-shadow: none !important;
    border-radius: 0 !important;
    max-width: 100% !important;
    padding: 10mm 15mm !important;

/**
 * Döngüm - Güvenli Yerel Depolama (Storage) Katmanı
 * %100 Cihaz Hafızasında çalışır, sunucu veya bulut gerektirmez.
 * Çoklu profil & hesap yönetimi, PIN kodu koruması ve veri yedekleme özellikleri içerir.
 * WhatsApp, Safari QuickLook ve kısıtlı webview'larda çökmeyen SafeStorage koruması içerir.
 */

const STORAGE_KEYS = {
  PROFILES: 'dongum_profiles_v1',
  ACTIVE_PROFILE: 'dongum_active_profile_v1',
  DATA_PREFIX: 'dongum_data_v1_',
  GLOBAL_SETTINGS: 'dongum_global_settings_v1',
  LOCK_STATE: 'dongum_session_locked'
};

const DEFAULT_SETTINGS = {
  cycleLength: 28,
  periodLength: 5,
  lutealLength: 14,
  pin: null,
  pinEnabled: false,
  darkMode: false,
  notificationsEnabled: false
};

const PROFILE_ROLES = [
  { id: 'personal', name: 'Kişisel Hesap', badge: 'Benim Döngüm' },
  { id: 'private', name: 'Gizli Kasa', badge: 'Şifreli Profil' },
  { id: 'family', name: 'Aile / Arkadaş', badge: 'Takip Hesabı' },
  { id: 'guest', name: 'Misafir / Danışan', badge: 'İkinci Hesap' }
];

const PROFILE_EMOJIS = ['🌸', '🌺', '🌙', '⭐', '🌿', '💎', '🦋', '🥑', '👑', '🦄', '🍓', '💜', '🎀', '🐱'];
const PROFILE_COLORS = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#6366f1', '#14b8a6'];

/**
 * Güvenli Depolama Adaptörü:
 * WhatsApp içi tarayıcı, iOS QuickLook veya özel gizli modlarda
 * localStorage erişimi engellenmiş olsa dahi uygulamanın çökmesini engeller.
 */
class SafeStorage {
  constructor() {
    this.memory = {};
    this.isAvailable = this.probe();
  }

  probe() {
    try {
      if (typeof window === 'undefined' || !window.localStorage) return false;
      const test = '__dongum_storage_probe__';
      window.localStorage.setItem(test, '1');
      window.localStorage.removeItem(test);
      return true;
    } catch (e) {
      console.warn('LocalStorage erişimi kısıtlı, güvenli bellek depolaması devrede:', e);
      return false;
    }
  }

  getItem(key) {
    if (this.isAvailable) {
      try {
        const val = window.localStorage.getItem(key);
        if (val !== null) return val;
      } catch (e) {
        // kısıtlı durum
      }
    }
    return this.memory[key] || null;
  }

  setItem(key, value) {
    const strVal = String(value);
    this.memory[key] = strVal;
    if (this.isAvailable) {
      try {
        window.localStorage.setItem(key, strVal);
      } catch (e) {
        // kota veya kısıtlama
      }
    }
  }

  removeItem(key) {
    delete this.memory[key];
    if (this.isAvailable) {
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        // hata yut
      }
    }
  }
}

const safeStorage = new SafeStorage();

class StorageManager {
  constructor() {
    this.init();
  }

  init() {
    // Profil listesi kontrolü
    let profiles = this.getProfiles();
    if (!profiles || profiles.length === 0) {
      const defaultProfile = {
        id: 'prof_' + Date.now(),
        name: 'Döngüm',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        createdAt: new Date().toISOString(),
        avatarColor: '#f43f5e',
        avatarEmoji: '🌸',
        pin: null,
        pinEnabled: false
      };
      profiles = [defaultProfile];
      this.saveProfiles(profiles);
      this.setActiveProfileId(defaultProfile.id);
      
      // İlk varsayılan profil verisi
      this.saveProfileData(defaultProfile.id, {
        settings: { ...DEFAULT_SETTINGS },
        days: {} // 'YYYY-MM-DD': { isPeriod, flow, symptoms, mood, notes, etc. }
      });
    } else {
      // Mevcut profillerin yeni alanlarını tamamla (Geriye dönük uyumluluk)
      let changed = false;
      profiles = profiles.map(p => {
        let pCopy = { ...p };
        if (!pCopy.avatarEmoji) {
          pCopy.avatarEmoji = '🌸';
          changed = true;
        }
        if (!pCopy.role) {
          pCopy.role = 'personal';
          pCopy.roleName = 'Kişisel Hesap';
          changed = true;
        }
        if (pCopy.pinEnabled === undefined) {
          pCopy.pinEnabled = false;
          pCopy.pin = null;
          changed = true;
        }
        return pCopy;
      });
      if (changed) {
        this.saveProfiles(profiles);
      }
    }

    // Aktif profil doğrula
    let activeId = this.getActiveProfileId();
    if (!activeId || !profiles.some(p => p.id === activeId)) {
      this.setActiveProfileId(profiles[0].id);
    }
  }

  // --- Profil & Hesap Yönetimi ---
  getProfiles() {
    try {
      const data = safeStorage.getItem(STORAGE_KEYS.PROFILES);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      console.error('Profiller okunamadı:', e);
      return [];
    }
  }

  saveProfiles(profiles) {
    safeStorage.setItem(STORAGE_KEYS.PROFILES, JSON.stringify(profiles));
  }

  getActiveProfileId() {
    return safeStorage.getItem(STORAGE_KEYS.ACTIVE_PROFILE);
  }

  setActiveProfileId(id) {
    safeStorage.setItem(STORAGE_KEYS.ACTIVE_PROFILE, id);
  }

  getActiveProfile() {
    const profiles = this.getProfiles();
    const activeId = this.getActiveProfileId();
    return profiles.find(p => p.id === activeId) || profiles[0];
  }

  getProfileById(id) {
    const profiles = this.getProfiles();
    return profiles.find(p => p.id === id) || null;
  }

  createProfile(optionsOrName, color = '#f43f5e') {
    let opts = {};
    if (typeof optionsOrName === 'string') {
      opts = {
        name: optionsOrName,
        avatarColor: color,
        avatarEmoji: '🌸',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        pin: null,
        pinEnabled: false,
        cycleLength: 28,
        periodLength: 5,
        lutealLength: 14
      };
    } else {
      opts = {
        name: 'Yeni Hesap',
        avatarColor: '#f43f5e',
        avatarEmoji: '🌸',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        pin: null,
        pinEnabled: false,
        cycleLength: 28,
        periodLength: 5,
        lutealLength: 14,
        ...optionsOrName
      };
    }

    const profiles = this.getProfiles();
    const newProfile = {
      id: 'prof_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
      name: opts.name.trim() || 'Yeni Hesap',
      role: opts.role || 'personal',
      roleName: opts.roleName || (PROFILE_ROLES.find(r => r.id === opts.role)?.name || 'Hesap'),
      avatarColor: opts.avatarColor || '#f43f5e',
      avatarEmoji: opts.avatarEmoji || '🌸',
      pin: opts.pin ? String(opts.pin) : null,
      pinEnabled: !!(opts.pin && opts.pinEnabled),
      createdAt: new Date().toISOString()
    };

    profiles.push(newProfile);
    this.saveProfiles(profiles);

    // Yeni profil boş verisi ve ayarları
    const initialSettings = {
      ...DEFAULT_SETTINGS,
      cycleLength: parseInt(opts.cycleLength, 10) || 28,
      periodLength: parseInt(opts.periodLength, 10) || 5,
      lutealLength: parseInt(opts.lutealLength, 10) || 14,
      pin: newProfile.pin,
      pinEnabled: newProfile.pinEnabled
    };

    this.saveProfileData(newProfile.id, {
      settings: initialSettings,
      days: {}
    });

    return newProfile;
  }

  switchProfile(profileId) {
    const profiles = this.getProfiles();
    const target = profiles.find(p => p.id === profileId);
    if (target) {
      this.setActiveProfileId(profileId);
      return true;
    }
    return false;
  }

  deleteProfile(profileId) {
    let profiles = this.getProfiles();
    if (profiles.length <= 1) {
      return { success: false, message: 'En az bir aktif profil/hesap bulunmalıdır!' };
    }

    profiles = profiles.filter(p => p.id !== profileId);
    this.saveProfiles(profiles);
    safeStorage.removeItem(STORAGE_KEYS.DATA_PREFIX + profileId);

    if (this.getActiveProfileId() === profileId) {
      this.setActiveProfileId(profiles[0].id);
    }

    return { success: true };
  }

  updateProfile(profileId, updates = {}) {
    const profiles = this.getProfiles();
    const target = profiles.find(p => p.id === profileId);
    if (target) {
      if (updates.name !== undefined) target.name = updates.name.trim() || target.name;
      if (updates.avatarColor !== undefined) target.avatarColor = updates.avatarColor;
      if (updates.avatarEmoji !== undefined) target.avatarEmoji = updates.avatarEmoji;
      if (updates.role !== undefined) {
        target.role = updates.role;
        target.roleName = updates.roleName || (PROFILE_ROLES.find(r => r.id === updates.role)?.name || target.roleName);
      }
      if (updates.pin !== undefined) {
        target.pin = updates.pin ? String(updates.pin) : null;
        target.pinEnabled = !!(target.pin && (updates.pinEnabled !== false));
        // Settings içine de yansıt
        const profData = this.getProfileData(profileId);
        profData.settings.pin = target.pin;
        profData.settings.pinEnabled = target.pinEnabled;
        this.saveProfileData(profileId, profData);
      } else if (updates.pinEnabled !== undefined) {
        target.pinEnabled = updates.pinEnabled;
        const profData = this.getProfileData(profileId);
        profData.settings.pinEnabled = target.pinEnabled;
        this.saveProfileData(profileId, profData);
      }

      this.saveProfiles(profiles);
      return true;
    }
    return false;
  }

  // --- Profil Bazlı PIN Güvenliği ---
  isProfilePinRequired(profileId = null) {
    const p = profileId ? this.getProfileById(profileId) : this.getActiveProfile();
    return !!(p && p.pinEnabled && p.pin);
  }

  checkProfilePin(profileId, enteredPin) {
    const p = profileId ? this.getProfileById(profileId) : this.getActiveProfile();
    if (!p || !p.pinEnabled || !p.pin) return true;
    return String(p.pin) === String(enteredPin);
  }

  setProfilePin(profileId, pin) {
    if (!pin || pin.length !== 4) return false;
    return this.updateProfile(profileId || this.getActiveProfileId(), { pin: String(pin), pinEnabled: true });
  }

  disableProfilePin(profileId) {
    return this.updateProfile(profileId || this.getActiveProfileId(), { pin: null, pinEnabled: false });
  }

  // --- Aktif Profil Verileri ---
  getProfileData(profileId = null) {
    const id = profileId || this.getActiveProfileId();
    try {
      const raw = safeStorage.getItem(STORAGE_KEYS.DATA_PREFIX + id);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          settings: { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) },
          days: parsed.days || {}
        };
      }
    } catch (e) {
      console.error('Profil verisi okunamadı:', e);
    }
    return {
      settings: { ...DEFAULT_SETTINGS },
      days: {}
    };
  }

  saveProfileData(profileId, data) {
    const id = profileId || this.getActiveProfileId();
    try {
      safeStorage.setItem(STORAGE_KEYS.DATA_PREFIX + id, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error('Profil verisi kaydedilemedi:', e);
      return false;
    }
  }

  updateSettings(newSettings) {
    const data = this.getProfileData();
    data.settings = { ...data.settings, ...newSettings };
    this.saveProfileData(null, data);

    // Eğer PIN ayarı buradan güncellendiyse profile da senkronize et
    if (newSettings.pin !== undefined || newSettings.pinEnabled !== undefined) {
      const activeId = this.getActiveProfileId();
      this.updateProfile(activeId, {
        pin: data.settings.pin,
        pinEnabled: data.settings.pinEnabled
      });
    }

    return data.settings;
  }

  // --- Günlük Veri Kayıt & Silme ---
  getDayData(dateStr) {
    const data = this.getProfileData();
    return data.days[dateStr] || null;
  }

  saveDayData(dateStr, dayDetails) {
    const data = this.getProfileData();
    if (!data.days[dateStr]) {
      data.days[dateStr] = {};
    }
    data.days[dateStr] = {
      ...data.days[dateStr],
      ...dayDetails,
      updatedAt: new Date().toISOString()
    };
    this.saveProfileData(null, data);
    return data.days[dateStr];
  }

  deleteDayData(dateStr) {
    const data = this.getProfileData();
    if (data.days[dateStr]) {
      delete data.days[dateStr];
      this.saveProfileData(null, data);
      return true;
    }
    return false;
  }

  // Günün sadece regl kaydını sıfırlar / kaldırır
  clearPeriodForDay(dateStr) {
    const data = this.getProfileData();
    if (data.days[dateStr]) {
      data.days[dateStr].isPeriod = false;
      data.days[dateStr].flow = null;
      data.days[dateStr].isManual = true;
      this.saveProfileData(null, data);
      return true;
    }
    return false;
  }

  // Genel PIN uyumluluk metotları (app.js ile uyum)
  isPinRequired() {
    return this.isProfilePinRequired(this.getActiveProfileId());
  }

  checkPin(enteredPin) {
    return this.checkProfilePin(this.getActiveProfileId(), enteredPin);
  }

  setPin(pin) {
    return this.setProfilePin(this.getActiveProfileId(), pin);
  }

  disablePin() {
    return this.disableProfilePin(this.getActiveProfileId());
  }

  // --- Tekil Profil Dışa / İçe Aktar (Hesap Paylaşımı) ---
  exportSingleProfile(profileId = null) {
    const id = profileId || this.getActiveProfileId();
    const profile = this.getProfileById(id);
    const data = this.getProfileData(id);

    const payload = {
      format: 'dongum_single_account_v1',
      exportedAt: new Date().toISOString(),
      profile: profile,
      data: data
    };

    return JSON.stringify(payload, null, 2);
  }

  importSingleProfile(jsonString) {
    try {
      const payload = JSON.parse(jsonString);
      if (!payload || !payload.profile || !payload.data) {
        throw new Error('Geçersiz hesap aktarım formatı!');
      }

      const p = payload.profile;
      const newId = 'prof_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
      const newProfile = {
        ...p,
        id: newId,
        name: (p.name || 'İçe Aktarılan Hesap') + ' (Yeni)',
        createdAt: new Date().toISOString()
      };

      const profiles = this.getProfiles();
      profiles.push(newProfile);
      this.saveProfiles(profiles);

      this.saveProfileData(newId, payload.data);
      this.setActiveProfileId(newId);

      return { success: true, profile: newProfile };
    } catch (e) {
      console.error('Hesap yükleme hatası:', e);
      return { success: false, message: e.message };
    }
  }

  // --- Tüm Profilleri Dışa / İçe Aktarma (Full Backup) ---
  exportBackup() {
    const profiles = this.getProfiles();
    const backup = {
      version: '2.0',
      exportedAt: new Date().toISOString(),
      profiles: profiles,
      profilesData: {}
    };

    for (const p of profiles) {
      backup.profilesData[p.id] = this.getProfileData(p.id);
    }

    return JSON.stringify(backup, null, 2);
  }

  importBackup(jsonString) {
    try {
      const backup = JSON.parse(jsonString);
      if (!backup || !backup.profiles || !backup.profilesData) {
        throw new Error('Geçersiz yedek dosyası formatı!');
      }

      this.saveProfiles(backup.profiles);
      for (const p of backup.profiles) {
        if (backup.profilesData[p.id]) {
          this.saveProfileData(p.id, backup.profilesData[p.id]);
        }
      }

      if (backup.profiles.length > 0) {
        this.setActiveProfileId(backup.profiles[0].id);
      }

      return { success: true, count: backup.profiles.length };
    } catch (e) {
      console.error('Yedek yükleme hatası:', e);
      return { success: false, message: e.message };
    }
  }

  // Aktif profilin tüm verilerini sıfırla
  resetActiveProfile() {
    const activeId = this.getActiveProfileId();
    this.saveProfileData(activeId, {
      settings: { ...DEFAULT_SETTINGS },
      days: {}
    });
  }
}

const storage = new StorageManager();


/**
 * Döngüm - Biyolojik Modelleme ve Döngü Tahminleme Motoru
 * Kullanıcının girdiği verilere göre ortalama süreleri, düzenlilik skorunu
 * ve fazları (Regl, Foliküler, Ovülasyon, Luteal, PMS) hesaplar.
 * Manuel giriş ve silmelere göre anında kendini optimize eder.
 */

class CycleEngine {
  constructor(storageManager) {
    this.storage = storageManager;
  }

  // Tarih yardımcıları (Saat dilimi kaymalarını önlemek için YYYY-MM-DD bazlı)
  static parseDateStr(str) {
    if (!str) return new Date();
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  static formatDateStr(d) {
    if (!(d instanceof Date) || isNaN(d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  static addDays(dateStrOrObj, days) {
    const d = typeof dateStrOrObj === 'string' 
      ? CycleEngine.parseDateStr(dateStrOrObj) 
      : new Date(dateStrOrObj);
    d.setDate(d.getDate() + days);
    return CycleEngine.formatDateStr(d);
  }

  static diffDays(dateStrA, dateStrB) {
    const da = CycleEngine.parseDateStr(dateStrA);
    const db = CycleEngine.parseDateStr(dateStrB);
    const msDiff = da.getTime() - db.getTime();
    return Math.round(msDiff / (1000 * 60 * 60 * 24));
  }

  // --- Geçmiş Dönemleri Kümeleme (Clustering) ---
  // Kullanıcının gün gün girdiği regl kayıtlarını tespit eder
  getPeriodClusters() {
    const profileData = this.storage.getProfileData();
    const days = profileData.days || {};

    // Sadece regl olarak işaretli günleri sırala
    const periodDates = Object.keys(days)
      .filter(dateStr => days[dateStr].isPeriod)
      .sort();

    if (periodDates.length === 0) return [];

    const clusters = [];
    let currentCluster = [periodDates[0]];

    for (let i = 1; i < periodDates.length; i++) {
      const prevDate = periodDates[i - 1];
      const currDate = periodDates[i];
      const gap = CycleEngine.diffDays(currDate, prevDate);

      // Eğer ardışık ise ya da arada en fazla 1 günlük lekelenme boşluğu varsa aynı döneme dahil et
      if (gap <= 2) {
        currentCluster.push(currDate);
      } else {
        clusters.push({
          startDate: currentCluster[0],
          endDate: currentCluster[currentCluster.length - 1],
          dates: [...currentCluster],
          duration: CycleEngine.diffDays(currentCluster[currentCluster.length - 1], currentCluster[0]) + 1
        });
        currentCluster = [currDate];
      }
    }

    if (currentCluster.length > 0) {
      clusters.push({
        startDate: currentCluster[0],
        endDate: currentCluster[currentCluster.length - 1],
        dates: [...currentCluster],
        duration: CycleEngine.diffDays(currentCluster[currentCluster.length - 1], currentCluster[0]) + 1
      });
    }

    return clusters;
  }

  // --- İstatistikler ve Uyarlanabilir Süreler ---
  calculateStats() {
    const profileData = this.storage.getProfileData();
    const baseSettings = profileData.settings;
    const clusters = this.getPeriodClusters();

    let avgPeriodLength = baseSettings.periodLength || 5;
    let avgCycleLength = baseSettings.cycleLength || 28;
    let cycleDurations = [];
    let periodDurations = clusters.map(c => c.duration).filter(d => d >= 2 && d <= 12);

    if (periodDurations.length > 0) {
      const sumPeriod = periodDurations.reduce((a, b) => a + b, 0);
      avgPeriodLength = Math.round(sumPeriod / periodDurations.length);
      // Makul fizyolojik sınırlar
      avgPeriodLength = Math.max(3, Math.min(10, avgPeriodLength));
    }

    // Döngü aralıklarını hesapla (İki başlangıç tarihi arası)
    if (clusters.length >= 2) {
      for (let i = 0; i < clusters.length - 1; i++) {
        const interval = CycleEngine.diffDays(clusters[i + 1].startDate, clusters[i].startDate);
        // Makul biyolojik aralık (18 ila 60 gün)
        if (interval >= 18 && interval <= 60) {
          cycleDurations.push(interval);
        }
      }

      if (cycleDurations.length > 0) {
        // Son döngülere daha yüksek ağırlık veren ağırlıklı ortalama
        let weightSum = 0;
        let weightedTotal = 0;
        cycleDurations.forEach((dur, idx) => {
          const w = idx + 1;
          weightedTotal += dur * w;
          weightSum += w;
        });
        avgCycleLength = Math.round(weightedTotal / weightSum);
        avgCycleLength = Math.max(21, Math.min(45, avgCycleLength));
      }
    }

    // Düzenlilik Skoru ve Standart Sapma
    let stdDev = 0;
    let regularityScore = 95; // Varsayılan sağlıklı başlangıç puanı

    if (cycleDurations.length >= 2) {
      const mean = cycleDurations.reduce((a, b) => a + b, 0) / cycleDurations.length;
      const variance = cycleDurations.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / cycleDurations.length;
      stdDev = Math.sqrt(variance);

      // Sapma arttıkça skor düşer
      regularityScore = Math.max(40, Math.min(100, Math.round(100 - (stdDev * 8))));
    } else if (clusters.length === 1) {
      regularityScore = 92;
    }

    return {
      averageCycleLength: avgCycleLength,
      averagePeriodLength: avgPeriodLength,
      lutealLength: baseSettings.lutealLength || 14,
      totalLoggedCycles: clusters.length,
      cycleDurations,
      regularityScore,
      stdDev: Math.round(stdDev * 10) / 10,
      lastPeriod: clusters.length > 0 ? clusters[clusters.length - 1] : null
    };
  }

  calculateStatistics() {
    return this.calculateStats();
  }

  /**
   * Takvim üzerinde yapılan işaretlemeler sonrasında ayarlar sekmesindeki
   * döngü parametrelerini (döngü süresi, regl süresi) hesaplanan gerçek biyolojik verilere göre otomatik revize eder.
   */
  syncSettingsFromCalendarData() {
    const profileData = this.storage.getProfileData();
    const clusters = this.getPeriodClusters();
    const stats = this.calculateStats();

    let updated = false;
    const newSettings = { ...profileData.settings };

    // Eğer en az 1 regl dönemi kaydedilmişse ortalama regl süresini revize et
    if (clusters.length >= 1 && stats.averagePeriodLength) {
      if (newSettings.periodLength !== stats.averagePeriodLength) {
        newSettings.periodLength = stats.averagePeriodLength;
        updated = true;
      }
    }

    // Eğer en az 2 regl dönemi kaydedilmişse döngü aralığını otomatik revize et
    if (clusters.length >= 2 && stats.averageCycleLength) {
      if (newSettings.cycleLength !== stats.averageCycleLength) {
        newSettings.cycleLength = stats.averageCycleLength;
        updated = true;
      }
    }

    if (updated) {
      this.storage.updateSettings(newSettings);
      console.log('Döngü parametreleri takvim verilerine göre otomatik revize edildi:', {
        cycleLength: newSettings.cycleLength,
        periodLength: newSettings.periodLength,
        cyclesCount: clusters.length
      });
    }

    return { updated, settings: newSettings, stats };
  }

  // --- Akıllı Otomatik Doldurma ve Manuel Müdahale ---
  /**
   * Kullanıcı belirli bir tarihe regl başlangıcı girdiğinde,
   * ortalama regl süresine göre diğer günleri işaretler.
   */
  logPeriodStart(startDateStr, flow = 'medium') {
    const stats = this.calculateStats();
    const periodDays = stats.averagePeriodLength;
    const profileData = this.storage.getProfileData();

    // Başlangıç gününü manuel kayıt olarak işle
    this.storage.saveDayData(startDateStr, {
      isPeriod: true,
      flow: flow,
      isManual: true,
      isPredicted: false
    });

    // Takip eden günleri doldur (eğer kullanıcı daha önce bu günleri manuel silmediyse)
    for (let i = 1; i < periodDays; i++) {
      const nextDateStr = CycleEngine.addDays(startDateStr, i);
      const existing = profileData.days[nextDateStr];

      // Eğer kullanıcı bizzat kapatmamışsa otomatik tahmini akış doldur
      if (!existing || (!existing.isManual && !existing.isPeriod)) {
        let autoFlow = 'medium';
        if (i === 1) autoFlow = 'heavy';
        else if (i === periodDays - 1) autoFlow = 'light';
        else if (i >= periodDays - 2) autoFlow = 'medium';

        this.storage.saveDayData(nextDateStr, {
          isPeriod: true,
          flow: autoFlow,
          isManual: false,
          isPredicted: true
        });
      }
    }

    this.syncSettingsFromCalendarData();
    return this.calculateStats();
  }

  /**
   * Belirli bir günü manuel olarak regl yap, kaldır veya sil.
   * Model bu müdahaleden sonra anında kendini günceller.
   */
  togglePeriodDay(dateStr, isPeriod, flow = 'medium') {
    if (isPeriod) {
      this.storage.saveDayData(dateStr, {
        isPeriod: true,
        flow: flow || 'medium',
        isManual: true,
        isPredicted: false
      });
    } else {
      // Manuel olarak silindiğini kaydet
      this.storage.saveDayData(dateStr, {
        isPeriod: false,
        flow: null,
        isManual: true,
        isPredicted: false
      });
    }
 
    this.syncSettingsFromCalendarData();
    return this.calculateStats();
  }

  // --- İleriye Dönük Döngü ve Faz Projeksiyonları ---
  /**
   * Gelecek N döngüyü ve her döngünün ovülasyon, doğurganlık ve PMS günlerini hesaplar.
   */
  getProjections(monthsAhead = 6) {
    const stats = this.calculateStats();
    const lastPeriod = stats.lastPeriod;

    if (!lastPeriod) {
      return [];
    }

    const projections = [];
    let currentStart = lastPeriod.startDate;
    const today = CycleEngine.formatDateStr(new Date());

    // İleriye doğru hesapla
    for (let c = 0; c < monthsAhead; c++) {
      const nextStart = CycleEngine.addDays(currentStart, stats.averageCycleLength);
      const nextEnd = CycleEngine.addDays(nextStart, stats.averagePeriodLength - 1);
      
      // Yumurtlama: Bir sonraki regl başlangıcından luteal faz (genelde 14 gün) öncesi
      const ovulationDate = CycleEngine.addDays(nextStart, -stats.lutealLength);
      
      // Doğurganlık penceresi: Ovülasyondan 5 gün önce başlar, 1 gün sonra biter
      const fertileStart = CycleEngine.addDays(ovulationDate, -5);
      const fertileEnd = CycleEngine.addDays(ovulationDate, 1);

      // PMS Dönemi: Yeni regl başlangıcından 6 gün önce
      const pmsStart = CycleEngine.addDays(nextStart, -6);
      const pmsEnd = CycleEngine.addDays(nextStart, -1);

      projections.push({
        cycleIndex: c + 1,
        periodStart: nextStart,
        periodEnd: nextEnd,
        ovulationDate: ovulationDate,
        fertileStart: fertileStart,
        fertileEnd: fertileEnd,
        pmsStart: pmsStart,
        pmsEnd: pmsEnd,
        cycleLength: stats.averageCycleLength,
        periodLength: stats.averagePeriodLength
      });

      currentStart = nextStart;
    }

    return projections;
  }

  // --- Belirli Bir Günün Analiz ve Durumu (Day Inspector) ---
  getDayStatus(dateStr) {
    const stats = this.calculateStats();
    const profileData = this.storage.getProfileData();
    const dayData = profileData.days[dateStr] || null;
    const todayStr = CycleEngine.formatDateStr(new Date());

    // 1. Kullanıcı kaydı varsa
    if (dayData && dayData.isPeriod) {
      return {
        dateStr,
        phase: 'period',
        phaseName: 'Regl Dönemi',
        phaseBadge: 'Regl',
        color: '#f43f5e',
        flow: dayData.flow || 'medium',
        isManual: !!dayData.isManual,
        isPredicted: !!dayData.isPredicted,
        pregnancyChance: 'Çok Düşük',
        description: 'Döngünüzün başlangıç ve kanama evresi.',
        dayData
      };
    }

    // 2. Tahmin ve Projeksiyonları İncele
    const projections = this.getProjections(12);
    const lastPeriod = stats.lastPeriod;

    // Eğer geçmiş bir regl döneminin içinde veya güncel döngünün içindeyse
    if (lastPeriod) {
      const daysSinceStart = CycleEngine.diffDays(dateStr, lastPeriod.startDate);
      
      // Son dönemin ovülasyon ve doğurganlık tarihleri
      const expectedNext = CycleEngine.addDays(lastPeriod.startDate, stats.averageCycleLength);
      const currentOvulation = CycleEngine.addDays(expectedNext, -stats.lutealLength);
      const currentFertileStart = CycleEngine.addDays(currentOvulation, -5);
      const currentFertileEnd = CycleEngine.addDays(currentOvulation, 1);
      const currentPmsStart = CycleEngine.addDays(expectedNext, -6);
      const currentPmsEnd = CycleEngine.addDays(expectedNext, -1);

      // Güncel döngü ovülasyonu kontrolü
      if (dateStr === currentOvulation) {
        return {
          dateStr,
          phase: 'ovulation',
          phaseName: 'Yumurtlama Günü (Ovülasyon)',
          phaseBadge: 'Ovülasyon',
          color: '#eab308',
          pregnancyChance: 'En Yüksek (Zirve)',
          description: 'Gebe kalma ihtimalinin en yüksek olduğu gün.',
          dayData
        };
      }

      // Doğurganlık penceresi kontrolü
      if (dateStr >= currentFertileStart && dateStr <= currentFertileEnd) {
        return {
          dateStr,
          phase: 'fertile',
          phaseName: 'Doğurganlık Penceresi',
          phaseBadge: 'Doğurgan',
          color: '#a855f7',
          pregnancyChance: 'Yüksek',
          description: 'Doğurganlık şansının yüksek olduğu verimli günler.',
          dayData
        };
      }

      // PMS kontrolü
      if (dateStr >= currentPmsStart && dateStr <= currentPmsEnd) {
        return {
          dateStr,
          phase: 'pms',
          phaseName: 'PMS (Regl Öncesi)',
          phaseBadge: 'PMS',
          color: '#fb923c',
          pregnancyChance: 'Düşük',
          description: 'Duygusal ve fiziksel belirtilerin yaşanabildiği dönem.',
          dayData
        };
      }
    }

    // İleriye dönük projeksiyonlarda kontrol et
    for (const proj of projections) {
      if (dateStr >= proj.periodStart && dateStr <= proj.periodEnd) {
        return {
          dateStr,
          phase: 'predicted_period',
          phaseName: 'Tahmini Regl',
          phaseBadge: 'Tahmini Regl',
          color: '#fb7185',
          isPredicted: true,
          pregnancyChance: 'Düşük',
          description: 'Modelin tahmin ettiği sonraki döngü başlangıcı.',
          dayData
        };
      }

      if (dateStr === proj.ovulationDate) {
        return {
          dateStr,
          phase: 'ovulation',
          phaseName: 'Tahmini Yumurtlama',
          phaseBadge: 'Ovülasyon',
          color: '#eab308',
          pregnancyChance: 'En Yüksek (Zirve)',
          description: 'Tahmini ovülasyon günü.',
          dayData
        };
      }

      if (dateStr >= proj.fertileStart && dateStr <= proj.fertileEnd) {
        return {
          dateStr,
          phase: 'fertile',
          phaseName: 'Tahmini Doğurganlık',
          phaseBadge: 'Doğurgan',
          color: '#a855f7',
          pregnancyChance: 'Yüksek',
          description: 'Tahmini doğurganlık günleri.',
          dayData
        };
      }

      if (dateStr >= proj.pmsStart && dateStr <= proj.pmsEnd) {
        return {
          dateStr,
          phase: 'pms',
          phaseName: 'Tahmini PMS',
          phaseBadge: 'PMS',
          color: '#fb923c',
          pregnancyChance: 'Düşük',
          description: 'Tahmini regl öncesi dönem.',
          dayData
        };
      }
    }

    // Normal / Foliküler ya da Luteal
    return {
      dateStr,
      phase: 'normal',
      phaseName: 'Normal Gün',
      phaseBadge: 'Döngü',
      color: '#94a3b8',
      pregnancyChance: 'Düşük',
      description: 'Stabil hormon dengesi dönemi.',
      dayData
    };
  }

  // --- Bugünün Özet Durumu (Home Screen Widget) ---
  getTodaySummary() {
    const todayStr = CycleEngine.formatDateStr(new Date());
    const stats = this.calculateStats();
    const dayStatus = this.getDayStatus(todayStr);

    let cycleDayNumber = 1;
    let daysUntilNext = null;
    let nextPeriodDate = null;

    if (stats.lastPeriod) {
      const daysDiff = CycleEngine.diffDays(todayStr, stats.lastPeriod.startDate);
      cycleDayNumber = Math.max(1, daysDiff + 1);

      nextPeriodDate = CycleEngine.addDays(stats.lastPeriod.startDate, stats.averageCycleLength);
      daysUntilNext = CycleEngine.diffDays(nextPeriodDate, todayStr);
    }

    return {
      todayStr,
      cycleDayNumber,
      daysUntilNext,
      nextPeriodDate,
      dayStatus,
      stats
    };
  }
}


/**
 * Döngüm - Akıllı Takvim ve Gün Yönetim Bileşeni
 * Ay ve hafta bazlı interaktif takvim, faz göstergeleri,
 * semptom/ruh hali ve hızlı regl başlatma/silme arayüzü
 */




class CalendarComponent {
  constructor(containerEl, engine, storage, onDataChanged) {
    this.container = containerEl;
    this.engine = engine;
    this.storage = storage;
    this.onDataChanged = onDataChanged;

    const today = new Date();
    this.currentYear = today.getFullYear();
    this.currentMonth = today.getMonth(); // 0-indexed

      { id: 'happy', label: 'Mutlu', icon: '😊' },
      { id: 'calm', label: 'Sakin', icon: '😌' },
      { id: 'energetic', label: 'Enerjik', icon: '⚡' },
      { id: 'sensitive', label: 'Duygusal', icon: '🥺' },
      { id: 'irritated', label: 'Gergin', icon: '😤' },
      { id: 'tired', label: 'Yorgun', icon: '🥱' },
      { id: 'sad', label: 'Hüzünlü', icon: '😢' },

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#380410" />
    </radialGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Arka Plan Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- 4 Fazlı Döngü Halkası (Rose, Teal, Amber, Purple) -->
  <g filter="url(#shadowGlow)" transform="translate(256, 256)">
    <!-- 1. Menstrüasyon / Regl Fazı (Rose) -->
    <path d="M 14 -142 A 142 142 0 0 1 142 -14" fill="none" stroke="#f43f5e" stroke-width="40" stroke-linecap="round" />
    <!-- 2. Foliküler Faz (Teal) -->
    <path d="M 142 14 A 142 142 0 0 1 14 142" fill="none" stroke="#0d9488" stroke-width="40" stroke-linecap="round" />
    <!-- 3. Ovulasyon / Doğurgan Faz (Amber Altın) -->
    <path d="M -14 142 A 142 142 0 0 1 -142 14" fill="none" stroke="#f59e0b" stroke-width="40" stroke-linecap="round" />
    <!-- 4. Luteal / PMS Fazı (Lavanta Mor) -->
    <path d="M -142 -14 A 142 142 0 0 1 -14 -142" fill="none" stroke="#a855f7" stroke-width="40" stroke-linecap="round" />
  </g>

  <!-- Merkez Damla -->
  <g filter="url(#shadowGlow)">
    <circle cx="256" cy="265" r="50" fill="#f43f5e" opacity="0.3" />
    <path d="M 256 182 C 256 182, 308 248, 308 285 C 308 318, 285 342, 256 342 C 227 342, 204 318, 204 285 C 204 248, 256 182, 256 182 Z" fill="url(#dropGrad)" />
    <!-- Işık Yansıması -->
    <ellipse cx="240" cy="275" rx="9" ry="16" transform="rotate(-25 240 275)" fill="#ffffff" opacity="0.85" />
  </g>
</svg>

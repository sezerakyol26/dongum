<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
  </defs>

  <!-- Arka Plan Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- 4 Fazlı Regl Döngüsü Halkası (Cycle Ring) -->
  <g filter="url(#dropShadow)" transform="translate(256,256)">
    <!-- 1. Regl Fazı Yayı (Rose / Kırmızı) -->
    <path d="M 12 -145 A 145 145 0 0 1 145 -12" fill="none" stroke="#fb7185" stroke-width="40" stroke-linecap="round" />
    <!-- 2. Foliküler Faz Yayı (Teal / Zümrüt) -->
    <path d="M 145 12 A 145 145 0 0 1 12 145" fill="none" stroke="#2dd4bf" stroke-width="40" stroke-linecap="round" />
    <!-- 3. Ovulasyon Fazı Yayı (Altın / Kehribar) -->
    <path d="M -12 145 A 145 145 0 0 1 -145 12" fill="none" stroke="#fbbf24" stroke-width="40" stroke-linecap="round" />
    <!-- 4. Luteal Faz Yayı (Lavanta / Mor) -->
    <path d="M -145 -12 A 145 145 0 0 1 -12 -145" fill="none" stroke="#c084fc" stroke-width="40" stroke-linecap="round" />
  </g>

  <!-- Merkez Işıltılı Biyolojik Damla -->
  <g filter="url(#glow)">
    <circle cx="256" cy="265" r="55" fill="#fb7185" opacity="0.35" filter="blur(14px)" />
    <path d="M256 182 C256 182, 308 248, 308 285 C308 318, 285 342, 256 342 C227 342, 204 318, 204 285 C204 248, 256 182, 256 182 Z" fill="url(#dropGrad)" />
    <!-- Damla Işık Yansıması -->
    <ellipse cx="240" cy="275" rx="10" ry="18" transform="rotate(-25 240 275)" fill="#ffffff" opacity="0.85" />
  </g>
</svg>

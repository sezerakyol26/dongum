<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Döngüm - Regl Takibi & Sağlık Modelleme</title>
  <meta name="description" content="Kişisel verilerinizle optimize olan, gerçekçi biyolojik modelleme ve tahminleme yapan, %100 gizlilik odaklı modern regl takibi mobil uygulaması.">
  
  <!-- PWA & Mobil Uyumluluk -->
  <meta name="theme-color" content="#f43f5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Döngüm">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">

  <style>
/* ==========================================================================
   DÖNGÜM - TASARIM SİSTEMİ VE STİLLER (MODERN WELLNESS & HEALTH AESTHETIC)
   ========================================================================== */

:root {
  /* Renk Paleti - Aydınlık Mod */
  --primary: #f43f5e;
  --primary-hover: #e11d48;
  --primary-light: #fff1f2;
  --primary-border: #fecdd3;
  --primary-gradient: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
  
  --secondary: #8b5cf6;
  --secondary-light: #f5f3ff;
  --secondary-gradient: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);

  --ovulation: #f59e0b;
  --ovulation-light: #fef3c7;
  --fertile: #a855f7;
  --fertile-light: #faf5ff;
  --pms: #f97316;
  --pms-light: #fff7ed;

  --success: #10b981;
  --success-light: #ecfdf5;
  --danger: #ef4444;

  --bg-page: #faf7f8;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #ffffff;
  --bg-input: #f8fafc;

  --text-main: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;

  --border-subtle: rgba(226, 232, 240, 0.8);
  --border-card: rgba(244, 63, 94, 0.12);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 8px 24px rgba(244, 63, 94, 0.08);
  --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.08);

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Karanlık Mod Değişkenleri */
body.dark-theme {
  --bg-page: #0f172a;
  --bg-surface: #1e293b;
  --bg-surface-elevated: #334155;
  --bg-input: #1e293b;

  --text-main: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #64748b;

  --border-subtle: #334155;
  --border-card: rgba(244, 63, 94, 0.25);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.6);
}

/* Genel Sıfırlamalar */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-family);
  background-color: var(--bg-page);
  color: var(--text-main);
  overflow-x: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 480px; /* Telefon görünümü için optimize sınır */
  margin: 0 auto;
  position: relative;
  background-color: var(--bg-surface);
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
}

/* Üst Başlık (Header) */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background-color: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
}

body.dark-theme .app-header {
  background-color: rgba(30, 41, 59, 0.85);
}

.app-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-logo-badge {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  background: var(--primary-gradient);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
}

.app-titles {
  display: flex;
  flex-direction: column;
}

.app-title {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-main);
}

.app-profile-tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--primary);
  background-color: var(--primary-light);
  padding: 2px 8px;
  border-radius: var(--radius-full);
  display: inline-block;
  width: fit-content;
  margin-top: 2px;
}

body.dark-theme .app-profile-tag {
  background-color: rgba(244, 63, 94, 0.2);
}

.app-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-action-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}

.header-action-btn:hover {
  background-color: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary-border);
}

/* Ana İçerik Taşıyıcısı */
.app-content-container {
  flex: 1;
  padding: 16px 18px 90px 18px; /* Alt navigasyon payı */
  overflow-y: auto;
}

/* Alt Navigasyon Barı */
.bottom-nav-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 64px;
  background-color: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 50;
  padding: 0 6px;
}

body.dark-theme .bottom-nav-bar {
  background-color: rgba(30, 41, 59, 0.92);
}

.nav-tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px 0;
  transition: var(--transition);
}

.nav-tab-btn .nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 3px;
  transition: var(--transition);
}

.nav-tab-btn .nav-label {
  font-size: 0.72rem;
  font-weight: 500;
}

.nav-tab-btn.active {
  color: var(--primary);
}

.nav-tab-btn.active .nav-icon {
  transform: scale(1.12);
}

/* ==========================================================================
   1. GÜNÜM TAB (ÇOK RENKLİ DÖNGÜ ÇARKI VE DETAYLAR)
   ========================================================================== */
.home-view-wrapper {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Çevrimdışı / Çevrimiçi Durum & Hızlı Eşleme Çubuğu */
.sync-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
}

.status-online-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  font-weight: 600;
  color: #10b981;
}

.online-pulse-dot {
  width: 7px;
  height: 7px;
  background-color: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
  animation: pulseGreen 2s infinite ease-in-out;
}

@keyframes pulseGreen {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
}

.btn-quick-sync {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}

.btn-quick-sync:hover {
  color: var(--primary);
}

/* Çok Renkli Segmentli Döngü Çarkı */
.cycle-dial-container-segmented {
  position: relative;
  width: 270px;
  height: 270px;
  margin: 6px auto 2px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cycle-svg-segmented {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.dial-center-box {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 2;
  padding: 8px;
}

.dial-sub-title {
  font-size: 0.74rem;
  font-weight: 700;
  color: #f43f5e;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.dial-big-day {
  display: flex;
  align-items: baseline;
  justify-content: center;
  margin: 2px 0 0 0;
}

.dial-big-day .day-val {
  font-size: 2.85rem;
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1;
  color: var(--text-main);
}

.dial-big-day .day-total {
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-left: 1px;
}

.dial-phase-text {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-main);
  margin-top: 3px;
}

.dial-fertility-pill {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: var(--radius-full);
  margin-top: 5px;
}

.pill-ovulasyon {
  background-color: #fffbeb;
  color: #d97706;
  border: 1px solid #fde68a;
}

.pill-regl {
  background-color: #fff1f2;
  color: #e11d48;
  border: 1px solid #fecdd3;
}

.pill-folikuler {
  background-color: #f0fdfa;
  color: #0d9488;
  border: 1px solid #99f6e4;
}

.pill-luteal {
  background-color: #faf5ff;
  color: #9333ea;
  border: 1px solid #e9d5ff;
}

.dial-countdown-text {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 5px;
}

.dial-countdown-text strong {
  color: var(--text-main);
  font-weight: 700;
}

/* Çark Altı Evre Açıklamaları (Legend) */
.dial-legend-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  padding: 0 4px;
}

.legend-pill-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.73rem;
  font-weight: 600;
  color: var(--text-secondary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 4px 9px;
  border-radius: var(--radius-full);
  white-space: nowrap;
}

.legend-circle {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

/* Eşleme Modalı */
.sync-textarea {
  font-family: monospace;
  font-size: 0.75rem;
  resize: vertical;
  min-height: 80px;
  background-color: var(--bg-page);
  word-break: break-all;
}

/* Hızlı Aksiyon Kartı */
.quick-action-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  padding: 16px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  gap: 12px;
}

.qa-text h4 {
  font-size: 0.98rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.qa-text p {
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.3;
}

.btn-quick-period {
  background: var(--primary-gradient);
  color: white;
  border: none;
  font-size: 0.88rem;
  font-weight: 600;
  padding: 12px 18px;
  border-radius: var(--radius-full);
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
  transition: var(--transition);
}

.btn-quick-period:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(244, 63, 94, 0.4);
}

.btn-quick-period.btn-active-period {
  background: var(--bg-surface-elevated);
  color: var(--primary);
  border: 2px solid var(--primary);
  box-shadow: none;
}

/* Günlük Öngörü Kartı */
.daily-insight-card {
  background: linear-gradient(145deg, var(--bg-surface), var(--primary-light));
  border: 1px solid var(--primary-border);
  padding: 18px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

body.dark-theme .daily-insight-card {
  background: linear-gradient(145deg, var(--bg-surface), rgba(244, 63, 94, 0.1));
}

.insight-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.insight-item {
  display: flex;
  flex-direction: column;
}

.ins-title {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
}

.ins-val {
  font-size: 1.05rem;
  font-weight: 700;
  margin-top: 2px;
}

.insight-divider {
  width: 1px;
  height: 36px;
  background-color: var(--border-subtle);
}

.insight-advice {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.45;
  border-top: 1px solid var(--border-subtle);
  padding-top: 10px;
}

/* Semptom Ekle Butonu */
.btn-log-symptoms {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  border-radius: var(--radius-md);
  border: 1px dashed var(--primary);
  background-color: var(--primary-light);
  color: var(--primary);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

body.dark-theme .btn-log-symptoms {
  background-color: rgba(244, 63, 94, 0.15);
}

.btn-log-symptoms:hover {
  background-color: var(--primary);
  color: white;
  border-style: solid;
}

/* ==========================================================================
   2. TAKVİM (CALENDAR COMPONENT)
   ========================================================================== */
.calendar-wrapper {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
}

.calendar-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.calendar-title {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.cal-today-btn {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  background-color: var(--primary-light);
  color: var(--primary);
  border: 1px solid var(--primary-border);
  cursor: pointer;
}

.calendar-nav-buttons {
  display: flex;
  gap: 6px;
}

.cal-nav-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}

.cal-nav-btn:hover {
  color: var(--primary);
  border-color: var(--primary);
}

/* Legend */
.calendar-legend {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background-color: var(--bg-page);
  border-radius: var(--radius-sm);
  font-size: 0.72rem;
  color: var(--text-secondary);
  overflow-x: auto;
  gap: 10px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.dot-period { background-color: var(--primary); }
.dot-predicted { background-color: #fb7185; border: 1px dashed var(--primary); }
.dot-ovulation { background-color: var(--ovulation); }
.dot-fertile { background-color: var(--fertile); }
.dot-pms { background-color: var(--pms); }

/* Hafta Günleri */
.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  padding-bottom: 4px;
}

/* Gün Izgarası */
.calendar-days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.cal-day-cell {
  position: relative;
  min-height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  background-color: var(--bg-surface);
  border: 1px solid transparent;
  cursor: pointer;
  transition: var(--transition);
}

.cal-day-cell:hover {
  border-color: var(--primary-border);
}

.cal-day-cell.empty-day {
  background: transparent;
  cursor: default;
}

.cal-day-cell .day-number {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-main);
  z-index: 2;
}

.cal-day-cell.is-today {
  border-color: var(--primary);
  font-weight: 800;
}

.cal-day-cell.selected-cell {
  box-shadow: 0 0 0 2px var(--primary);
}

/* Faz Arka Planları */
.cal-day-cell.phase-period {
  background-color: rgba(244, 63, 94, 0.15);
  color: var(--primary);
}

.cal-day-cell.phase-predicted-period {
  background-color: rgba(251, 113, 133, 0.1);
  border: 1px dashed rgba(244, 63, 94, 0.4);
}

.cal-day-cell.phase-ovulation {
  background-color: rgba(245, 158, 11, 0.18);
  font-weight: 700;
}

.cal-day-cell.phase-fertile {
  background-color: rgba(168, 85, 247, 0.12);
}

.cal-day-cell.phase-pms {
  background-color: rgba(249, 115, 22, 0.12);
}

.day-indicators {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-top: 2px;
  height: 6px;
}

.indicator-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.period-dot { background-color: var(--primary); }
.predicted-dot { background-color: #fb7185; }
.ovulation-dot { background-color: var(--ovulation); }
.fertile-dot { background-color: var(--fertile); }
.pms-dot { background-color: var(--pms); }
.indicator-badge { font-size: 7px; color: var(--secondary); margin-left: 1px; }

/* ==========================================================================
   GÜN DETAYI & DÜZENLEME MODALI (BOTTOM SHEET)
   ========================================================================== */
.day-modal-overlay,
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.day-modal-overlay.active,
.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.day-modal-sheet {
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  background-color: var(--bg-surface);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  padding: 14px 0 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1001;
}

.day-modal-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px 16px 20px;
}

.modal-sheet {
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  background-color: var(--bg-surface);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  padding: 16px 20px 30px 20px;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.day-modal-overlay.active .day-modal-sheet,

.modal-drag-handle {

.modal-date-title {

.modal-close-btn {

.modal-close-btn:hover {

/* Faz Banner */

.phase-bg-period { background-color: var(--primary-light); border-color: var(--primary-border); }

.phase-bg-ovulation { background-color: var(--ovulation-light); border-color: #fde68a; }
.phase-bg-fertile { background-color: var(--fertile-light); border-color: #e9d5ff; }
.phase-bg-pms { background-color: var(--pms-light); border-color: #fed7aa; }

.phase-banner-info h4 {
  font-size: 0.95rem;
  font-weight: 700;
  margin: 2px 0;
}

.phase-banner-info p {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.phase-tag {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--primary);
}

.pregnancy-badge {
  text-align: right;
  display: flex;
  flex-direction: column;
}

.preg-label {
  font-size: 0.68rem;
  color: var(--text-muted);
}

.pregnancy-badge strong {
  font-size: 0.88rem;
  color: var(--text-main);
}

/* Modal Bölümleri */
.modal-section {
  margin-bottom: 18px;
}

.section-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 8px;
}

/* Regl Kontrolü */
.period-control-section {
  background-color: var(--bg-input);
  padding: 14px;
  border-radius: var(--radius-md);

}

.period-toggle-row {
  display: flex;
  gap: 10px;
}

.btn-period-toggle {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.btn-period-toggle.active-period {

  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
}

.btn-period-delete {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid #fecaca;
  background-color: #fff1f2;
  color: #ef4444;
  font-size: 0.82rem;
  font-weight: 600;

  transition: var(--transition);
}

.btn-period-delete:hover {
  background-color: #ef4444;
  color: white;
}

.period-calc-hint {
  font-size: 0.74rem;
  color: var(--text-muted);
  margin-top: 8px;
  line-height: 1.35;
}

/* Akış Yoğunluğu Seçici */
.flow-selector {
  margin-top: 12px;
  padding-top: 10px;

}

.flow-selector.disabled-flow {

  pointer-events: none;
}

.flow-label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.flow-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.flow-btn {
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);

  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: var(--transition);
}

.flow-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.f-spotting { background-color: #fda4af; }
.f-light { background-color: #fb7185; }
.f-medium { background-color: #f43f5e; }
.f-heavy { background-color: #be123c; }

.flow-btn.selected {
  border-color: var(--primary);
  background-color: var(--primary-light);
  color: var(--primary);
  font-weight: 700;
}

/* Chips Izgarası (Semptom & Ruh Hali) */
.chips-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.chip-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
}

.chip-item:hover {
  border-color: var(--primary-border);
}

.chip-item.chip-active {
  background-color: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}

body.dark-theme .chip-item.chip-active {
  background-color: rgba(244, 63, 94, 0.2);
}

.chips-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip-pill {
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  font-size: 0.78rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.chip-pill.chip-active {
  background-color: var(--secondary-light);
  border-color: var(--secondary);
  color: var(--secondary);
  font-weight: 600;
}

.notes-textarea {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-input);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.85rem;
  resize: vertical;
}

.modal-actions-bar {
  flex-shrink: 0;
  width: 100%;

  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);

  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.08);
}

.btn-primary-action {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px;
  border-radius: var(--radius-md);
  background: var(--primary-gradient);
  color: white;
  border: none;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
  transition: var(--transition);
}

.btn-primary-action:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

/* ==========================================================================
   3. ANALİZ SEKMESİ (ANALYTICS)
   ========================================================================== */
.analytics-wrapper {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-heading {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.section-subheading {
  font-size: 0.82rem;
  color: var(--text-muted);

}

.stats-overview-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat-card {

  flex-direction: column;

}

}

.stat-icon-wrap {

}

.stat-label {
  font-size: 0.72rem;

}

.stat-value-group {
  display: flex;
  align-items: center;

}

.stat-number {

  letter-spacing: -0.5px;

}

.stat-number small {
  font-size: 0.85rem;

}

.stat-badge {

.badge-good { background-color: var(--success-light); color: var(--success); }

.stat-desc {

}

.analysis-section-box {
  background-color: var(--bg-surface);

}

.box-title {

}

.box-subtitle {

/* Gelecek Tahminleri */
.projections-timeline {

}

}

.proj-badge {
  font-size: 0.75rem;

}

.proj-content {

  gap: 2px;
}

.proj-item {
  font-size: 0.8rem;

}

.p-label {
  color: var(--text-muted);

}

.btn-goto-date {
  background: none;
  border: none;
  color: var(--text-secondary);

  padding: 6px;
  border-radius: var(--radius-full);

}

.btn-goto-date:hover {
  background-color: var(--primary-light);
  color: var(--primary);
}

/* Semptom Barları */
.symptom-bars-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.symptom-bar-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  margin-bottom: 4px;
}

.symptom-progress-track {
  width: 100%;
  height: 8px;
  background-color: var(--bg-page);
  border-radius: var(--radius-full);

}

.symptom-progress-fill {
  height: 100%;
  background: var(--primary-gradient);
  border-radius: var(--radius-full);
}

/* Döngü Geçmişi Listesi */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.history-card {
  padding: 12px 14px;

  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.history-card-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

.history-index {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--primary);
}

.history-duration {
  font-size: 0.78rem;
  font-weight: 600;

}

.history-card-body {

}

.history-dates {

  color: var(--text-secondary);
  gap: 2px;
}

.btn-history-view {
  background: none;
  border: 1px solid var(--border-subtle);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;

.btn-history-view:hover {

.empty-state-notice {

}

  gap: 12px;

}

.box-icon {

  background-color: var(--bg-page);

}

.box-text h3 {

}

.box-text p {

}

.setting-input-row {

  gap: 6px;

}

.setting-input-row label {

}

.form-input {

  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-input);

  font-size: 0.9rem;
}

.btn-save-settings {

  padding: 10px;

  border: 1px solid var(--primary-border);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;

.pin-status-row {

}

.set-pin-group {

}

.pin-input-field {

}

.btn-danger-outline {

}

.backup-buttons-row {

  gap: 10px;
}

.btn-backup {

.btn-upload-label {

.danger-box {

.btn-danger-full {

  box-shadow: 0 2px 8px rgba(244, 63, 94, 0.15);

.chip-emoji {

}

.chip-name {

.profile-card-name-row {

.profile-lock-tag {

.profile-card-meta {

.profile-card-actions {

.btn-card-action {

/* ==========================================================================
   YAZDIRMA / PDF DÜZENİ (@MEDIA PRINT)
   ========================================================================== */
@media print {
  /* Sayfa dışı her şeyi gizle */
  body * {
    visibility: hidden !important;
  }

  /* Sadece rapor belgesi ve içeriğini göster */
  #doctorReportModalOverlay,
  #doctorReportModalOverlay * {
    visibility: visible !important;
  }

  #doctorReportModalOverlay {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: auto !important;
    background: #ffffff !important;
    padding: 0 !important;
    margin: 0 !important;
    backdrop-filter: none !important;
    display: block !important;
    opacity: 1 !important;
  }

  .doctor-modal-window {
    box-shadow: none !important;
    border-radius: 0 !important;
    max-width: 100% !important;
    max-height: none !important;
    background: #ffffff !important;
    display: block !important;
    overflow: visible !important;
  }

  .dr-paper-container {
    padding: 0 !important;
    overflow: visible !important;
    display: block !important;
  }

  .doctor-report-document {
    box-shadow: none !important;
    border-radius: 0 !important;
    max-width: 100% !important;
    padding: 10mm 15mm !important;
    margin: 0 !important;
  }

  /* Yazdırma sırasında gereksiz butonları gizle */
  .no-print,
  .dr-modal-actions-bar,
  .bottom-nav-bar,
  .app-header {
    display: none !important;
  }

  /* Sayfa bölünme kuralları */
  .dr-metrics-table,
  .dr-cycles-table,
  .dr-symptoms-layout,
  .dr-doctor-notes-box {
    page-break-inside: avoid !important;
  }
}

/* ==========================================================================
   GİRİŞ / PROFİL SEÇİMİ VE PIN KİLİT EKRANI (APP LOGIN SCREEN)
   ========================================================================== */
.app-login-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background-color: var(--bg-body);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  backdrop-filter: blur(12px);
}

.app-login-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.login-card-container {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 28px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
  width: 100%;
  max-width: 420px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 28px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: loginCardSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes loginCardSlideUp {
  from {
    opacity: 0;
    transform: translateY(24px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.login-brand-logo-wrap {
  width: 72px;
  height: 72px;
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(244, 63, 94, 0.12) 0%, rgba(13, 148, 136, 0.12) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(244, 63, 94, 0.15);
  margin-bottom: 12px;
}

.login-brand-logo-img {
  width: 54px;
  height: 54px;
  object-fit: contain;
}

.login-brand-title {
  font-size: 1.65rem;
  font-weight: 800;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
  margin-bottom: 2px;
}

.login-brand-subtitle {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-bottom: 22px;
}

.login-step-view {
  width: 100%;
}

.login-step-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 14px;
  text-align: left;
}

.login-profiles-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  margin-bottom: 16px;
}

.login-profile-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-subtle);
  background-color: var(--bg-card);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  text-align: left;
}

.login-profile-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
}

.login-profile-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.login-profile-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  background-color: var(--bg-surface);
  border: 2px solid var(--primary);
  flex-shrink: 0;
}

.login-profile-names {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.login-profile-name {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-primary);
}

.login-profile-role {
  font-size: 0.72rem;
  color: var(--text-muted);
}

.login-profile-meta {
  display: flex;
  align-items: center;
  gap: 6px;
}

.login-lock-badge {
  font-size: 0.8rem;
  background: #fef3c7;
  color: #b45309;
  padding: 3px 6px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
}

.login-btn-new-profile {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1.5px dashed var(--primary-border);
  background-color: var(--primary-light);
  color: var(--primary);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.login-btn-new-profile:hover {
  background-color: rgba(244, 63, 94, 0.15);
  transform: translateY(-1px);
}

.login-back-btn {
  align-self: flex-start;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0;
}

.login-back-btn:hover {
  color: var(--text-primary);
}

.login-target-profile-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}

.login-target-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.7rem;
  border: 3px solid var(--primary);
  background: var(--bg-surface);
}

.login-target-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
}

.login-target-hint {
  font-size: 0.78rem;
  color: var(--text-muted);
}

/* Çentik (Notch) ve Alt Çubuk (Home Indicator) Güvenli Alanları (iOS / Android) */
@supports (padding-top: env(safe-area-inset-top)) {
  .app-header {
    padding-top: max(14px, env(safe-area-inset-top));
  }

  .bottom-nav-bar {
    padding-bottom: max(6px, env(safe-area-inset-bottom));
    height: calc(64px + env(safe-area-inset-bottom));
  }

  .app-content-container {
    padding-bottom: calc(85px + env(safe-area-inset-bottom));
  }

  .day-modal-sheet {
    padding-bottom: 0 !important;
  }

  .modal-sheet:not(.day-modal-sheet) {
    padding-bottom: calc(45px + env(safe-area-inset-bottom));
  }
}

/* Küçük Ekranlar (Örn: iPhone SE, 375px ve altı) */
@media (max-width: 380px) {
  .calendar-title {
    font-size: 1.1rem;
  }

  .cal-day-cell {
    min-height: 42px;
  }

  .cal-day-cell .day-number {
    font-size: 0.82rem;
  }

  .chips-grid {
    grid-template-columns: 1fr;
  }

  .cycle-dial-container {
    width: 220px;
    height: 220px;
  }

  .dial-day-number {
    font-size: 1.85rem;
  }
}

/* Geniş Ekranlar / Tablet / Masaüstü Uyumu */
@media (min-width: 600px) {
  body {
    background-color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  body.dark-theme {
    background-color: #0b1120;
  }

  #app {
    height: 92vh;
    border-radius: 36px;
    border: 8px solid #1e293b;
    overflow: hidden;
    margin: 20px auto;
  }

  .bottom-nav-bar {
    border-bottom-left-radius: 28px;
    border-bottom-right-radius: 28px;
  }

  .app-header {
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
  }
}

/* Dokunma Mikro-Etkileşimleri */
button:active {
  transform: scale(0.97);
  transition: transform 0.1s ease;
}

/* Pürüzsüz Kaydırma */
.app-content-container,
.day-modal-sheet,
.modal-sheet {
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {

  border-radius: 10px;
}

  { id: 'private', name: 'Gizli Kasa', badge: 'Şifreli Profil' },
  { id: 'family', name: 'Aile / Arkadaş', badge: 'Takip Hesabı' },
  { id: 'guest', name: 'Misafir / Danışan', badge: 'İkinci Hesap' }
];

const PROFILE_EMOJIS = ['🌸', '🌺', '🌙', '⭐', '🌿', '💎', '🦋', '🥑', '👑', '🦄', '🍓', '💜', '🎀', '🐱'];
const PROFILE_COLORS = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#6366f1', '#14b8a6'];

/**
 * Güvenli Depolama Adaptörü:
 * WhatsApp içi tarayıcı, iOS QuickLook veya özel gizli modlarda
 * localStorage erişimi engellenmiş olsa dahi uygulamanın çökmesini engeller.
 */
class SafeStorage {
  constructor() {
    this.memory = {};
    this.isAvailable = this.probe();
  }

  probe() {
    try {
      if (typeof window === 'undefined' || !window.localStorage) return false;
      const test = '__dongum_storage_probe__';
      window.localStorage.setItem(test, '1');
      window.localStorage.removeItem(test);
      return true;
    } catch (e) {
      console.warn('LocalStorage erişimi kısıtlı, güvenli bellek depolaması devrede:', e);
      return false;
    }
  }

  getItem(key) {
    if (this.isAvailable) {
      try {
        const val = window.localStorage.getItem(key);
        if (val !== null) return val;
      } catch (e) {
        // kısıtlı durum
      }
    }
    return this.memory[key] || null;
  }

  setItem(key, value) {
    const strVal = String(value);
    this.memory[key] = strVal;
    if (this.isAvailable) {
      try {
        window.localStorage.setItem(key, strVal);
      } catch (e) {
        // kota veya kısıtlama
      }
    }
  }

  removeItem(key) {
    delete this.memory[key];
    if (this.isAvailable) {
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        // hata yut
      }
    }
  }
}

const safeStorage = new SafeStorage();

class StorageManager {
  constructor() {
    this.init();
  }

  init() {
    // Profil listesi kontrolü
    let profiles = this.getProfiles();
    if (!profiles || profiles.length === 0) {
      const defaultProfile = {
        id: 'prof_' + Date.now(),
        name: 'Döngüm',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        createdAt: new Date().toISOString(),
        avatarColor: '#f43f5e',
        avatarEmoji: '🌸',
        pin: null,
        pinEnabled: false
      };
      profiles = [defaultProfile];
      this.saveProfiles(profiles);
      this.setActiveProfileId(defaultProfile.id);
      
      // İlk varsayılan profil verisi
      this.saveProfileData(defaultProfile.id, {
        settings: { ...DEFAULT_SETTINGS },
        days: {} // 'YYYY-MM-DD': { isPeriod, flow, symptoms, mood, notes, etc. }
      });
    } else {
      // Mevcut profillerin yeni alanlarını tamamla (Geriye dönük uyumluluk)
      let changed = false;
      profiles = profiles.map(p => {
        let pCopy = { ...p };
        if (!pCopy.avatarEmoji) {
          pCopy.avatarEmoji = '🌸';
          changed = true;
        }
        if (!pCopy.role) {
          pCopy.role = 'personal';
          pCopy.roleName = 'Kişisel Hesap';
          changed = true;
        }
        if (pCopy.pinEnabled === undefined) {
          pCopy.pinEnabled = false;
          pCopy.pin = null;
          changed = true;
        }
        return pCopy;
      });
      if (changed) {
        this.saveProfiles(profiles);
      }
    }

    // Aktif profil doğrula
    let activeId = this.getActiveProfileId();
    if (!activeId || !profiles.some(p => p.id === activeId)) {
      this.setActiveProfileId(profiles[0].id);
    }
  }

  // --- Profil & Hesap Yönetimi ---
  getProfiles() {
    try {
      const data = safeStorage.getItem(STORAGE_KEYS.PROFILES);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      console.error('Profiller okunamadı:', e);
      return [];
    }
  }

  saveProfiles(profiles) {
    safeStorage.setItem(STORAGE_KEYS.PROFILES, JSON.stringify(profiles));
  }

  getActiveProfileId() {
    return safeStorage.getItem(STORAGE_KEYS.ACTIVE_PROFILE);
  }

  setActiveProfileId(id) {
    safeStorage.setItem(STORAGE_KEYS.ACTIVE_PROFILE, id);
  }

  getActiveProfile() {
    const profiles = this.getProfiles();
    const activeId = this.getActiveProfileId();
    return profiles.find(p => p.id === activeId) || profiles[0];
  }

  getProfileById(id) {
    const profiles = this.getProfiles();
    return profiles.find(p => p.id === id) || null;
  }

  createProfile(optionsOrName, color = '#f43f5e') {
    let opts = {};
    if (typeof optionsOrName === 'string') {
      opts = {
        name: optionsOrName,
        avatarColor: color,
        avatarEmoji: '🌸',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        pin: null,
        pinEnabled: false,
        cycleLength: 28,
        periodLength: 5,
        lutealLength: 14
      };
    } else {
      opts = {
        name: 'Yeni Hesap',
        avatarColor: '#f43f5e',
        avatarEmoji: '🌸',
        role: 'personal',
        roleName: 'Kişisel Hesap',
        pin: null,
        pinEnabled: false,
        cycleLength: 28,
        periodLength: 5,
        lutealLength: 14,
        ...optionsOrName
      };
    }

    const profiles = this.getProfiles();
    const newProfile = {
      id: 'prof_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
      name: opts.name.trim() || 'Yeni Hesap',
      role: opts.role || 'personal',
      roleName: opts.roleName || (PROFILE_ROLES.find(r => r.id === opts.role)?.name || 'Hesap'),
      avatarColor: opts.avatarColor || '#f43f5e',
      avatarEmoji: opts.avatarEmoji || '🌸',
      pin: opts.pin ? String(opts.pin) : null,
      pinEnabled: !!(opts.pin && opts.pinEnabled),
      createdAt: new Date().toISOString()
    };

    profiles.push(newProfile);
    this.saveProfiles(profiles);

    // Yeni profil boş verisi ve ayarları
    const initialSettings = {
      ...DEFAULT_SETTINGS,
      cycleLength: parseInt(opts.cycleLength, 10) || 28,
      periodLength: parseInt(opts.periodLength, 10) || 5,
      lutealLength: parseInt(opts.lutealLength, 10) || 14,
      pin: newProfile.pin,
      pinEnabled: newProfile.pinEnabled
    };

    this.saveProfileData(newProfile.id, {
      settings: initialSettings,
      days: {}
    });

    return newProfile;
  }

  switchProfile(profileId) {
    const profiles = this.getProfiles();
    const target = profiles.find(p => p.id === profileId);
    if (target) {
      this.setActiveProfileId(profileId);
      return true;
    }
    return false;
  }

  deleteProfile(profileId) {
    let profiles = this.getProfiles();
    if (profiles.length <= 1) {
      return { success: false, message: 'En az bir aktif profil/hesap bulunmalıdır!' };
    }

    profiles = profiles.filter(p => p.id !== profileId);
    this.saveProfiles(profiles);
    safeStorage.removeItem(STORAGE_KEYS.DATA_PREFIX + profileId);

    if (this.getActiveProfileId() === profileId) {
      this.setActiveProfileId(profiles[0].id);
    }

    return { success: true };
  }

  updateProfile(profileId, updates = {}) {
    const profiles = this.getProfiles();
    const target = profiles.find(p => p.id === profileId);
    if (target) {
      if (updates.name !== undefined) target.name = updates.name.trim() || target.name;
      if (updates.avatarColor !== undefined) target.avatarColor = updates.avatarColor;
      if (updates.avatarEmoji !== undefined) target.avatarEmoji = updates.avatarEmoji;
      if (updates.role !== undefined) {
        target.role = updates.role;
        target.roleName = updates.roleName || (PROFILE_ROLES.find(r => r.id === updates.role)?.name || target.roleName);
      }
      if (updates.pin !== undefined) {
        target.pin = updates.pin ? String(updates.pin) : null;
        target.pinEnabled = !!(target.pin && (updates.pinEnabled !== false));
        // Settings içine de yansıt
        const profData = this.getProfileData(profileId);
        profData.settings.pin = target.pin;
        profData.settings.pinEnabled = target.pinEnabled;
        this.saveProfileData(profileId, profData);
      } else if (updates.pinEnabled !== undefined) {
        target.pinEnabled = updates.pinEnabled;
        const profData = this.getProfileData(profileId);
        profData.settings.pinEnabled = target.pinEnabled;
        this.saveProfileData(profileId, profData);
      }

      this.saveProfiles(profiles);
      return true;
    }
    return false;
  }

  // --- Profil Bazlı PIN Güvenliği ---
  isProfilePinRequired(profileId = null) {
    const p = profileId ? this.getProfileById(profileId) : this.getActiveProfile();
    return !!(p && p.pinEnabled && p.pin);
  }

  checkProfilePin(profileId, enteredPin) {
    const p = profileId ? this.getProfileById(profileId) : this.getActiveProfile();
    if (!p || !p.pinEnabled || !p.pin) return true;
    return String(p.pin) === String(enteredPin);
  }

  setProfilePin(profileId, pin) {
    if (!pin || pin.length !== 4) return false;
    return this.updateProfile(profileId || this.getActiveProfileId(), { pin: String(pin), pinEnabled: true });
  }

  disableProfilePin(profileId) {
    return this.updateProfile(profileId || this.getActiveProfileId(), { pin: null, pinEnabled: false });
  }

  // --- Aktif Profil Verileri ---
  getProfileData(profileId = null) {
    const id = profileId || this.getActiveProfileId();
    try {
      const raw = safeStorage.getItem(STORAGE_KEYS.DATA_PREFIX + id);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          settings: { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) },
          days: parsed.days || {}
        };
      }
    } catch (e) {
      console.error('Profil verisi okunamadı:', e);
    }
    return {
      settings: { ...DEFAULT_SETTINGS },
      days: {}
    };
  }

  saveProfileData(profileId, data) {
    const id = profileId || this.getActiveProfileId();
    try {
      safeStorage.setItem(STORAGE_KEYS.DATA_PREFIX + id, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error('Profil verisi kaydedilemedi:', e);
      return false;
    }
  }

  updateSettings(newSettings) {
    const data = this.getProfileData();
    data.settings = { ...data.settings, ...newSettings };
    this.saveProfileData(null, data);

    // Eğer PIN ayarı buradan güncellendiyse profile da senkronize et
    if (newSettings.pin !== undefined || newSettings.pinEnabled !== undefined) {
      const activeId = this.getActiveProfileId();
      this.updateProfile(activeId, {
        pin: data.settings.pin,
        pinEnabled: data.settings.pinEnabled
      });
    }

    return data.settings;
  }

  // --- Günlük Veri Kayıt & Silme ---
  getDayData(dateStr) {
    const data = this.getProfileData();
    return data.days[dateStr] || null;
  }

  saveDayData(dateStr, dayDetails) {
    const data = this.getProfileData();
    if (!data.days[dateStr]) {
      data.days[dateStr] = {};
    }
    data.days[dateStr] = {
      ...data.days[dateStr],
      ...dayDetails,
      updatedAt: new Date().toISOString()
    };
    this.saveProfileData(null, data);
    return data.days[dateStr];
  }

  deleteDayData(dateStr) {
    const data = this.getProfileData();
    if (data.days[dateStr]) {
      delete data.days[dateStr];
      this.saveProfileData(null, data);
      return true;
    }
    return false;
  }

  // Günün sadece regl kaydını sıfırlar / kaldırır
  clearPeriodForDay(dateStr) {
    const data = this.getProfileData();
    if (data.days[dateStr]) {
      data.days[dateStr].isPeriod = false;
      data.days[dateStr].flow = null;
      data.days[dateStr].isManual = true;
      this.saveProfileData(null, data);
      return true;
    }
    return false;
  }

  // Genel PIN uyumluluk metotları (app.js ile uyum)
  isPinRequired() {
    return this.isProfilePinRequired(this.getActiveProfileId());
  }

  checkPin(enteredPin) {
    return this.checkProfilePin(this.getActiveProfileId(), enteredPin);
  }

  setPin(pin) {
    return this.setProfilePin(this.getActiveProfileId(), pin);
  }

  disablePin() {
    return this.disableProfilePin(this.getActiveProfileId());
  }

  // --- Tekil Profil Dışa / İçe Aktar (Hesap Paylaşımı) ---
  exportSingleProfile(profileId = null) {
    const id = profileId || this.getActiveProfileId();
    const profile = this.getProfileById(id);
    const data = this.getProfileData(id);

    const payload = {
      format: 'dongum_single_account_v1',
      exportedAt: new Date().toISOString(),
      profile: profile,
      data: data
    };

    return JSON.stringify(payload, null, 2);
  }

  importSingleProfile(jsonString) {
    try {
      const payload = JSON.parse(jsonString);
      if (!payload || !payload.profile || !payload.data) {
        throw new Error('Geçersiz hesap aktarım formatı!');
      }

      const p = payload.profile;
      const newId = 'prof_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
      const newProfile = {
        ...p,
        id: newId,
        name: (p.name || 'İçe Aktarılan Hesap') + ' (Yeni)',
        createdAt: new Date().toISOString()
      };

      const profiles = this.getProfiles();
      profiles.push(newProfile);
      this.saveProfiles(profiles);

      this.saveProfileData(newId, payload.data);
      this.setActiveProfileId(newId);

      return { success: true, profile: newProfile };
    } catch (e) {
      console.error('Hesap yükleme hatası:', e);
      return { success: false, message: e.message };
    }
  }

  // --- Tüm Profilleri Dışa / İçe Aktarma (Full Backup) ---
  exportBackup() {
    const profiles = this.getProfiles();
    const backup = {
      version: '2.0',
      exportedAt: new Date().toISOString(),
      profiles: profiles,
      profilesData: {}
    };

    for (const p of profiles) {
      backup.profilesData[p.id] = this.getProfileData(p.id);
    }

    return JSON.stringify(backup, null, 2);
  }

  importBackup(jsonString) {
    try {
      const backup = JSON.parse(jsonString);
      if (!backup || !backup.profiles || !backup.profilesData) {
        throw new Error('Geçersiz yedek dosyası formatı!');
      }

      this.saveProfiles(backup.profiles);
      for (const p of backup.profiles) {
        if (backup.profilesData[p.id]) {
          this.saveProfileData(p.id, backup.profilesData[p.id]);
        }
      }

      if (backup.profiles.length > 0) {
        this.setActiveProfileId(backup.profiles[0].id);
      }

      return { success: true, count: backup.profiles.length };
    } catch (e) {
      console.error('Yedek yükleme hatası:', e);
      return { success: false, message: e.message };
    }
  }

  // Aktif profilin tüm verilerini sıfırla
  resetActiveProfile() {
    const activeId = this.getActiveProfileId();
    this.saveProfileData(activeId, {
      settings: { ...DEFAULT_SETTINGS },
      days: {}
    });
  }
}

const storage = new StorageManager();


/**
 * Döngüm - Biyolojik Modelleme ve Döngü Tahminleme Motoru
 * Kullanıcının girdiği verilere göre ortalama süreleri, düzenlilik skorunu
 * ve fazları (Regl, Foliküler, Ovülasyon, Luteal, PMS) hesaplar.
 * Manuel giriş ve silmelere göre anında kendini optimize eder.
 */

class CycleEngine {
  constructor(storageManager) {
    this.storage = storageManager;
  }

  // Tarih yardımcıları (Saat dilimi kaymalarını önlemek için YYYY-MM-DD bazlı)
  static parseDateStr(str) {
    if (!str) return new Date();
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  static formatDateStr(d) {
    if (!(d instanceof Date) || isNaN(d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  static addDays(dateStrOrObj, days) {
    const d = typeof dateStrOrObj === 'string' 
      ? CycleEngine.parseDateStr(dateStrOrObj) 
      : new Date(dateStrOrObj);
    d.setDate(d.getDate() + days);
    return CycleEngine.formatDateStr(d);
  }

  static diffDays(dateStrA, dateStrB) {
    const da = CycleEngine.parseDateStr(dateStrA);
    const db = CycleEngine.parseDateStr(dateStrB);
    const msDiff = da.getTime() - db.getTime();
    return Math.round(msDiff / (1000 * 60 * 60 * 24));
  }

  // --- Geçmiş Dönemleri Kümeleme (Clustering) ---
  // Kullanıcının gün gün girdiği regl kayıtlarını tespit eder
  getPeriodClusters() {
    const profileData = this.storage.getProfileData();
    const days = profileData.days || {};

    // Sadece regl olarak işaretli günleri sırala
    const periodDates = Object.keys(days)
      .filter(dateStr => days[dateStr].isPeriod)
      .sort();

    if (periodDates.length === 0) return [];

    const clusters = [];
    let currentCluster = [periodDates[0]];

    for (let i = 1; i < periodDates.length; i++) {
      const prevDate = periodDates[i - 1];
      const currDate = periodDates[i];
      const gap = CycleEngine.diffDays(currDate, prevDate);

      // Eğer ardışık ise ya da arada en fazla 1 günlük lekelenme boşluğu varsa aynı döneme dahil et
      if (gap <= 2) {
        currentCluster.push(currDate);
      } else {
        clusters.push({
          startDate: currentCluster[0],
          endDate: currentCluster[currentCluster.length - 1],
          dates: [...currentCluster],
          duration: CycleEngine.diffDays(currentCluster[currentCluster.length - 1], currentCluster[0]) + 1
        });
        currentCluster = [currDate];
      }
    }

    if (currentCluster.length > 0) {
      clusters.push({
        startDate: currentCluster[0],
        endDate: currentCluster[currentCluster.length - 1],
        dates: [...currentCluster],
        duration: CycleEngine.diffDays(currentCluster[currentCluster.length - 1], currentCluster[0]) + 1
      });
    }

    return clusters;
  }

  // --- İstatistikler ve Uyarlanabilir Süreler ---
  calculateStats() {
    const profileData = this.storage.getProfileData();
    const baseSettings = profileData.settings;
    const clusters = this.getPeriodClusters();

    let avgPeriodLength = baseSettings.periodLength || 5;
    let avgCycleLength = baseSettings.cycleLength || 28;
    let cycleDurations = [];
    let periodDurations = clusters.map(c => c.duration).filter(d => d >= 2 && d <= 12);

    if (periodDurations.length > 0) {
      const sumPeriod = periodDurations.reduce((a, b) => a + b, 0);
      avgPeriodLength = Math.round(sumPeriod / periodDurations.length);
      // Makul fizyolojik sınırlar
      avgPeriodLength = Math.max(3, Math.min(10, avgPeriodLength));
    }

    // Döngü aralıklarını hesapla (İki başlangıç tarihi arası)
    if (clusters.length >= 2) {
      for (let i = 0; i < clusters.length - 1; i++) {
        const interval = CycleEngine.diffDays(clusters[i + 1].startDate, clusters[i].startDate);
        // Makul biyolojik aralık (18 ila 60 gün)
        if (interval >= 18 && interval <= 60) {
          cycleDurations.push(interval);
        }
      }

      if (cycleDurations.length > 0) {
        // Son döngülere daha yüksek ağırlık veren ağırlıklı ortalama
        let weightSum = 0;
        let weightedTotal = 0;
        cycleDurations.forEach((dur, idx) => {
          const w = idx + 1;
          weightedTotal += dur * w;
          weightSum += w;
        });
        avgCycleLength = Math.round(weightedTotal / weightSum);
        avgCycleLength = Math.max(21, Math.min(45, avgCycleLength));
      }
    }

    // Düzenlilik Skoru ve Standart Sapma
    let stdDev = 0;
    let regularityScore = 95; // Varsayılan sağlıklı başlangıç puanı

    if (cycleDurations.length >= 2) {
      const mean = cycleDurations.reduce((a, b) => a + b, 0) / cycleDurations.length;
      const variance = cycleDurations.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / cycleDurations.length;
      stdDev = Math.sqrt(variance);

      // Sapma arttıkça skor düşer
      regularityScore = Math.max(40, Math.min(100, Math.round(100 - (stdDev * 8))));
    } else if (clusters.length === 1) {
      regularityScore = 92;
    }

    return {
      averageCycleLength: avgCycleLength,
      averagePeriodLength: avgPeriodLength,
      lutealLength: baseSettings.lutealLength || 14,
      totalLoggedCycles: clusters.length,
      cycleDurations,
      regularityScore,
      stdDev: Math.round(stdDev * 10) / 10,
      lastPeriod: clusters.length > 0 ? clusters[clusters.length - 1] : null
    };
  }

  calculateStatistics() {
    return this.calculateStats();
  }

  /**
   * Takvim üzerinde yapılan işaretlemeler sonrasında ayarlar sekmesindeki
   * döngü parametrelerini (döngü süresi, regl süresi) hesaplanan gerçek biyolojik verilere göre otomatik revize eder.
   */
  syncSettingsFromCalendarData() {
    const profileData = this.storage.getProfileData();
    const clusters = this.getPeriodClusters();
    const stats = this.calculateStats();

    let updated = false;
    const newSettings = { ...profileData.settings };

    // Eğer en az 1 regl dönemi kaydedilmişse ortalama regl süresini revize et
    if (clusters.length >= 1 && stats.averagePeriodLength) {
      if (newSettings.periodLength !== stats.averagePeriodLength) {
        newSettings.periodLength = stats.averagePeriodLength;
        updated = true;
      }
    }

    // Eğer en az 2 regl dönemi kaydedilmişse döngü aralığını otomatik revize et
    if (clusters.length >= 2 && stats.averageCycleLength) {
      if (newSettings.cycleLength !== stats.averageCycleLength) {
        newSettings.cycleLength = stats.averageCycleLength;
        updated = true;
      }
    }

    if (updated) {
      this.storage.updateSettings(newSettings);
      console.log('Döngü parametreleri takvim verilerine göre otomatik revize edildi:', {
        cycleLength: newSettings.cycleLength,
        periodLength: newSettings.periodLength,
        cyclesCount: clusters.length
      });
    }

    return { updated, settings: newSettings, stats };
  }

  // --- Akıllı Otomatik Doldurma ve Manuel Müdahale ---
  /**
   * Kullanıcı belirli bir tarihe regl başlangıcı girdiğinde,
   * ortalama regl süresine göre diğer günleri işaretler.
   */
  logPeriodStart(startDateStr, flow = 'medium') {
    const stats = this.calculateStats();
    const periodDays = stats.averagePeriodLength;
    const profileData = this.storage.getProfileData();

    // Başlangıç gününü manuel kayıt olarak işle
    this.storage.saveDayData(startDateStr, {
      isPeriod: true,
      flow: flow,
      isManual: true,
      isPredicted: false
    });

    // Takip eden günleri doldur (eğer kullanıcı daha önce bu günleri manuel silmediyse)
    for (let i = 1; i < periodDays; i++) {
      const nextDateStr = CycleEngine.addDays(startDateStr, i);
      const existing = profileData.days[nextDateStr];

      // Eğer kullanıcı bizzat kapatmamışsa otomatik tahmini akış doldur
      if (!existing || (!existing.isManual && !existing.isPeriod)) {
        let autoFlow = 'medium';
        if (i === 1) autoFlow = 'heavy';
        else if (i === periodDays - 1) autoFlow = 'light';
        else if (i >= periodDays - 2) autoFlow = 'medium';

        this.storage.saveDayData(nextDateStr, {
          isPeriod: true,
          flow: autoFlow,
          isManual: false,
          isPredicted: true
        });
      }
    }

    this.syncSettingsFromCalendarData();
    return this.calculateStats();
  }

  /**
   * Belirli bir günü manuel olarak regl yap, kaldır veya sil.
   * Model bu müdahaleden sonra anında kendini günceller.
   */
  togglePeriodDay(dateStr, isPeriod, flow = 'medium') {
    if (isPeriod) {
      this.storage.saveDayData(dateStr, {
        isPeriod: true,
        flow: flow || 'medium',
        isManual: true,
        isPredicted: false
      });
    } else {
      // Manuel olarak silindiğini kaydet
      this.storage.saveDayData(dateStr, {
        isPeriod: false,
        flow: null,
        isManual: true,
        isPredicted: false
      });
    }
 
    this.syncSettingsFromCalendarData();
    return this.calculateStats();
  }

  // --- İleriye Dönük Döngü ve Faz Projeksiyonları ---
  /**
   * Gelecek N döngüyü ve her döngünün ovülasyon, doğurganlık ve PMS günlerini hesaplar.
   */
  getProjections(monthsAhead = 6) {
    const stats = this.calculateStats();
    const lastPeriod = stats.lastPeriod;

    if (!lastPeriod) {
      return [];
    }

    const projections = [];
    let currentStart = lastPeriod.startDate;
    const today = CycleEngine.formatDateStr(new Date());

    // İleriye doğru hesapla
    for (let c = 0; c < monthsAhead; c++) {
      const nextStart = CycleEngine.addDays(currentStart, stats.averageCycleLength);
      const nextEnd = CycleEngine.addDays(nextStart, stats.averagePeriodLength - 1);
      
      // Yumurtlama: Bir sonraki regl başlangıcından luteal faz (genelde 14 gün) öncesi
      const ovulationDate = CycleEngine.addDays(nextStart, -stats.lutealLength);
      
      // Doğurganlık penceresi: Ovülasyondan 5 gün önce başlar, 1 gün sonra biter
      const fertileStart = CycleEngine.addDays(ovulationDate, -5);
      const fertileEnd = CycleEngine.addDays(ovulationDate, 1);

      // PMS Dönemi: Yeni regl başlangıcından 6 gün önce
      const pmsStart = CycleEngine.addDays(nextStart, -6);
      const pmsEnd = CycleEngine.addDays(nextStart, -1);

      projections.push({
        cycleIndex: c + 1,
        periodStart: nextStart,
        periodEnd: nextEnd,
        ovulationDate: ovulationDate,
        fertileStart: fertileStart,
        fertileEnd: fertileEnd,
        pmsStart: pmsStart,
        pmsEnd: pmsEnd,
        cycleLength: stats.averageCycleLength,
        periodLength: stats.averagePeriodLength
      });

      currentStart = nextStart;
    }

    return projections;
  }

  // --- Belirli Bir Günün Analiz ve Durumu (Day Inspector) ---
  getDayStatus(dateStr) {
    const stats = this.calculateStats();
    const profileData = this.storage.getProfileData();
    const dayData = profileData.days[dateStr] || null;
    const todayStr = CycleEngine.formatDateStr(new Date());

    // 1. Kullanıcı kaydı varsa
    if (dayData && dayData.isPeriod) {
      return {
        dateStr,
        phase: 'period',
        phaseName: 'Regl Dönemi',
        phaseBadge: 'Regl',
        color: '#f43f5e',
        flow: dayData.flow || 'medium',
        isManual: !!dayData.isManual,
        isPredicted: !!dayData.isPredicted,
        pregnancyChance: 'Çok Düşük',
        description: 'Döngünüzün başlangıç ve kanama evresi.',
        dayData
      };
    }

    // 2. Tahmin ve Projeksiyonları İncele
    const projections = this.getProjections(12);
    const lastPeriod = stats.lastPeriod;

    // Eğer geçmiş bir regl döneminin içinde veya güncel döngünün içindeyse
    if (lastPeriod) {
      const daysSinceStart = CycleEngine.diffDays(dateStr, lastPeriod.startDate);
      
      // Son dönemin ovülasyon ve doğurganlık tarihleri
      const expectedNext = CycleEngine.addDays(lastPeriod.startDate, stats.averageCycleLength);
      const currentOvulation = CycleEngine.addDays(expectedNext, -stats.lutealLength);
      const currentFertileStart = CycleEngine.addDays(currentOvulation, -5);
      const currentFertileEnd = CycleEngine.addDays(currentOvulation, 1);
      const currentPmsStart = CycleEngine.addDays(expectedNext, -6);
      const currentPmsEnd = CycleEngine.addDays(expectedNext, -1);

      // Güncel döngü ovülasyonu kontrolü
      if (dateStr === currentOvulation) {
        return {
          dateStr,
          phase: 'ovulation',
          phaseName: 'Yumurtlama Günü (Ovülasyon)',
          phaseBadge: 'Ovülasyon',
          color: '#eab308',
          pregnancyChance: 'En Yüksek (Zirve)',
          description: 'Gebe kalma ihtimalinin en yüksek olduğu gün.',
          dayData
        };
      }

      // Doğurganlık penceresi kontrolü
      if (dateStr >= currentFertileStart && dateStr <= currentFertileEnd) {
        return {
          dateStr,
          phase: 'fertile',
          phaseName: 'Doğurganlık Penceresi',
          phaseBadge: 'Doğurgan',
          color: '#a855f7',
          pregnancyChance: 'Yüksek',
          description: 'Doğurganlık şansının yüksek olduğu verimli günler.',
          dayData
        };
      }

      // PMS kontrolü
      if (dateStr >= currentPmsStart && dateStr <= currentPmsEnd) {
        return {
          dateStr,
          phase: 'pms',
          phaseName: 'PMS (Regl Öncesi)',
          phaseBadge: 'PMS',
          color: '#fb923c',
          pregnancyChance: 'Düşük',
          description: 'Duygusal ve fiziksel belirtilerin yaşanabildiği dönem.',
          dayData
        };
      }
    }

    // İleriye dönük projeksiyonlarda kontrol et
    for (const proj of projections) {
      if (dateStr >= proj.periodStart && dateStr <= proj.periodEnd) {
        return {
          dateStr,
          phase: 'predicted_period',
          phaseName: 'Tahmini Regl',
          phaseBadge: 'Tahmini Regl',
          color: '#fb7185',
          isPredicted: true,
          pregnancyChance: 'Düşük',
          description: 'Modelin tahmin ettiği sonraki döngü başlangıcı.',
          dayData
        };
      }

      if (dateStr === proj.ovulationDate) {
        return {
          dateStr,
          phase: 'ovulation',
          phaseName: 'Tahmini Yumurtlama',
          phaseBadge: 'Ovülasyon',
          color: '#eab308',
          pregnancyChance: 'En Yüksek (Zirve)',
          description: 'Tahmini ovülasyon günü.',
          dayData
        };
      }

      if (dateStr >= proj.fertileStart && dateStr <= proj.fertileEnd) {
        return {
          dateStr,
          phase: 'fertile',
          phaseName: 'Tahmini Doğurganlık',
          phaseBadge: 'Doğurgan',
          color: '#a855f7',
          pregnancyChance: 'Yüksek',
          description: 'Tahmini doğurganlık günleri.',
          dayData
        };
      }

      if (dateStr >= proj.pmsStart && dateStr <= proj.pmsEnd) {
        return {
          dateStr,
          phase: 'pms',
          phaseName: 'Tahmini PMS',
          phaseBadge: 'PMS',
          color: '#fb923c',
          pregnancyChance: 'Düşük',
          description: 'Tahmini regl öncesi dönem.',
          dayData
        };
      }
    }

    // Normal / Foliküler ya da Luteal
    return {
      dateStr,
      phase: 'normal',
      phaseName: 'Normal Gün',
      phaseBadge: 'Döngü',
      color: '#94a3b8',
      pregnancyChance: 'Düşük',
      description: 'Stabil hormon dengesi dönemi.',
      dayData
    };
  }

  // --- Bugünün Özet Durumu (Home Screen Widget) ---
  getTodaySummary() {
    const todayStr = CycleEngine.formatDateStr(new Date());
    const stats = this.calculateStats();
    const dayStatus = this.getDayStatus(todayStr);

    let cycleDayNumber = 1;
    let daysUntilNext = null;
    let nextPeriodDate = null;

    if (stats.lastPeriod) {
      const daysDiff = CycleEngine.diffDays(todayStr, stats.lastPeriod.startDate);
      cycleDayNumber = Math.max(1, daysDiff + 1);

      nextPeriodDate = CycleEngine.addDays(stats.lastPeriod.startDate, stats.averageCycleLength);
      daysUntilNext = CycleEngine.diffDays(nextPeriodDate, todayStr);
    }

    return {
      todayStr,
      cycleDayNumber,
      daysUntilNext,
      nextPeriodDate,
      dayStatus,
      stats
    };
  }
}

  attachEvents() {
    const prevBtn = this.container.querySelector('#calPrevMonth');
    const nextBtn = this.container.querySelector('#calNextMonth');
    const todayBtn = this.container.querySelector('#calTodayBtn');
    const grid = this.container.querySelector('#calDaysGrid');
    const modalOverlay = this.container.querySelector('#dayModalOverlay');

    if (prevBtn) {
      prevBtn.onclick = () => {
        if (this.currentMonth === 0) {
          this.currentMonth = 11;
          this.currentYear--;
        } else {
          this.currentMonth--;
        }
        this.updateMonthView();
      };
    }

    if (nextBtn) {
      nextBtn.onclick = () => {
        if (this.currentMonth === 11) {
          this.currentMonth = 0;
          this.currentYear++;
        } else {
          this.currentMonth++;
        }
        this.updateMonthView();
      };
    }

    if (todayBtn) {
      todayBtn.onclick = () => {
        const today = new Date();
        this.currentYear = today.getFullYear();
        this.currentMonth = today.getMonth();
        this.selectedDateStr = CycleEngine.formatDateStr(today);
        this.updateMonthView();
        this.openDayModal(this.selectedDateStr);
      };
    }

    if (grid) {
      grid.onclick = (e) => {
        const dayCell = e.target.closest('.cal-day-cell');
        if (dayCell && dayCell.dataset.date) {
          this.selectedDateStr = dayCell.dataset.date;
          this.highlightSelectedCell();
          this.openDayModal(this.selectedDateStr);
        }
      };
    }

    if (modalOverlay) {
      modalOverlay.onclick = (e) => {
        if (e.target === modalOverlay) {
          this.closeDayModal();
        }
      };
    }
  }

  updateMonthView() {
    const title = this.container.querySelector('#calMonthTitle');
    const grid = this.container.querySelector('#calDaysGrid');
    if (title) {
      title.textContent = `${this.monthNames[this.currentMonth]} ${this.currentYear}`;
    }
    if (grid) {
      grid.innerHTML = this.buildDaysGridHtml();
    }
  }

  highlightSelectedCell() {
    this.container.querySelectorAll('.cal-day-cell').forEach(cell => {
      cell.classList.toggle('selected-cell', cell.dataset.date === this.selectedDateStr);
    });
  }

  // --- Gün Hücreleri Üretimi ---
  buildDaysGridHtml() {
    const firstDay = new Date(this.currentYear, this.currentMonth, 1);
    const lastDay = new Date(this.currentYear, this.currentMonth + 1, 0);
    const totalDays = lastDay.getDate();

    // Pazartesi ilk gün (0 = Pzt, 6 = Paz)
    let startDayOfWeek = firstDay.getDay() - 1;
    if (startDayOfWeek === -1) startDayOfWeek = 6;

    const todayStr = CycleEngine.formatDateStr(new Date());
    let html = '';

    // Önceki aydan taşan boşluklar
    for (let i = 0; i < startDayOfWeek; i++) {
      html += `<div class="cal-day-cell empty-day"></div>`;
    }

    // Ayın günleri
    for (let d = 1; d <= totalDays; d++) {
      const dateObj = new Date(this.currentYear, this.currentMonth, d);
      const dateStr = CycleEngine.formatDateStr(dateObj);
      const status = this.engine.getDayStatus(dateStr);
      const isToday = (dateStr === todayStr);
      const isSelected = (dateStr === this.selectedDateStr);

      const hasNotesOrSymptoms = status.dayData && (
        (status.dayData.symptoms && status.dayData.symptoms.length > 0) ||
        status.dayData.mood ||
        status.dayData.notes
      );

      // CSS Sınıfları
      const classes = ['cal-day-cell'];
      if (isToday) classes.push('is-today');
      if (isSelected) classes.push('selected-cell');

      if (status.phase === 'period') classes.push('phase-period');
      else if (status.phase === 'predicted_period') classes.push('phase-predicted-period');
      else if (status.phase === 'ovulation') classes.push('phase-ovulation');
      else if (status.phase === 'fertile') classes.push('phase-fertile');
      else if (status.phase === 'pms') classes.push('phase-pms');

      html += `
        <div class="${classes.join(' ')}" data-date="${dateStr}">
          <span class="day-number">${d}</span>
          <div class="day-indicators">
            ${status.phase === 'period' ? `<span class="indicator-dot period-dot"></span>` : ''}
            ${status.phase === 'predicted_period' ? `<span class="indicator-dot predicted-dot"></span>` : ''}
            ${status.phase === 'ovulation' ? `<span class="indicator-dot ovulation-dot"></span>` : ''}
            ${status.phase === 'fertile' ? `<span class="indicator-dot fertile-dot"></span>` : ''}
            ${status.phase === 'pms' ? `<span class="indicator-dot pms-dot"></span>` : ''}
            ${hasNotesOrSymptoms ? `<span class="indicator-badge">●</span>` : ''}
          </div>
        </div>
      `;
    }

    return html;
  }

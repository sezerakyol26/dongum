            return `
              <button type="button" class="chip-item ${active ? 'chip-active' : ''}" data-id="${m.id}">
                <span class="chip-icon">${m.icon}</span>
                <span class="chip-text">${m.label}</span>
              </button>
            `;
          }).join('')}
        </div>
      </div>

      <!-- AKINTI TİPİ -->
      <div class="modal-section">
        <label class="section-label">💧 Akıntı Durumu</label>
        <div class="chips-row" id="dischargeChips">
          ${this.dischargeList.map(d => {
            const active = currentDischarge === d.id;
            return `
              <button type="button" class="chip-pill ${active ? 'chip-active' : ''}" data-id="${d.id}">
                ${d.label}
              </button>
            `;
          }).join('')}
        </div>
      </div>

      <!-- NOTLAR -->
      <div class="modal-section">
        <label class="section-label">📝 Kişisel Not</label>
        <textarea class="notes-textarea" id="dayNotesInput" placeholder="Bugün nasıl hissediyorsunuz? İlaç, uyku veya özel durumlar..." rows="3">${currentNotes}</textarea>
      </div>
    `;

    // Modal içi olay dinleyicileri
    const closeBtn = modalContent.querySelector('#modalCloseBtn');
    const togglePeriodBtn = modalContent.querySelector('#btnTogglePeriod');
    const deletePeriodBtn = modalContent.querySelector('#btnDeletePeriod');
    const flowSelector = modalContent.querySelector('#flowSelector');
    const saveBtn = this.container.querySelector('#btnSaveDayDetails');

    let activePeriodState = isPeriod;
    let selectedFlow = currentFlow;
    let selectedSymptoms = [...currentSymptoms];
    let selectedMood = currentMood;
    let selectedDischarge = currentDischarge;

    if (closeBtn) {
      closeBtn.onclick = () => this.closeDayModal();
    }

    // Regl Aç / Kapat
    if (togglePeriodBtn) {
      togglePeriodBtn.onclick = () => {
        activePeriodState = !activePeriodState;
        togglePeriodBtn.classList.toggle('active-period', activePeriodState);
        togglePeriodBtn.innerHTML = activePeriodState ? '✓ Bugün Regl Olundu' : '+ Regl Olarak İşaretle';
        flowSelector.classList.toggle('disabled-flow', !activePeriodState);

        // Eğer ilk defa regl başlangıcı yapılıyorsa modelin ortalama süresine göre doldur
        if (activePeriodState) {
          this.engine.logPeriodStart(dateStr, selectedFlow);
        } else {
          this.engine.togglePeriodDay(dateStr, false);
        }
        this.notifyUpdate();
      };
    }

    // Regl Kaydını Kaldır / Sil
    if (deletePeriodBtn) {
      deletePeriodBtn.onclick = () => {
        this.engine.togglePeriodDay(dateStr, false);
        activePeriodState = false;
        this.notifyUpdate();
        this.openDayModal(dateStr); // Modalı tazeleyerek göster
      };
    }

    // Akış Yoğunluğu Butonları
    flowSelector.querySelectorAll('.flow-btn').forEach(btn => {
      btn.onclick = () => {
        flowSelector.querySelectorAll('.flow-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedFlow = btn.dataset.flow;
        if (activePeriodState) {
          this.engine.togglePeriodDay(dateStr, true, selectedFlow);
          this.notifyUpdate();
        }
      };
    });

    // Semptom Seçimleri
    modalContent.querySelectorAll('#symptomsChips .chip-item').forEach(chip => {
      chip.onclick = () => {
        const id = chip.dataset.id;
        if (selectedSymptoms.includes(id)) {
          selectedSymptoms = selectedSymptoms.filter(item => item !== id);
          chip.classList.remove('chip-active');
        } else {
          selectedSymptoms.push(id);
          chip.classList.add('chip-active');
        }
      };
    });

    // Ruh Hali Seçimi (Tekil)
    modalContent.querySelectorAll('#moodChips .chip-item').forEach(chip => {
      chip.onclick = () => {
        const id = chip.dataset.id;
        if (selectedMood === id) {
          selectedMood = '';
          chip.classList.remove('chip-active');
        } else {
          selectedMood = id;
          modalContent.querySelectorAll('#moodChips .chip-item').forEach(c => c.classList.remove('chip-active'));
          chip.classList.add('chip-active');
        }
      };
    });

    // Akıntı Tipi (Tekil)
    modalContent.querySelectorAll('#dischargeChips .chip-pill').forEach(pill => {
      pill.onclick = () => {
        const id = pill.dataset.id;
        if (selectedDischarge === id) {
          selectedDischarge = '';
          pill.classList.remove('chip-active');
        } else {
          selectedDischarge = id;
          modalContent.querySelectorAll('#dischargeChips .chip-pill').forEach(p => p.classList.remove('chip-active'));
          pill.classList.add('chip-active');
        }
      };
    });

    // Tümünü Kaydet
    if (saveBtn) {
      saveBtn.onclick = () => {
        const notes = modalContent.querySelector('#dayNotesInput').value.trim();
        this.storage.saveDayData(dateStr, {
          isPeriod: activePeriodState,
          flow: activePeriodState ? selectedFlow : null,
          symptoms: selectedSymptoms,
          mood: selectedMood || null,
          discharge: selectedDischarge || null,
          notes: notes
        });

        this.engine.syncSettingsFromCalendarData();
        this.notifyUpdate();
        this.closeDayModal();
      };
    }

    modalOverlay.classList.add('active');
  }

  closeDayModal() {
    const modalOverlay = this.container.querySelector('#dayModalOverlay');
    if (modalOverlay) {
      modalOverlay.classList.remove('active');
    }
  }

  notifyUpdate() {
    this.updateMonthView();
    if (typeof this.onDataChanged === 'function') {
      this.onDataChanged();
    }
  }

  // Dışarıdan belirli bir güne atlama (Örn: Bugün veya 31 Ağustos)
  goToDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    this.currentYear = y;
    this.currentMonth = m - 1;
    this.selectedDateStr = dateStr;
    this.updateMonthView();
    this.highlightSelectedCell();
    this.openDayModal(dateStr);
  }
}

            </div>
            <div class="stat-info">
              <span class="stat-label">Düzenlilik Skoru</span>
              <div class="stat-value-group">
                <span class="stat-number">%${stats.regularityScore}</span>

                ${stats.stdDev === 0

          <!-- Ortalama Döngü Uzunluğu -->
          <div class="stat-card">

              ${Icons.refresh}
            </div>
            <div class="stat-info">

          <div class="history-list">
            ${clusters.length > 0 ? clusters.map((c, idx) => {
              const startFormatted = this.formatDateReadable(c.startDate);

                  <div class="history-card-header">

    const reportBtn = this.container.querySelector('#btnOpenDoctorReport');
    if (reportBtn) {
      reportBtn.onclick = () => {
        this.reportGen.openReportModal();
      };
    }

    this.container.querySelectorAll('.btn-goto-date, .btn-history-view').forEach(btn => {
      btn.onclick = () => {
        const dateStr = btn.dataset.date;
        if (dateStr && typeof this.onGoToDate === 'function') {
          this.onGoToDate(dateStr);
        }
      };
    });
  }

  formatDateReadable(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    const months = [
      'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
      'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'
    ];
    return `${d} ${months[m - 1]} ${y}`;
  }

  calculateSymptomFrequencies(days = {}) {
    const symptomLabels = {
      cramps: { label: 'Kramplar', icon: '⚡' },
      headache: { label: 'Baş Ağrısı', icon: '🤕' },
      bloating: { label: 'Şişkinlik', icon: '🎈' },
      breast: { label: 'Göğüs Hassasiyeti', icon: '🌸' },
      backache: { label: 'Bel Ağrısı', icon: '🦴' },
      acne: { label: 'Sivilce/Cilt', icon: '✨' },
      fatigue: { label: 'Yorgunluk', icon: '😴' },
      nausea: { label: 'Mide Bulantısı', icon: '🤢' },
      insomnia: { label: 'Uykusuzluk', icon: '🌙' },
      craving: { label: 'Tatlı/Aşerme', icon: '🍫' }
    };

    const counts = {};
    let totalDaysWithSymptoms = 0;

    Object.values(days).forEach(day => {
      if (day.symptoms && day.symptoms.length > 0) {
        totalDaysWithSymptoms++;
        day.symptoms.forEach(sym => {
          counts[sym] = (counts[sym] || 0) + 1;
        });
      }
    });

    if (totalDaysWithSymptoms === 0) return [];

    return Object.keys(counts)
      .map(k => ({
        id: k,
        label: (symptomLabels[k] && symptomLabels[k].label) || k,
        icon: (symptomLabels[k] && symptomLabels[k].icon) || '•',
        count: counts[k],
        percentage: Math.round((counts[k] / totalDaysWithSymptoms) * 100)
      }))
      .sort((a, b) => b.count - a.count);
  }
}


/**
 * Döngüm - Jinekolog Sağlık & Döngü Raporu Üretici (PDF / Yazdırma)

class DoctorReportGenerator {
  constructor(engine, storage) {
    this.engine = engine;
    this.storage = storage;
  }

  formatDateTR(dateStr) {
    if (!dateStr) return '-';
    const [y, m, d] = dateStr.split('-').map(Number);

  }

    const profile = this.storage.getActiveProfile();
    const profileData = this.storage.getProfileData();

    const clusters = this.engine.getPeriodClusters().reverse();
    const days = profileData.days || {};

    const reportRefNo = 'RAP-' + todayStr.replace(/-/g, '') + '-' + Math.floor(1000 + Math.random() * 9000);

      cramps: 'Dismenore (Kramplar / Kasık Ağrısı)',

      backache: 'Lomber / Bel Ağrısı',

    };

    const symptomCounts = {};
    const flowCounts = { spotting: 0, light: 0, medium: 0, heavy: 0 };

    Object.values(days).forEach(d => {
      totalLoggedDays++;
      if (d.flow && flowCounts[d.flow] !== undefined) {
        flowCounts[d.flow]++;
      }
      if (d.symptoms && Array.isArray(d.symptoms)) {
        d.symptoms.forEach(s => {
          symptomCounts[s] = (symptomCounts[s] || 0) + 1;
        });
      }
    });

    const totalFlowEntries = Object.values(flowCounts).reduce((a, b) => a + b, 0);

          </thead>
          <tbody>
            ${clusters.length > 0 ? clusters.map((c, i) => {
              const prevCluster = clusters[i + 1];
              const intervalDays = prevCluster 
                ? CycleEngine.diffDays(c.startDate, prevCluster.startDate) 
                : stats.averageCycleLength;

              let statusText = 'Normal';
              if (intervalDays > 35) statusText = 'Oligomenore (Uzun)';
              else if (intervalDays < 21) statusText = 'Polimenore (Kısa)';

              return `
                <tr>
                  <td><strong>${clusters.length - i}. Siklus</strong></td>
                  <td>${this.formatDateTR(c.startDate)}</td>
                  <td>${this.formatDateTR(c.endDate)}</td>
                  <td>${c.duration} Gün</td>
                  <td>${intervalDays} Gün</td>
                  <td>${statusText}</td>
                </tr>
              `;
            }).join('') : `
              <tr>
                <td colspan="6" style="text-align: center; color: #64748b; padding: 14px;">Henüz geçmiş döngü kaydı bulunmamaktadır.</td>
              </tr>
            `}
          </tbody>
        </table>

        <!-- Semptom ve Akış Analizi -->
        <div class="dr-section-title" style="margin-top: 20px;">3. BELİRTİ, SEMPTOM VE KANAMA YOĞUNLUĞU DAĞILIMI</div>

                  <th>Bildirilen Gün</th>

                </tr>
              </thead>
              <tbody>
                ${Object.keys(symptomCounts).length > 0 ? Object.keys(symptomCounts).map(k => {
                  const label = symptomLabels[k] || k;
                  const cnt = symptomCounts[k];
                  const pct = Math.round((cnt / (clusters.length || 1)) * 100);
                  return `
                    <tr>
                      <td>${label}</td>
                      <td>${cnt} gün</td>
                      <td>%${pct}</td>
                    </tr>
                  `;
                }).join('') : `

  // Modalı ekrana yerleştirir ve yazdırma/PDF akışını başlatır
  openReportModal() {
    let overlay = document.getElementById('doctorReportModalOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'doctorReportModalOverlay';
      overlay.className = 'doctor-report-overlay';
      document.body.appendChild(overlay);
    }

    const reportContent = this.generateReportHtml();

    overlay.innerHTML = `
      <div class="doctor-modal-window">
        <!-- Modal Üst Aksiyon Barı (Yazdırırken gizlenir) -->
        <div class="dr-modal-actions-bar no-print">
          <div class="dr-actions-left">

            <h3>Jinekolog Klinik Sağlık Raporu</h3>

          <div class="dr-actions-right">

              ${Icons.printer} PDF Olarak Kaydet / Yazdır
            </button>
            <button type="button" class="btn-close-report" id="btnCloseReportModal">
              ${Icons.close}
            </button>
          </div>
        </div>

        <!-- Yazdırılabilir A4 Rapor Kağıdı -->
        <div class="dr-paper-container">
          ${reportContent}
        </div>
      </div>
    `;

    overlay.classList.add('active');

    // Kapatma butonu
    const closeBtn = overlay.querySelector('#btnCloseReportModal');
    if (closeBtn) {
      closeBtn.onclick = () => overlay.classList.remove('active');
    }

    overlay.onclick = (e) => {
      if (e.target === overlay) overlay.classList.remove('active');
    };

    // PDF / Yazdır butonu
    const printBtn = overlay.querySelector('#btnPrintReportPdf');
    if (printBtn) {
      printBtn.onclick = () => {
        window.print();
      };
    }
  }
}

              </div>
              <p>

  // --- PIN Kilit Kontrolü ---
  checkPinLock() {
    if (!this.storage.isPinRequired()) {
      const overlay = document.getElementById('pinLockOverlay');
      if (overlay) overlay.classList.remove('active');
      return;
    }

    let enteredPin = '';
    const pinDots = document.querySelectorAll('#pinDots .pin-dot');
    const errorMsg = document.getElementById('pinErrorMsg');
    const keypad = document.getElementById('pinKeypad');

    const updateDots = () => {
      pinDots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < enteredPin.length);
      });
    };

    if (keypad) {
      keypad.onclick = (e) => {
        const btn = e.target.closest('.pin-key-btn');
        if (!btn) return;
        const key = btn.dataset.key;

        if (key === 'C') {
          enteredPin = '';
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (key === '←') {
          enteredPin = enteredPin.slice(0, -1);
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (enteredPin.length < 4) {
          enteredPin += key;
          updateDots();

          if (enteredPin.length === 4) {
            setTimeout(() => {
              if (this.storage.checkPin(enteredPin)) {
                const overlay = document.getElementById('pinLockOverlay');
                if (overlay) overlay.classList.remove('active');
                this.isLocked = false;
                enteredPin = '';
                updateDots();
              } else {
                if (errorMsg) errorMsg.textContent = 'Hatalı PIN kodu! Lütfen tekrar deneyin.';
                enteredPin = '';
                updateDots();
              }
            }, 100);
          }
        }
      };
    }

    const btnSwitch = document.getElementById('btnPinSwitchProfile');
    if (btnSwitch) {
      btnSwitch.onclick = () => {
        const overlay = document.getElementById('pinLockOverlay');
        if (overlay) overlay.classList.remove('active');
        this.showLoginScreen();
      };
    }
  }

  // --- Uygulama Açılış Login & Profil Seçim Ekranı ---
  showLoginScreen() {
    const overlay = document.getElementById('appLoginOverlay');
    if (!overlay) return;

    this.isLoggedIn = false;
    overlay.classList.add('active');

    // Profil seçim adımını göster, PIN adımını gizle
    const stepProfiles = document.getElementById('loginStepProfiles');
    const stepPin = document.getElementById('loginStepPin');
    if (stepProfiles) stepProfiles.style.display = 'block';
    if (stepPin) stepPin.style.display = 'none';

    this.renderLoginProfiles();
  }

  renderLoginProfiles() {
    const container = document.getElementById('loginProfilesContainer');
    if (!container) return;

    const profiles = this.storage.getProfiles();
    container.innerHTML = profiles.map(p => {
      const roleObj = PROFILE_ROLES.find(r => r.id === p.role) || { name: 'Kişisel' };
      const hasPin = Boolean(p.pinEnabled && p.pin);
      return `
        <div class="login-profile-card" data-id="${p.id}">
          <div class="login-profile-info">
            <div class="login-profile-avatar" style="border-color: ${p.avatarColor || '#f43f5e'};">
              ${p.avatarEmoji || '🌸'}
            </div>
            <div class="login-profile-names">
              <span class="login-profile-name">${p.name}</span>
              <span class="login-profile-role">${roleObj.name}</span>
            </div>
          </div>
          <div class="login-profile-meta">
            ${hasPin ? `<span class="login-lock-badge">🔒 PIN</span>` : `<span style="font-size: 0.75rem; color: #10b981; font-weight: 600;">Giriş →</span>`}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.login-profile-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        const targetP = this.storage.getProfileById(id);
        if (!targetP) return;

        if (targetP.pinEnabled && targetP.pin) {
          this.showLoginPinPrompt(targetP);
        } else {
          this.completeLogin(targetP);
        }
      };
    });

    const btnNew = document.getElementById('btnLoginCreateProfile');
    if (btnNew) {
      btnNew.onclick = () => {
        this.openProfileModal('create');
      };
    }
  }

  showLoginPinPrompt(targetProfile) {
    const stepProfiles = document.getElementById('loginStepProfiles');
    const stepPin = document.getElementById('loginStepPin');
    const targetBox = document.getElementById('loginTargetProfileBox');
    const dots = document.querySelectorAll('#loginPinDots .pin-dot');
    const keypad = document.getElementById('loginPinKeypad');
    const errorMsg = document.getElementById('loginPinErrorMsg');
    const btnBack = document.getElementById('btnLoginBackToProfiles');

    if (!stepPin || !targetBox) return;

    stepProfiles.style.display = 'none';
    stepPin.style.display = 'block';

    targetBox.innerHTML = `
      <div class="login-target-avatar" style="border-color: ${targetProfile.avatarColor || '#f43f5e'};">
        ${targetProfile.avatarEmoji || '🌸'}
      </div>
      <div class="login-target-name">${targetProfile.name}</div>
      <div class="login-target-hint">Giriş yapmak için 4 haneli PIN kodunuzu tuşlayın</div>
    `;

    if (errorMsg) errorMsg.textContent = '';
    let entered = '';

    const updateDots = () => {
      dots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < entered.length);
      });
    };
    updateDots();

    if (btnBack) {
      btnBack.onclick = () => {
        stepPin.style.display = 'none';
        stepProfiles.style.display = 'block';
        entered = '';
        updateDots();
      };
    }

    if (keypad) {
      keypad.onclick = (e) => {
        const btn = e.target.closest('.pin-key-btn');
        if (!btn) return;
        const key = btn.dataset.key;

        if (key === 'C') {
          entered = '';
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (key === '←') {
          entered = entered.slice(0, -1);
          updateDots();
          if (errorMsg) errorMsg.textContent = '';
        } else if (entered.length < 4) {
          entered += key;
          updateDots();

          if (entered.length === 4) {
            setTimeout(() => {
              if (this.storage.checkProfilePin(targetProfile.id, entered)) {
                this.completeLogin(targetProfile);
              } else {
                if (errorMsg) errorMsg.textContent = 'Hatalı PIN kodu! Lütfen tekrar deneyin.';
                entered = '';
                updateDots();
              }
            }, 100);
          }
        }
      };
    }
  }

  completeLogin(targetProfile) {
    this.storage.setActiveProfileId(targetProfile.id);
    this.isLoggedIn = true;
    const overlay = document.getElementById('appLoginOverlay');
    if (overlay) overlay.classList.remove('active');
    this.refreshAll();
  }

  // --- Korumalı Hesap PIN Doğrulama ---
  openAccountPinPrompt(targetProfile, onSuccess) {
    const overlay = document.getElementById('accountPinOverlay');
    const title = document.getElementById('accPinPromptTitle');
    const desc = document.getElementById('accPinPromptDesc');
    const dots = document.querySelectorAll('#accPinDots .pin-dot');
    const keypad = document.getElementById('accPinKeypad');
    const errorMsg = document.getElementById('accPinErrorMsg');
    const btnCancel = document.getElementById('btnCancelAccPin');

    if (!overlay) return;

    title.textContent = `🔒 ${targetProfile.avatarEmoji || '🌸'} ${targetProfile.name}`;
    desc.textContent = `Bu hesaba giriş yapmak için 4 haneli PIN kodunuzu girin.`;
    errorMsg.textContent = '';
    let entered = '';

    const updateDots = () => {
      dots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < entered.length);
      });
    };
    updateDots();

    keypad.onclick = (e) => {
      const btn = e.target.closest('.pin-key-btn');
      if (!btn) return;
      const key = btn.dataset.key;

      if (key === 'C') {
        entered = '';
        updateDots();
        errorMsg.textContent = '';
      } else if (key === '←') {
        entered = entered.slice(0, -1);
        updateDots();
        errorMsg.textContent = '';
      } else if (entered.length < 4) {
        entered += key;
        updateDots();

        if (entered.length === 4) {
          setTimeout(() => {
            if (this.storage.checkProfilePin(targetProfile.id, entered)) {
              overlay.classList.remove('active');
              if (onSuccess) onSuccess();
            } else {
              errorMsg.textContent = 'Hatalı PIN kodu!';
              entered = '';
              updateDots();
            }
          }, 100);
        }
      }
    };

    btnCancel.onclick = () => {
      overlay.classList.remove('active');
    };

    overlay.classList.add('active');
  }

  // --- Navigasyon ve Olay Dinleyicileri ---
  initNavigation() {
    const navBtns = document.querySelectorAll('.bottom-nav-bar .nav-tab-btn');
    navBtns.forEach(btn => {
      btn.onclick = () => {
        const tab = btn.dataset.tab;
        this.switchTab(tab);
      };
    });
  }

  switchTab(tab) {
    this.currentTab = tab;
    document.querySelectorAll('.bottom-nav-bar .nav-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    this.renderCurrentTab();
  }

  bindGlobalEvents() {
    // Profil Butonu
    const btnProfile = document.getElementById('btnHeaderProfile');
    const btnCloseProfile = document.getElementById('btnCloseProfileModal');
    const profileOverlay = document.getElementById('profileModalOverlay');
    const headerOfflineBtn = document.getElementById('headerOfflineBtn');

    if (btnProfile) {
      btnProfile.onclick = () => this.openProfileModal('list');
    }
    if (btnCloseProfile && profileOverlay) {
      btnCloseProfile.onclick = () => profileOverlay.classList.remove('active');
      profileOverlay.onclick = (e) => {
        if (e.target === profileOverlay) profileOverlay.classList.remove('active');
      };
    }

    if (headerOfflineBtn) {
      headerOfflineBtn.onclick = () => this.openOfflineGuideModal();
    }

    // Modal Sekme Geçişleri
    const modalTabs = document.querySelectorAll('.account-modal-tabs .account-tab-btn');
    modalTabs.forEach(tBtn => {
      tBtn.onclick = () => {
        this.switchProfileTab(tBtn.dataset.tab);
      };
    });

    const btnGoCreate = document.getElementById('btnGoCreateTab');
    if (btnGoCreate) {
      btnGoCreate.onclick = () => this.switchProfileTab('create');
    }

    // Yeni Hesap Form Olayları
    this.bindCreateAccountFormEvents();

    // Hesap Düzenleme Modalı Kapatma
    const editOverlay = document.getElementById('editProfileModalOverlay');
    const btnCloseEdit = document.getElementById('btnCloseEditProfileModal');
    if (btnCloseEdit && editOverlay) {
      btnCloseEdit.onclick = () => editOverlay.classList.remove('active');
      editOverlay.onclick = (e) => {
        if (e.target === editOverlay) editOverlay.classList.remove('active');
      };
    }

    // Çevrimdışı Rehber Kapatma
    const offlineOverlay = document.getElementById('offlineGuideModalOverlay');
    const btnCloseOffline = document.getElementById('btnCloseOfflineGuideModal');
    const btnDismissOffline = document.getElementById('btnDismissOfflineGuide');
    if (btnCloseOffline && offlineOverlay) {
      btnCloseOffline.onclick = () => offlineOverlay.classList.remove('active');
      offlineOverlay.onclick = (e) => {
        if (e.target === offlineOverlay) offlineOverlay.classList.remove('active');
      };
    }
    if (btnDismissOffline && offlineOverlay) {
      btnDismissOffline.onclick = () => offlineOverlay.classList.remove('active');
    }

    // PWA Kurulum Butonu
    const btnTriggerInstall = document.getElementById('btnTriggerPwaInstall');
    if (btnTriggerInstall) {
      btnTriggerInstall.onclick = () => this.triggerPwaInstall();
    }

    // Standalone HTML İndirme Butonu
    const btnDownloadHtml = document.getElementById('btnDownloadStandaloneHtml');
    if (btnDownloadHtml) {
      btnDownloadHtml.onclick = () => this.downloadStandaloneHtml();
    }

    // PWA kurulum hazır olayı dinleyicisi
    window.addEventListener('pwa-install-ready', () => {
      const wrap = document.getElementById('pwaInstallPromptBtnWrap');
      if (wrap) wrap.style.display = 'block';
    });
    if (window.deferredInstallPrompt) {
      const wrap = document.getElementById('pwaInstallPromptBtnWrap');
      if (wrap) wrap.style.display = 'block';
    }

    // Uygulamayı Kilitle / Oturumu Kapat Butonu
    const lockBtn = document.getElementById('btnHeaderLock');
    if (lockBtn) {
      lockBtn.onclick = () => {
        this.showLoginScreen();
      };
    }

    // Karanlık / Aydınlık Mod Butonu
    const themeBtn = document.getElementById('btnHeaderTheme');
    if (themeBtn) {
      themeBtn.onclick = () => {
        document.body.classList.toggle('dark-theme');
        const isDark = document.body.classList.contains('dark-theme');
        themeBtn.innerHTML = isDark ? Icons.sun : Icons.moon;
        this.storage.updateSettings({ darkMode: isDark });
      };
    }
  }

  // --- Yeni Hesap Oluşturma Formu Bağlamaları ---
  bindCreateAccountFormEvents() {
    const emojiPicker = document.getElementById('newAccEmojiPicker');
    if (emojiPicker) {
      emojiPicker.onclick = (e) => {
        const btn = e.target.closest('.emoji-pick-btn');
        if (!btn) return;
        emojiPicker.querySelectorAll('.emoji-pick-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.newProfileDraft.avatarEmoji = btn.dataset.emoji;
      };
    }

    const colorPicker = document.getElementById('newAccColorPicker');
    if (colorPicker) {
      colorPicker.onclick = (e) => {
        const btn = e.target.closest('.color-pick-circle');
        if (!btn) return;
        colorPicker.querySelectorAll('.color-pick-circle').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.newProfileDraft.avatarColor = btn.dataset.color;
      };
    }

    const pinToggle = document.getElementById('newAccPinToggle');
    const pinWrap = document.getElementById('newAccPinInputWrap');
    if (pinToggle && pinWrap) {
      pinToggle.onchange = () => {
        pinWrap.style.display = pinToggle.checked ? 'block' : 'none';
      };
    }

    const btnSubmitCreate = document.getElementById('btnSubmitCreateAccount');
    if (btnSubmitCreate) {
      btnSubmitCreate.onclick = () => {
        const nameInput = document.getElementById('newAccNameInput');
        const roleSelect = document.getElementById('newAccRoleSelect');
        const pinInput = document.getElementById('newAccPinInput');
        const cycleInput = document.getElementById('newAccCycleLen');
        const periodInput = document.getElementById('newAccPeriodLen');

        const name = nameInput.value.trim();
        if (!name) {
          alert('Lütfen bir hesap adı girin!');
          return;
        }

        const isPin = pinToggle.checked;
        const pinVal = pinInput.value.trim();
        if (isPin && (pinVal.length !== 4 || !/^\d+$/.test(pinVal))) {
          alert('Lütfen geçerli 4 haneli sayısal bir PIN kodu girin!');
          return;
        }

        const newProfile = this.storage.createProfile({
          name: name,
          role: roleSelect.value,
          avatarEmoji: this.newProfileDraft.avatarEmoji,
          avatarColor: this.newProfileDraft.avatarColor,
          pin: isPin ? pinVal : null,
          pinEnabled: isPin,
          cycleLength: parseInt(cycleInput.value, 10) || 28,
          periodLength: parseInt(periodInput.value, 10) || 5
        });

        // Formu temizle
        nameInput.value = '';
        if (pinInput) pinInput.value = '';
        pinToggle.checked = false;
        pinWrap.style.display = 'none';

        const pOverlay = document.getElementById('profileModalOverlay');
        if (pOverlay) pOverlay.classList.remove('active');
        this.completeLogin(newProfile);
        alert(`🌸 "${newProfile.name}" hesabı oluşturuldu ve giriş yapıldı!`);
      };
    }

    // Tekil Hesap İçe Aktar
    const btnSubmitImport = document.getElementById('btnSubmitImportAccount');
    const importTextarea = document.getElementById('importSingleAccountTextarea');
    if (btnSubmitImport && importTextarea) {
      btnSubmitImport.onclick = () => {
        const raw = importTextarea.value.trim();
        if (!raw) {
          alert('Lütfen hesap kodunu yapıştırın!');
          return;
        }

        let jsonStr = raw;
        if (!raw.startsWith('{')) {
          try {
            jsonStr = decodeURIComponent(escape(atob(raw)));
          } catch (e) {
            // normal devam et
          }
        }

        const res = this.storage.importSingleProfile(jsonStr);
        if (res.success) {
          alert(`✅ "${res.profile.name}" hesabı başarıyla bu cihaza eklendi!`);
          importTextarea.value = '';
          document.getElementById('profileModalOverlay').classList.remove('active');
          this.refreshAll();
        } else {
          alert('Hesap içe aktarılamadı: ' + res.message);
        }
      };
    }
  }

  // --- Profil Sekmesi Değiştirici ---
  switchProfileTab(tabName) {
    document.querySelectorAll('.account-modal-tabs .account-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });

    document.getElementById('accountTabPaneList').style.display = tabName === 'list' ? 'block' : 'none';
    document.getElementById('accountTabPaneCreate').style.display = tabName === 'create' ? 'block' : 'none';
    document.getElementById('accountTabPaneImport').style.display = tabName === 'import' ? 'block' : 'none';

    if (tabName === 'list') {
      this.renderProfilesList();
    }
  }

  // --- Profil Listesini Render Et ---
  openProfileModal(tab = 'list') {
    const overlay = document.getElementById('profileModalOverlay');
    if (!overlay) return;
    this.switchProfileTab(tab);
    overlay.classList.add('active');
  }

  renderProfilesList() {
    const listWrap = document.getElementById('profilesListWrap');
    if (!listWrap) return;

    const profiles = this.storage.getProfiles();
    const activeId = this.storage.getActiveProfileId();

    listWrap.innerHTML = profiles.map(p => {
      const isActive = p.id === activeId;
      const hasPin = p.pinEnabled && p.pin;
      const roleObj = PROFILE_ROLES.find(r => r.id === p.role) || { name: 'Kişisel' };

      return `
        <div class="profile-card-item ${isActive ? 'active-profile' : ''}" data-id="${p.id}">
          <div class="profile-card-left" data-id="${p.id}">
            <div class="profile-card-avatar" style="background-color: ${p.avatarColor || '#f43f5e'};">
              ${p.avatarEmoji || '🌸'}
            </div>
            <div class="profile-card-details">
              <div class="profile-card-name-row">
                <strong>${p.name}</strong>
                ${hasPin ? `<span class="profile-lock-tag" title="PIN Korumalı">${Icons.lock}</span>` : ''}
              </div>
              <div class="profile-card-meta">
                <span class="profile-badge-role">${roleObj.name}</span>
                ${isActive ? `<span class="profile-badge-active">● Aktif Hesap</span>` : `<span>Dokun ve Geç</span>`}
              </div>
            </div>
          </div>
          <div class="profile-card-actions">
            <button type="button" class="btn-card-action btn-edit-account" data-id="${p.id}" title="Düzenle">
              ${Icons.edit}
            </button>
            <button type="button" class="btn-card-action btn-export-account" data-id="${p.id}" title="Bu Hesabı Aktar">
              ${Icons.share}
            </button>
            ${profiles.length > 1 ? `
              <button type="button" class="btn-card-action btn-del btn-del-account" data-id="${p.id}" title="Hesabı Sil">
                ${Icons.trash}
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');

    // Geçiş Yap Olayı
    listWrap.querySelectorAll('.profile-card-left').forEach(leftEl => {
      leftEl.onclick = () => {
        const id = leftEl.dataset.id;
        if (id === activeId) return;

        const targetP = profiles.find(p => p.id === id);
        if (targetP && targetP.pinEnabled && targetP.pin) {
          // PIN sor
          this.openAccountPinPrompt(targetP, () => {
            this.storage.switchProfile(id);
            document.getElementById('profileModalOverlay').classList.remove('active');
            this.refreshAll();
          });
        } else {
          this.storage.switchProfile(id);
          document.getElementById('profileModalOverlay').classList.remove('active');
          this.refreshAll();
        }
      };
    });

    // Düzenle Olayı
    listWrap.querySelectorAll('.btn-edit-account').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        this.openEditProfileModal(btn.dataset.id);
      };
    });

    // Tekil Hesap Aktar
    listWrap.querySelectorAll('.btn-export-account').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        this.exportSingleAccount(btn.dataset.id);
      };
    });

    // Silme Olayı
    listWrap.querySelectorAll('.btn-del-account').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const targetP = profiles.find(p => p.id === id);
        if (confirm(`"${targetP?.name}" hesabını ve bu hesaba ait tüm geçmiş kayıtları silmek istediğinize emin misiniz?`)) {
          this.storage.deleteProfile(id);
          this.renderProfilesList();
          this.refreshAll();
        }
      };
    });
  }

  // --- Tekil Hesap Düzenleme Modalı ---
  openEditProfileModal(profileId) {
    const profile = this.storage.getProfileById(profileId);
    if (!profile) return;

    const overlay = document.getElementById('editProfileModalOverlay');
    const container = document.getElementById('editProfileFormContainer');
    if (!overlay || !container) return;

    let selectedEmoji = profile.avatarEmoji || '🌸';
    let selectedColor = profile.avatarColor || '#f43f5e';

    container.innerHTML = `
      <div class="form-group-block">
        <label class="picker-label">Hesap Adı:</label>
        <input type="text" id="editAccNameInput" value="${profile.name}" class="form-input">
      </div>

      <div class="form-group-block">
        <label class="picker-label">Hesap Rolü:</label>
        <select id="editAccRoleSelect" class="form-input">
          ${PROFILE_ROLES.map(r => `
            <option value="${r.id}" ${r.id === profile.role ? 'selected' : ''}>${r.name}</option>
          `).join('')}
        </select>
      </div>

      <div class="form-group-block">
        <label class="picker-label">Profil Simgesi (Emoji):</label>
        <div class="emoji-picker-grid" id="editAccEmojiPicker">
          ${PROFILE_EMOJIS.map(em => `
            <button type="button" class="emoji-pick-btn ${em === selectedEmoji ? 'selected' : ''}" data-emoji="${em}">${em}</button>
          `).join('')}
        </div>
      </div>

      <div class="form-group-block">
        <label class="picker-label">Renk:</label>
        <div class="color-picker-grid" id="editAccColorPicker">
          ${PROFILE_COLORS.map(col => `
            <button type="button" class="color-pick-circle ${col === selectedColor ? 'selected' : ''}" data-color="${col}" style="background-color: ${col};"></button>
          `).join('')}
        </div>
      </div>

      <div class="form-group-block" style="border: 1px dashed var(--border-subtle); padding: 12px; border-radius: var(--radius-sm);">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer;">
          <input type="checkbox" id="editAccPinToggle" ${profile.pinEnabled ? 'checked' : ''}>
          <span>🔒 PIN Şifre Koruması</span>
        </label>
        <div id="editAccPinWrap" style="display: ${profile.pinEnabled ? 'block' : 'none'}; margin-top: 8px;">
          <input type="password" id="editAccPinInput" value="${profile.pin || ''}" maxlength="4" placeholder="4 Haneli Sayısal PIN" class="form-input pin-input-field">
        </div>
      </div>

      <button type="button" class="btn-primary-action" id="btnSaveEditAccount" style="margin-top: 10px;">
        ${Icons.check} Değişiklikleri Kaydet
      </button>
    `;

    // Emoji ve Renk seçici
    const emPicker = container.querySelector('#editAccEmojiPicker');
    emPicker.onclick = (e) => {
      const btn = e.target.closest('.emoji-pick-btn');
      if (!btn) return;
      emPicker.querySelectorAll('.emoji-pick-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = btn.dataset.emoji;
    };

    const colPicker = container.querySelector('#editAccColorPicker');
    colPicker.onclick = (e) => {
      const btn = e.target.closest('.color-pick-circle');
      if (!btn) return;
      colPicker.querySelectorAll('.color-pick-circle').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = btn.dataset.color;
    };

    const pinTog = container.querySelector('#editAccPinToggle');
    const pinW = container.querySelector('#editAccPinWrap');
    pinTog.onchange = () => {
      pinW.style.display = pinTog.checked ? 'block' : 'none';
    };

    // Kaydet
    container.querySelector('#btnSaveEditAccount').onclick = () => {
      const newName = container.querySelector('#editAccNameInput').value.trim();
      const newRole = container.querySelector('#editAccRoleSelect').value;
      const isPin = pinTog.checked;
      const pinVal = container.querySelector('#editAccPinInput').value.trim();

      if (!newName) {
        alert('Lütfen bir ad girin!');
        return;
      }
      if (isPin && (pinVal.length !== 4 || !/^\d+$/.test(pinVal))) {
        alert('Lütfen geçerli 4 haneli bir PIN kodu girin!');
        return;
      }

      this.storage.updateProfile(profileId, {
        name: newName,
        role: newRole,
        avatarEmoji: selectedEmoji,
        avatarColor: selectedColor,
        pin: isPin ? pinVal : null,
        pinEnabled: isPin
      });

      overlay.classList.remove('active');
      this.renderProfilesList();
      this.refreshAll();
      alert('Hesap bilgileri başarıyla güncellendi!');
    };

    overlay.classList.add('active');
  }

  // --- Tekil Hesap Dışa Aktar ---
  exportSingleAccount(profileId) {
    const profile = this.storage.getProfileById(profileId);
    if (!profile) return;

    const payload = this.storage.exportSingleProfile(profileId);
    let token = payload;
    try {
      token = btoa(unescape(encodeURIComponent(payload)));
    } catch (e) {
      // fallback
    }

    if (navigator.clipboard) {
      navigator.clipboard.writeText(token).then(() => {
        alert(`📋 "${profile.name}" hesabının aktarım kodu panoya kopyalandı!\n\nDiğer telefonda "Hesabı İçe Aktar" sekmesine yapıştırabilirsiniz.`);
      }).catch(() => {
        prompt('Aşağıdaki kodu kopyalayıp diğer telefona yapıştırın:', token);
      });
    } else {
      prompt('Aşağıdaki kodu kopyalayıp diğer telefona yapıştırın:', token);
    }
  }

  // --- Çevrimdışı & Kurulum Rehberi ---
  openOfflineGuideModal() {
    const overlay = document.getElementById('offlineGuideModalOverlay');
    if (overlay) overlay.classList.add('active');
  }

  triggerPwaInstall() {
    if (window.deferredInstallPrompt) {
      window.deferredInstallPrompt.prompt();
      window.deferredInstallPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Kullanıcı PWA kurulumunu onayladı.');
        }
        window.deferredInstallPrompt = null;
      });
    } else {
      alert('Tarayıcınızın menüsünden (iOS Safari: Paylaş > Ana Ekrana Ekle, Android: Üç Nokta > Uygulamayı Yükle) uygulayabilirsiniz.');
    }
  }

  // --- Sunucusuz Tek Dosya HTML İndirme ---
  downloadStandaloneHtml() {
    fetch('./dongum-offline.html')
      .then(res => {
        if (!res.ok) throw new Error('Dosya okunamadı');
        return res.blob();
      })
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dongum-offline.html';
        a.click();
        URL.revokeObjectURL(url);
        alert('📦 Sunucusuz tek dosya (dongum-offline.html) başarıyla indirildi!\n\nBu dosyayı WhatsApp, AirDrop, Bluetooth veya e-posta ile dilediğiniz telefona gönderebilir ve hiçbir sunucuya ihtiyaç duymadan doğrudan açabilirsiniz.');
      })
      .catch(() => {
        const a = document.createElement('a');
        a.href = './dongum-offline.html';
        a.download = 'dongum-offline.html';
        a.target = '_blank';
        a.click();
      });
  }

  // --- Sekme Render Yöneticisi ---
  renderCurrentTab() {
    const main = document.getElementById('mainContent');
    if (!main) return;

    // Başlıktaki aktif profil bilgilerini güncelle
    const activeProfile = this.storage.getActiveProfile();
    const tagEmoji = document.getElementById('headerChipEmoji');
    const tagName = document.getElementById('headerChipName');
    if (tagEmoji) tagEmoji.textContent = activeProfile.avatarEmoji || '🌸';
    if (tagName) tagName.textContent = activeProfile.name;

    if (this.currentTab === 'home') {
      this.renderHomeTab(main);
    } else if (this.currentTab === 'calendar') {
      this.renderCalendarTab(main);
    } else if (this.currentTab === 'analytics') {
      this.renderAnalyticsTab(main);
    } else if (this.currentTab === 'settings') {
      this.renderSettingsTab(main);
    }
  }

  // ================= 1. GÜNÜM (ÇOK RENKLİ DÖNGÜ ÇARKI VE GÜNLÜK DURUM) =================
  renderHomeTab(container) {
    const summary = this.engine.getTodaySummary();
    const todayStatus = summary.dayStatus;
    const stats = summary.stats;
    const isPeriodToday = todayStatus.phase === 'period';

    // Döngü parametreleri ve gün aralıkları
    const cycleTotal = Math.max(21, stats.averageCycleLength || 28);
    const periodDays = Math.max(2, stats.averagePeriodLength || 5);
    const lutealDays = stats.lutealLength || 14;
    const currentDay = Math.min(cycleTotal, Math.max(1, summary.cycleDayNumber));

    // Biyolojik faz gün aralıkları
    const ovulationDay = Math.max(periodDays + 3, cycleTotal - lutealDays + 1);
    const fertileStart = Math.max(periodDays + 1, ovulationDay - 4);
    const fertileEnd = Math.min(cycleTotal - 1, ovulationDay + 1);
    const follicularStart = periodDays + 1;
    const follicularEnd = Math.max(follicularStart, fertileStart - 1);
    const lutealStart = fertileEnd + 1;
    const lutealEnd = cycleTotal;

    // SVG Çok Renkli Halka Yayları Hesabı (Center: 140, 140, R: 105, Stroke: 16)
    const CX = 140;
    const CY = 140;
    const R = 105;

    const makeArcPath = (startDay, endDay) => {
      if (startDay > endDay) return '';
      const startAngle = ((startDay - 1) / cycleTotal) * 360 - 90;
      const endAngle = (endDay / cycleTotal) * 360 - 90;
      const gap = 1.0;
      const r1 = (startAngle + gap) * (Math.PI / 180);
      const r2 = (endAngle - gap) * (Math.PI / 180);
      const x1 = CX + R * Math.cos(r1);
      const y1 = CY + R * Math.sin(r1);
      const x2 = CX + R * Math.cos(r2);
      const y2 = CY + R * Math.sin(r2);
      const sweepAngle = (endAngle - gap) - (startAngle + gap);
      const largeArc = sweepAngle > 180 ? 1 : 0;
      return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
    };

    // 4 Belirgin Renk
    const colorRegl = '#e11d48';
    const colorFolikuler = '#0d9488';
    const colorOvulasyon = '#f59e0b';
    const colorLuteal = '#c084fc';

    const pathRegl = makeArcPath(1, periodDays);
    const pathFolikuler = makeArcPath(follicularStart, follicularEnd);
    const pathOvulasyon = makeArcPath(fertileStart, fertileEnd);
    const pathLuteal = makeArcPath(lutealStart, lutealEnd);

    // Güncel gün işaretçi boncuğu
    const dayAngle = ((currentDay - 0.5) / cycleTotal) * 360 - 90;
    const dayRad = dayAngle * (Math.PI / 180);
    const bx = (CX + R * Math.cos(dayRad)).toFixed(2);
    const by = (CY + R * Math.sin(dayRad)).toFixed(2);

    // Güncel faz başlığı, rengi ve hap etiketi
    let phaseTitle = 'Normal Evre';
    let fertilityPillText = 'Düşük Doğurganlık';
    let pillClass = 'pill-luteal';
    let beadColor = colorLuteal;

    if (currentDay <= periodDays) {
      phaseTitle = 'Regl Dönemi';
      fertilityPillText = 'Çok Düşük İhtimal';
      pillClass = 'pill-regl';
      beadColor = colorRegl;
    } else if (currentDay <= follicularEnd) {
      phaseTitle = 'Foliküler Faz';
      fertilityPillText = 'Düşük Hamilelik Şansı';
      pillClass = 'pill-folikuler';
      beadColor = colorFolikuler;
    } else if (currentDay >= fertileStart && currentDay <= fertileEnd) {
      if (currentDay === ovulationDay) {
        phaseTitle = 'Yumurtlama Günü';
        fertilityPillText = 'Zirve Doğurganlık';
      } else {
        phaseTitle = 'Doğurgan Pencere';
        fertilityPillText = 'Yüksek Doğurganlık';
      }
      pillClass = 'pill-ovulasyon';
      beadColor = colorRegl;
    } else {
      phaseTitle = (summary.daysUntilNext !== null && summary.daysUntilNext <= 6) ? 'PMS / Luteal Evre' : 'Luteal Evre';
      fertilityPillText = 'Düşük Doğurganlık';
      pillClass = 'pill-luteal';
      beadColor = colorLuteal;
    }

    // Kalan gün metni
    let countdownText = '14 gün';
    if (summary.daysUntilNext !== null) {
      if (summary.daysUntilNext > 0) countdownText = `${summary.daysUntilNext} gün`;
      else if (summary.daysUntilNext === 0) countdownText = 'bugün';
      else countdownText = `${Math.abs(summary.daysUntilNext)} gün gecikme`;
    }

    container.innerHTML = `
      <div class="home-view-wrapper">
        
        <!-- Çevrimdışı / Çevrimiçi Durum ve Mobil Eşleme Çubuğu -->
        <div class="sync-status-bar">
          <div class="status-online-badge" id="btnHomeOfflineBar" style="cursor: pointer;" title="Sunucu kapalıyken kullanım detayları">
            <span class="online-pulse-dot"></span>
            <span>Sunucusuz & Çevrimdışı Hazır ℹ️</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button type="button" class="btn-quick-sync" id="btnHomeInstallModal" title="Telefona yükle & internetsiz kullan">
              ${Icons.phone} Telefona Yükle
            </button>
            <button type="button" class="btn-quick-sync" id="btnOpenSyncModal" title="Farklı telefona aktar veya eşle">
              ${Icons.refresh} Eşleme
            </button>
          </div>
        </div>

        <!-- Çok Renkli Segmentli Döngü Çarkı (Cycle Dial) -->
        <div class="cycle-dial-container-segmented">
          <svg class="cycle-svg-segmented" viewBox="0 0 280 280">
            <defs>
              <filter id="beadShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.22)" />
              </filter>
            </defs>

            <!-- Arka plan ince kılavuz halkası -->
            <circle cx="140" cy="140" r="105" fill="none" stroke="rgba(226, 232, 240, 0.6)" stroke-width="15" />

            <!-- 1. Regl Yayı -->
            ${pathRegl ? `<path d="${pathRegl}" fill="none" stroke="${colorRegl}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- 2. Foliküler Yayı -->
            ${pathFolikuler ? `<path d="${pathFolikuler}" fill="none" stroke="${colorFolikuler}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- 3. Ovulasyon / Doğurgan Pencere Yayı -->
            ${pathOvulasyon ? `<path d="${pathOvulasyon}" fill="none" stroke="${colorOvulasyon}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- 4. Luteal Yayı -->
            ${pathLuteal ? `<path d="${pathLuteal}" fill="none" stroke="${colorLuteal}" stroke-width="15" stroke-linecap="round" />` : ''}

            <!-- Güncel Gün İşaretçi Boncuğu (Bead Pointer) -->
            <circle cx="${bx}" cy="${by}" r="14" fill="#ffffff" stroke="${beadColor}" stroke-width="3.5" filter="url(#beadShadow)" />
            <circle cx="${bx}" cy="${by}" r="6.5" fill="${beadColor}" />
          </svg>

          <!-- Çark İçi Metinler -->
          <div class="dial-center-box">
            <span class="dial-sub-title">DÖNGÜ GÜNÜ</span>
            <div class="dial-big-day">
              <span class="day-val">${currentDay}</span><span class="day-total">/${cycleTotal}</span>
            </div>
            <div class="dial-phase-text">${phaseTitle}</div>
            <div class="dial-fertility-pill ${pillClass}">
              ${fertilityPillText}
            </div>
            <div class="dial-countdown-text">
              Sonraki regle <strong>${countdownText}</strong>
            </div>
          </div>
        </div>

        <!-- Çark Altı Evre Açıklamaları (Legend) -->
        <div class="dial-legend-row">
          <div class="legend-pill-item">
            <span class="legend-circle" style="background-color: ${colorRegl};"></span>
            <span>Regl (1-${periodDays})</span>
          </div>
          <div class="legend-pill-item">
            <span class="legend-circle" style="background-color: ${colorFolikuler};"></span>
            <span>Foliküler (${follicularStart}-${follicularEnd})</span>
          </div>
          <div class="legend-pill-item">
            <span class="legend-circle" style="background-color: ${colorOvulasyon};"></span>
            <span>Ovulasyon (${ovulationDay})</span>
          </div>
          <div class="legend-pill-item">
            <span class="legend-circle" style="background-color: ${colorLuteal};"></span>
            <span>Luteal (${lutealStart}-${lutealEnd})</span>
          </div>
        </div>

        <!-- Hızlı Aksiyon Kartı (Bugün Regl Başlat / Bitir) -->
        <div class="quick-action-card">
          <div class="qa-text">
            <h4>${isPeriodToday ? 'Bugün Regl Kaydedildi' : 'Bugün Regl Oldun mu?'}</h4>
            <p>${isPeriodToday ? 'Kanama kaydını kapatabilir veya akışı düzenleyebilirsiniz.' : 'Tek dokunuşla kaydet ve tahminleri yenile.'}</p>
          </div>
          <button type="button" class="btn-quick-period ${isPeriodToday ? 'btn-active-period' : ''}" id="btnHomeQuickPeriod">
            ${isPeriodToday ? 'Regl Bitti' : '🩸 Regl Başladı'}
          </button>
        </div>

        <!-- Günlük Sağlık ve Hamilelik Olasılığı Kartı -->
        <div class="daily-insight-card">
          <div class="insight-row">
            <div class="insight-item">
              <span class="ins-title">Hamilelik Şansı</span>
              <strong class="ins-val" style="color: ${beadColor};">${todayStatus.pregnancyChance}</strong>
            </div>
            <div class="insight-divider"></div>
            <div class="insight-item">
              <span class="ins-title">Döngü Ritim Skoru</span>
              <strong class="ins-val" style="color: #10b981;">%${stats.regularityScore} Düzenli</strong>
            </div>
          </div>
          <p class="insight-advice">
            ${this.getPhaseAdvice(todayStatus.phase)}
          </p>
        </div>

        <!-- Hızlı Gün İnceleme & Semptom Ekleme Butonu -->
        <div class="home-bottom-actions">
          <button type="button" class="btn-log-symptoms" id="btnHomeLogToday">
            ${Icons.sparkles} Bugünün Semptom & Ruh Halini Ekle
          </button>
        </div>

        <!-- Cihazlar Arası Eşleme Modalı -->
        <div class="modal-overlay" id="syncModalOverlay">
          <div class="modal-sheet sync-modal-sheet">
            <div class="modal-header-row">
              <h3>📱 Cihazlar Arası Eşleme & Senkronizasyon</h3>
              <button type="button" class="modal-close-btn" id="btnCloseSyncModal">${Icons.close}</button>
            </div>
            <p class="sheet-desc">
              Uygulamanız %100 çevrimdışı çalışır. Tüm profillerinizi ve verilerinizi başka bir telefona aktarmak veya aynı anda birden fazla telefonda kullanmak için aşağıdaki eşleme kodunu kullanabilirsiniz.
            </p>

            <div class="sync-code-box">
              <label class="section-label">📋 Bu Cihazın Eşleme Kodu</label>
              <textarea readonly class="form-input sync-textarea" id="syncCodeOutput"></textarea>
              <button type="button" class="btn-primary-action" id="btnCopySyncCode">
                ${Icons.check} Kodu Kopyala
              </button>
            </div>

            <div class="sync-import-box" style="margin-top: 18px;">
              <label class="section-label">📥 Başka Telefondan Kod Yapıştır</label>
              <textarea placeholder="Diğer telefondan aldığınız eşleme kodunu buraya yapıştırın..." class="form-input sync-textarea" id="syncCodeInput"></textarea>
              <button type="button" class="btn-primary-action" style="background: var(--secondary-gradient); margin-top: 8px;" id="btnApplySyncCode">
                ${Icons.refresh} Verileri Bu Telefona Aktar
              </button>
            </div>
          </div>
        </div>

      </div>
    `;

    // Buton Olayları
    const quickPeriodBtn = container.querySelector('#btnHomeQuickPeriod');
    const logTodayBtn = container.querySelector('#btnHomeLogToday');
    const btnOfflineBar = container.querySelector('#btnHomeOfflineBar');
    const btnHomeInstall = container.querySelector('#btnHomeInstallModal');
    const btnOpenSync = container.querySelector('#btnOpenSyncModal');
    const btnCloseSync = container.querySelector('#btnCloseSyncModal');
    const syncOverlay = container.querySelector('#syncModalOverlay');
    const syncOutput = container.querySelector('#syncCodeOutput');
    const btnCopySync = container.querySelector('#btnCopySyncCode');
    const syncInput = container.querySelector('#syncCodeInput');
    const btnApplySync = container.querySelector('#btnApplySyncCode');

    if (btnOfflineBar) btnOfflineBar.onclick = () => this.openOfflineGuideModal();
    if (btnHomeInstall) btnHomeInstall.onclick = () => this.openOfflineGuideModal();

    if (quickPeriodBtn) {
      quickPeriodBtn.onclick = () => {
        if (isPeriodToday) {
          this.engine.togglePeriodDay(summary.todayStr, false);
        } else {
          this.engine.logPeriodStart(summary.todayStr, 'medium');
        }
        this.refreshAll();
      };
    }

    if (logTodayBtn) {
      logTodayBtn.onclick = () => {
        this.switchTab('calendar');
        setTimeout(() => {
          if (this.calendarComp) {
            this.calendarComp.goToDate(summary.todayStr);
          }
        }, 100);
      };
    }

    // Eşleme Modalı Aç/Kapat
    if (btnOpenSync && syncOverlay) {
      btnOpenSync.onclick = () => {
        const fullBackup = this.storage.exportBackup();
        try {
          const encoded = btoa(unescape(encodeURIComponent(fullBackup)));
          syncOutput.value = encoded;
        } catch (e) {
          syncOutput.value = fullBackup;
        }
        syncOverlay.classList.add('active');
      };
    }

    if (btnCloseSync && syncOverlay) {
      btnCloseSync.onclick = () => syncOverlay.classList.remove('active');
      syncOverlay.onclick = (e) => {
        if (e.target === syncOverlay) syncOverlay.classList.remove('active');
      };
    }

    if (btnCopySync && syncOutput) {
      btnCopySync.onclick = () => {
        syncOutput.select();
        navigator.clipboard.writeText(syncOutput.value).then(() => {
          alert('Eşleme kodu panoya kopyalandı! Diğer telefonunuza mesaj veya WhatsApp ile gönderebilirsiniz.');
        }).catch(() => {
          alert('Lütfen kutudaki metni seçip kopyalayın.');
        });
      };
    }

    if (btnApplySync && syncInput) {
      btnApplySync.onclick = () => {
        const raw = syncInput.value.trim();
        if (!raw) {
          alert('Lütfen geçerli bir eşleme kodu yapıştırın!');
          return;
        }
        try {
          let jsonStr = raw;
          if (!raw.startsWith('{')) {
            jsonStr = decodeURIComponent(escape(atob(raw)));
          }
          const res = this.storage.importBackup(jsonStr);
          if (res.success) {
            alert('Tüm verileriniz ve döngü geçmişiniz bu telefona başarıyla aktarıldı!');
            syncOverlay.classList.remove('active');
            this.refreshAll();
          } else {
            alert('Eşleme kodu çözülemedi: ' + res.message);
          }
        } catch (err) {
          alert('Geçersiz eşleme kodu formatı!');
        }
      };
    }
  }

  getPhaseAdvice(phase) {
    switch (phase) {
      case 'period':
        return '🩸 Menstrüasyon evresindesiniz. Sıcak su torbası, magnezyum ağırlıklı beslenme ve hafif yürüyüşler krampları hafifletir.';
      case 'follicular':
        return '🌱 Foliküler fazdasınız. Östrojen yükselirken enerjiniz ve odaklanma gücünüz zirveye tırmanıyor.';
      case 'fertile':
      case 'ovulation':
        return '🌸 Doğurganlık penceresindesiniz. Enerjiniz ve sosyalleşme isteğiniz yüksek, vücut sıcaklığınız hafif yükselebilir.';
      case 'pms':
        return '🌙 Luteal / PMS dönemi. Progesteron etkisiyle dinlenmeye, bol su tüketmeye ve sakin aktivitelere öncelik verin.';
      default:
        return '✨ Hormonal dengeniz sağlıklı seyrinde. Düzenli uyku ve dengeli su tüketimi döngünüzü destekler.';
    }
  }

  // ================= 2. TAKVİM SEKMESİ =================
  renderCalendarTab(container) {
    container.innerHTML = `<div id="calendarMount"></div>`;
    const mount = container.querySelector('#calendarMount');
    this.calendarComp = new CalendarComponent(mount, this.engine, this.storage, () => {
      this.refreshAll(false);
    });
    this.calendarComp.render();
  }

  // ================= 3. ANALİZ SEKMESİ =================
  renderAnalyticsTab(container) {
    container.innerHTML = `<div id="analyticsMount"></div>`;
    const mount = container.querySelector('#analyticsMount');
    this.analyticsComp = new AnalyticsComponent(mount, this.engine, this.storage, (targetDate) => {
      this.switchTab('calendar');
      setTimeout(() => {
        if (this.calendarComp) {
          this.calendarComp.goToDate(targetDate);
        }
      }, 100);
    });
    this.analyticsComp.render();
  }

  // ================= 4. AYARLAR & GİZLİLİK SEKMESİ =================
  renderSettingsTab(container) {
    this.engine.syncSettingsFromCalendarData();
    const data = this.storage.getProfileData();
    const settings = data.settings;
    const stats = this.engine.calculateStats();
    const activeProfile = this.storage.getActiveProfile();
    const profiles = this.storage.getProfiles();

    container.innerHTML = `
      <div class="settings-view-wrapper">
        <div class="settings-header">
          <h2 class="section-heading">Ayarlar & Gizlilik</h2>
          <p class="section-subheading">Kişisel sağlık verileriniz, hesaplar ve uygulama tercihleri</p>
        </div>

        <!-- Aktif Hesap & Çoklu Profil Kartı -->
        <div class="settings-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: ${activeProfile.avatarColor || '#f43f5e'};">
              ${activeProfile.avatarEmoji || '🌸'}
            </span>
            <div class="box-text">
              <h3>Aktif Hesap: ${activeProfile.name}</h3>
              <p>Mevcut cihazda toplam <strong>${profiles.length}</strong> profil tanımlı</p>
            </div>
          </div>
          <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button type="button" class="btn-primary-action" id="btnSettingsManageProfiles" style="flex: 1;">
              👥 Hesapları Yönet / Değiştir
            </button>
            <button type="button" class="btn-primary-action" id="btnSettingsAddProfile" style="background: var(--secondary-gradient); flex: 1;">
              ${Icons.plus} Yeni Hesap Ekle
            </button>
          </div>
        </div>

        <!-- Sunucusuz Çevrimdışı Kullanım & Kurulum Kartı -->
        <div class="settings-box" style="border: 1.5px solid rgba(16, 185, 129, 0.4);">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #10b981;">${Icons.phone}</span>
            <div class="box-text">
              <h3 style="color: #10b981;">Sunucusuz & Çevrimdışı Mobil Kullanım</h3>
              <p>Sunucu kapalıyken telefonunuzdan her an açıp kullanın</p>
            </div>
          </div>
          <p style="font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.4;">
            Döngüm, telefonunuza bir kez eklendikten sonra bilgisayarınızı veya sunucuyu kapatsanız dahi telefonun kendi hafızasından %100 bağımsız çalışmaya devam eder.
          </p>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <button type="button" class="btn-primary-action" id="btnSettingsOfflineGuide" style="background: #10b981;">
              📱 Telefona Yükleme Rehberi (iOS & Android)
            </button>
            <button type="button" class="btn-primary-action" id="btnSettingsDownloadHtml" style="background: #0284c7;">
              📦 Sunucusuz Tek Dosya (HTML) İndir & Paylaş
            </button>
          </div>
        </div>

        <!-- Döngü & Biyolojik Parametreler -->
        <div class="settings-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #8b5cf6;">${Icons.sparkles}</span>
            <div class="box-text">
              <h3>Döngü Parametreleri (${activeProfile.name})</h3>
              <p>Bu hesaba özel akıllı biyolojik hesaplama değerleri</p>
            </div>
          </div>

          ${stats && stats.totalLoggedCycles > 0 ? `
            <div style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 14px; display: flex; align-items: flex-start; gap: 8px;">
              <span style="font-size: 1.15rem; line-height: 1;">✨</span>
              <div style="font-size: 0.78rem; color: var(--text-primary); line-height: 1.4;">
                <strong>Takvim Verilerinize Göre Otomatik Revize Edildi:</strong><br>
                Takvimdeki ${stats.totalLoggedCycles} adet döngü geçmişinize göre ortalama döngü süreniz <strong>${settings.cycleLength} gün</strong>, regl süreniz <strong>${settings.periodLength} gün</strong> olarak güncellenmiştir.
              </div>
            </div>
          ` : `
            <div style="background: rgba(99, 102, 241, 0.08); border: 1px dashed rgba(99, 102, 241, 0.3); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 14px; font-size: 0.74rem; color: var(--text-muted); line-height: 1.35;">
              💡 <strong>Akıllı Otomatik Güncelleme:</strong> Takvimde regl başlangıç ve bitiş günlerinizi işaretledikçe, ortalama döngü ve regl parametreleriniz otomatik olarak revize edilir.
            </div>
          `}

          <div class="setting-input-row">
            <label>Varsayılan Döngü Uzunluğu (Gün):</label>
            <input type="number" id="settingCycleLen" value="${settings.cycleLength}" min="20" max="50" class="form-input">
          </div>

          <div class="setting-input-row">
            <label>Varsayılan Regl Süresi (Gün):</label>
            <input type="number" id="settingPeriodLen" value="${settings.periodLength}" min="2" max="12" class="form-input">
          </div>

          <div class="setting-input-row">
            <label>Luteal Faz Süresi (Gün):</label>
            <input type="number" id="settingLutealLen" value="${settings.lutealLength}" min="10" max="18" class="form-input">
          </div>
          <button type="button" class="btn-save-settings" id="btnSaveCycleSettings">
            ${Icons.check} Parametreleri Kaydet
          </button>
        </div>

        <!-- Güvenlik & 4 Haneli PIN Kodu -->
        <div class="settings-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #10b981;">${Icons.lock}</span>
            <div class="box-text">
              <h3>Bu Hesabın PIN Kilit Koruması</h3>
              <p>Bu hesaba başkalarının erişimini 4 haneli PIN ile kısıtlayın</p>
            </div>
          </div>

          <div class="pin-status-row">
            <span>PIN Durumu: <strong>${settings.pinEnabled ? '✅ Aktif' : '❌ Kapalı'}</strong></span>
            ${settings.pinEnabled ? `
              <button type="button" class="btn-danger-outline" id="btnDisablePin">PIN'i Kapat</button>
            ` : `
              <div class="set-pin-group">
                <input type="password" id="inputNewPin" maxlength="4" placeholder="4 Haneli PIN" class="form-input pin-input-field">
                <button type="button" class="btn-primary-action" id="btnEnablePin">PIN Belirle</button>
              </div>
            `}
          </div>
        </div>

        <!-- Veri Yedekleme ve Gizlilik (Export / Import) -->
        <div class="settings-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #0284c7;">${Icons.shield}</span>
            <div class="box-text">
              <h3>Tüm Verileri Yedekle & Rapor</h3>
              <p>%100 Cihazınızda saklanan tüm hesaplarınızı yedekleyin</p>
            </div>
          </div>

          <div class="backup-buttons-row">
            <button type="button" class="btn-backup btn-doctor-pdf-backup" id="btnSettingsDoctorReport">
              🩺 Jinekolog Sağlık Raporu (PDF İndir)
            </button>
            <button type="button" class="btn-backup" id="btnExportBackup">
              ${Icons.download} Tüm Profilleri Yedekle (JSON İndir)
            </button>
            <label class="btn-backup btn-upload-label">
              ${Icons.upload} Yedekten Geri Yükle
              <input type="file" id="fileImportBackup" accept=".json" style="display: none;">
            </label>
          </div>
        </div>

        <!-- Profil Verilerini Sıfırlama -->
        <div class="settings-box danger-box">
          <div class="settings-box-header">
            <span class="box-icon" style="color: #ef4444;">${Icons.trash}</span>
            <div class="box-text">
              <h3 style="color: #ef4444;">"${activeProfile.name}" Hesabının Verilerini Sıfırla</h3>
              <p>Mevcut hesabın tüm regl ve semptom geçmişini siler.</p>
            </div>
          </div>
          <button type="button" class="btn-danger-full" id="btnResetData">
            Bu Hesabın Verilerini Sıfırla
          </button>
        </div>
      </div>
    `;

    this.bindSettingsEvents(container);
  }

  bindSettingsEvents(container) {
    // Profil yönetimi butonları
    const btnManage = container.querySelector('#btnSettingsManageProfiles');
    if (btnManage) btnManage.onclick = () => this.openProfileModal('list');

    const btnAdd = container.querySelector('#btnSettingsAddProfile');
    if (btnAdd) btnAdd.onclick = () => this.openProfileModal('create');

    // Çevrimdışı rehber & tek dosya
    const btnOffline = container.querySelector('#btnSettingsOfflineGuide');
    if (btnOffline) btnOffline.onclick = () => this.openOfflineGuideModal();

    const btnDownloadHtml = container.querySelector('#btnSettingsDownloadHtml');
    if (btnDownloadHtml) btnDownloadHtml.onclick = () => this.downloadStandaloneHtml();

    // Jinekolog Raporu Butonu
    const btnDrReport = container.querySelector('#btnSettingsDoctorReport');
    if (btnDrReport) {
      btnDrReport.onclick = () => {
        this.reportGen.openReportModal();
      };
    }

    // Döngü Parametrelerini Kaydet
    const btnSaveCycle = container.querySelector('#btnSaveCycleSettings');
    if (btnSaveCycle) {
      btnSaveCycle.onclick = () => {
        const cLen = parseInt(container.querySelector('#settingCycleLen').value, 10) || 28;
        const pLen = parseInt(container.querySelector('#settingPeriodLen').value, 10) || 5;
        const lLen = parseInt(container.querySelector('#settingLutealLen').value, 10) || 14;

        this.storage.updateSettings({
          cycleLength: cLen,
          periodLength: pLen,
          lutealLength: lLen
        });

        alert('Döngü parametreleriniz başarıyla kaydedildi!');
        this.refreshAll();
      };
    }

    // PIN Aktif Et
    const btnEnablePin = container.querySelector('#btnEnablePin');
    if (btnEnablePin) {
      btnEnablePin.onclick = () => {
        const pinVal = container.querySelector('#inputNewPin').value.trim();
        if (pinVal.length === 4 && /^\d+$/.test(pinVal)) {
          this.storage.setPin(pinVal);
          alert('4 Haneli PIN kilidi başarıyla etkinleştirildi!');
          this.renderSettingsTab(container);
        } else {
          alert('Lütfen geçerli 4 haneli sayısal bir PIN kodu girin!');
        }
      };
    }

    // PIN Devre Dışı Bırak
    const btnDisablePin = container.querySelector('#btnDisablePin');
    if (btnDisablePin) {
      btnDisablePin.onclick = () => {
        if (confirm('PIN kilidini kapatmak istediğinize emin misiniz?')) {
          this.storage.disablePin();
          this.renderSettingsTab(container);
        }
      };
    }

    // Dışa Aktar (JSON Export)
    const btnExport = container.querySelector('#btnExportBackup');
    if (btnExport) {
      btnExport.onclick = () => {
        const jsonStr = this.storage.exportBackup();
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Dongum_Tum_Profiller_${CycleEngine.formatDateStr(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };
    }

    // İçe Aktar (JSON Import)
    const fileImport = container.querySelector('#fileImportBackup');
    if (fileImport) {
      fileImport.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const res = this.storage.importBackup(event.target.result);
          if (res.success) {
            alert('Yedek başarıyla yüklendi! Profiller ve veriler güncellendi.');
            this.refreshAll();
          } else {
            alert('Yedek yükleme başarısız oldu: ' + res.message);
          }
        };
        reader.readAsText(file);
      };
    }

    // Sıfırla
    const btnReset = container.querySelector('#btnResetData');
    if (btnReset) {
      btnReset.onclick = () => {
        const p = this.storage.getActiveProfile();
        if (confirm(`DİKKAT: "${p.name}" hesabının tüm geçmiş döngü ve semptom kayıtları silinecek! Devam etmek istiyor musunuz?`)) {
          this.storage.resetActiveProfile();
          alert('Hesap verileri başarıyla sıfırlandı.');
          this.refreshAll();
        }
      };
    }
  }

  // Tüm ekranları ve modelleri tazele
  refreshAll(rerenderCurrentTab = true) {
    if (rerenderCurrentTab) {
      this.renderCurrentTab();
    }
    const activeProfile = this.storage.getActiveProfile();
    const tagEmoji = document.getElementById('headerChipEmoji');
    const tagName = document.getElementById('headerChipName');
    if (tagEmoji) tagEmoji.textContent = activeProfile.avatarEmoji || '🌸';
    if (tagName) tagName.textContent = activeProfile.name;
  }
}

// Uygulamayı başlat
document.addEventListener('DOMContentLoaded', () => {
  window.app = new DongumApp();
});

  </script>

  <!-- PWA Service Worker & Kurulum Olayı -->
  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('Döngüm Çevrimdışı Hizmeti (PWA) Aktif:', reg.scope);
        }).catch(function(err) {
          console.warn('SW kayıt notu:', err);
        });
      });
    }
  </script>
